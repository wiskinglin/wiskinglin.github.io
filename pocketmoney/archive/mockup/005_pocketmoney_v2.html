<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketMoney v2 - 全方位理財管理</title>
  
  <script>
    (function () {
      const savedTheme = localStorage.getItem('PocketMoney_theme');
      if (savedTheme === 'light') document.documentElement.classList.remove('dark');
      else document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- Web Manifest & Icons -->
  <link rel="manifest" href="pocketmoney.webmanifest">
  <link rel="apple-touch-icon" href="icons/pocketmoney.png">
  <link rel="icon" type="image/png" href="icons/pocketmoney.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC & Public Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- 資料庫相依支援 (同時嘗試多個相對路徑) -->
  <script src="./database/dummy_db_embedded.js"></script>
  <script src="../database/dummy_db_embedded.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Public Sans', 'Inter', 'Noto Sans TC', 'sans-serif'],
            mono: ['JetBrains Mono', 'Public Sans', 'monospace']
          },
          colors: {
            nord: {
              0: '#2E3440',
              1: '#3B4252',
              2: '#434C5E',
              3: '#4C566A',
              4: '#D8DEE9',
              5: '#E5E9F0',
              6: '#ECEFF4',
              7: '#8FBCBB',
              8: '#88C0D0',
              9: '#81A1C1',
              10: '#5E81AC',
              11: '#BF616A',
              12: '#D08770',
              13: '#EBCB8B',
              14: '#A3BE8C',
              15: '#B48EAD'
            },
            slate: {
              50: '#ECEFF4', 100: '#E5E9F0', 200: '#D8DEE9', 300: '#B8C2D3',
              400: '#8C97AB', 500: '#667186', 600: '#4C566A', 700: '#3B4252',
              800: '#2E3440', 900: '#242933', 950: '#1D2129'
            }
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --ui-primary: #88C0D0;
      --ui-radius: 0.625rem;
      --pad-page: clamp(0.75rem, 3.2vw, 1.75rem);
      --pad-card: clamp(0.875rem, 3.5vw, 1.35rem);
      --gap-grid: clamp(0.75rem, 2.8vw, 1.25rem);
      --fs-hero: clamp(1.45rem, 5.8vw, 2.1rem);
      --fs-h2: clamp(1.02rem, 3.8vw, 1.25rem);
      --fs-h3: clamp(0.92rem, 3.4vw, 1.08rem);
      --fs-body: clamp(0.78rem, 2.9vw, 0.875rem);
      --fs-sub: clamp(0.7rem, 2.5vw, 0.78rem);
    }

    body {
      font-family: 'Public Sans', 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 隱藏數字輸入框預設上下箭頭 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 隱私遮罩：金額模糊 */
    .privacy-masked .masked-amount {
      filter: blur(5px);
      user-select: none;
    }

    /* 捲軸自訂 */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(46, 52, 64, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: #4C566A;
      border-radius: 9999px;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .num-nowrap {
      white-space: nowrap !important;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    /* 模式轉場動效 */
    .mode-fade {
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(136, 192, 208, 0.45); }
      50% { box-shadow: 0 0 0 6px rgba(136, 192, 208, 0); }
    }
    .pulse-glow {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    /* UCard / FluidCard 風格 */
    .fluid-card {
      padding: var(--pad-card);
      border-radius: clamp(0.75rem, 3vw, 1rem);
    }

    .tab-pill-btn.active {
      background-color: #88C0D0;
      color: #2E3440;
      font-weight: 700;
      box-shadow: 0 2px 8px -2px rgba(136, 192, 208, 0.4);
    }
    .dark .tab-pill-btn.active {
      background-color: #88C0D0;
      color: #242933;
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-[#242933] text-slate-800 dark:text-nord-6 min-h-screen transition-colors duration-200 pb-20 selection:bg-nord-8 selection:text-nord-0">

  <!-- ==================== 本地 PIN 碼鎖定遮罩 ==================== -->
  <div id="pinLockModal" class="fixed inset-0 z-50 bg-[#242933]/95 backdrop-blur-md flex flex-col items-center justify-center p-5 hidden">
    <div class="w-full max-w-xs bg-white dark:bg-nord-1 border border-slate-200 dark:border-nord-2 rounded-3xl p-6 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-2xl bg-nord-8/15 text-nord-8 flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-base font-bold mb-1 text-slate-800 dark:text-nord-6">安全鎖定中</h2>
      <p class="text-xs text-slate-500 dark:text-nord-4 mb-5">請輸入 4 位數本地 PIN 碼解鎖</p>

      <div class="flex justify-center gap-3.5 mb-4" id="pinDots">
        <div class="w-3.5 h-3.5 rounded-full border-2 border-nord-8 transition-all"></div>
        <div class="w-3.5 h-3.5 rounded-full border-2 border-nord-8 transition-all"></div>
        <div class="w-3.5 h-3.5 rounded-full border-2 border-nord-8 transition-all"></div>
        <div class="w-3.5 h-3.5 rounded-full border-2 border-nord-8 transition-all"></div>
      </div>
      <p id="pinErrorMsg" class="text-xs text-rose-500 h-4 mb-3 font-semibold"></p>

      <div class="grid grid-cols-3 gap-2.5">
        <button onclick="enterPinDigit('1')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">1</button>
        <button onclick="enterPinDigit('2')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">2</button>
        <button onclick="enterPinDigit('3')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">3</button>
        <button onclick="enterPinDigit('4')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">4</button>
        <button onclick="enterPinDigit('5')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">5</button>
        <button onclick="enterPinDigit('6')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">6</button>
        <button onclick="enterPinDigit('7')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">7</button>
        <button onclick="enterPinDigit('8')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">8</button>
        <button onclick="enterPinDigit('9')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">9</button>
        <button onclick="clearPinDigits()" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 text-xs font-semibold text-slate-500 dark:text-nord-4">清除</button>
        <button onclick="enterPinDigit('0')" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 active:bg-nord-8 active:text-nord-0 font-bold text-base text-slate-800 dark:text-nord-6">0</button>
        <button onclick="backspacePinDigit()" class="h-11 rounded-xl bg-slate-100 dark:bg-nord-0 text-slate-500 dark:text-nord-4"><i class="fa-solid fa-delete-left"></i></button>
      </div>
    </div>
  </div>

  <!-- ==================== 頂部全域導覽 (Header) ==================== -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-[#2E3440]/95 backdrop-blur-md border-b border-slate-200 dark:border-nord-2 px-3 sm:px-6 py-2.5 transition-colors">
    <div class="max-w-6xl mx-auto flex flex-col gap-2">
      
      <!-- 第一層：Brand Logo + Persona 切換 + 雙模式切換 + 實用工具 -->
      <div class="flex items-center justify-between gap-2">
        
        <!-- 左側：品牌 Logo 與當前模式標籤 -->
        <div class="flex items-center space-x-2.5 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-nord-10 to-nord-8 flex items-center justify-center text-nord-0 font-bold shrink-0 shadow-sm">
            <i class="fa-solid fa-wallet text-sm"></i>
          </div>
          <div class="flex items-center space-x-1.5 truncate">
            <span class="text-base font-bold tracking-tight text-slate-800 dark:text-nord-6">PocketMoney</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded font-bold bg-nord-8/20 text-nord-8">v2</span>
            <!-- 模式徽章：瀏覽 / 輸入中 -->
            <span id="header-mode-badge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-100 dark:bg-nord-2 text-slate-600 dark:text-nord-4 border border-slate-200 dark:border-nord-3/40">
              瀏覽
            </span>
          </div>
        </div>

        <!-- 右側動作區：Persona (初級/勇者/高級) + 隱私遮罩 + PIN 鎖 + 主題 + 核心模式切換鈕 -->
        <div class="flex items-center space-x-1.5 shrink-0">
          
          <!-- Persona 切換器 (PC 端顯示按鈕群，手機端顯示 Select) -->
          <div class="hidden md:flex items-center bg-slate-100 dark:bg-nord-1 p-0.5 rounded-lg border border-slate-200 dark:border-nord-2 text-xs">
            <button id="prof-btn-junior" onclick="switchProfile('junior')" class="px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-nord-4 hover:text-slate-900 dark:hover:text-nord-6 transition">初級大人</button>
            <button id="prof-btn-family" onclick="switchProfile('family')" class="px-2.5 py-1 rounded-md font-bold bg-nord-8 text-nord-0 transition">少子化勇者</button>
            <button id="prof-btn-senior" onclick="switchProfile('senior')" class="px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-nord-4 hover:text-slate-900 dark:hover:text-nord-6 transition">高級大人</button>
          </div>

          <!-- 手機版 Persona 下拉選單 -->
          <div class="md:hidden">
            <select id="persona-select-mobile" onchange="switchProfile(this.value)" class="bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-8 font-semibold text-xs py-1.5 px-2 rounded-lg border border-slate-200 dark:border-nord-2 focus:outline-none">
              <option value="junior">初級大人</option>
              <option value="family" selected>少子化勇者</option>
              <option value="senior">高級大人</option>
            </select>
          </div>

          <!-- 隱私遮罩開關 -->
          <button onclick="togglePrivacyMode()" title="切換金額隱私遮罩"
            class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-nord-1 border border-slate-200 dark:border-nord-2 text-slate-600 dark:text-nord-4 hover:text-nord-8 flex items-center justify-center transition-colors">
            <i id="privacy-icon" class="fa-regular fa-eye text-xs"></i>
          </button>

          <!-- PIN 碼手動鎖定按鈕 -->
          <button onclick="triggerPinLockOrSetup()" title="PIN 碼安全鎖定"
            class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-nord-1 border border-slate-200 dark:border-nord-2 text-slate-600 dark:text-nord-4 hover:text-nord-8 flex items-center justify-center transition-colors">
            <i class="fa-solid fa-lock text-xs"></i>
          </button>

          <!-- 深淺色切換 -->
          <button onclick="toggleTheme()" title="切換深淺色外觀"
            class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-nord-1 border border-slate-200 dark:border-nord-2 text-slate-600 dark:text-nord-4 hover:text-nord-8 flex items-center justify-center transition-colors">
            <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
          </button>

          <!-- 核心「+ 輸入 / ✕ 瀏覽」切換鈕 -->
          <button id="btn-mode-toggle" onclick="toggleViewInputMode()"
            class="h-8 px-3 rounded-lg bg-nord-8 hover:bg-nord-7 text-nord-0 font-bold text-xs flex items-center space-x-1 shadow-md shadow-nord-8/20 transition-all pulse-glow">
            <i id="mode-toggle-icon" class="fa-solid fa-plus text-xs"></i>
            <span id="mode-toggle-text">輸入</span>
          </button>

        </div>
      </div>

      <!-- 第二層：7 大分類功能頁籤導覽列 (總覽 + 信用卡費 + 銀行餘額 + 固定費用 + 分期付款 + 投資部位與設定) -->
      <nav class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 border-t border-slate-100 dark:border-nord-2/60">
        <button id="nav-dashboard" onclick="switchCategoryTab('dashboard')"
          class="tab-pill-btn active num-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0 bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-4">
          <i class="fa-solid fa-chart-pie"></i>
          <span>總覽</span>
        </button>

        <button id="nav-cards" onclick="switchCategoryTab('cards')"
          class="tab-pill-btn num-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0 bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-4">
          <i class="fa-regular fa-credit-card text-nord-8"></i>
          <span>信用卡費</span>
        </button>

        <button id="nav-banks" onclick="switchCategoryTab('banks')"
          class="tab-pill-btn num-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0 bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-4">
          <i class="fa-solid fa-building-columns text-nord-9"></i>
          <span>銀行餘額</span>
        </button>

        <button id="nav-bills" onclick="switchCategoryTab('bills')"
          class="tab-pill-btn num-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0 bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-4">
          <i class="fa-solid fa-calendar-check text-nord-7"></i>
          <span>固定費用</span>
        </button>

        <button id="nav-installments" onclick="switchCategoryTab('installments')"
          class="tab-pill-btn num-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0 bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-4">
          <i class="fa-solid fa-layer-group text-nord-15"></i>
          <span>分期付款</span>
        </button>

        <button id="nav-stocks" onclick="switchCategoryTab('stocks')"
          class="tab-pill-btn num-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0 bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-4">
          <i class="fa-solid fa-arrow-trend-up text-nord-14"></i>
          <span>投資部位</span>
        </button>

        <button id="nav-settings" onclick="switchCategoryTab('settings')"
          class="tab-pill-btn num-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0 bg-slate-100 dark:bg-nord-1 text-slate-700 dark:text-nord-4">
          <i class="fa-solid fa-gear"></i>
          <span>設定</span>
        </button>
      </nav>

    </div>
  </header>

  <!-- ==================== 主內容視圖容器 ==================== -->
  <main class="max-w-6xl mx-auto px-3 sm:px-6 pt-4 space-y-6">

    <!-- ==================== [模式一]：瀏覽模式 (View Mode) ==================== -->
    <div id="view-mode-container" class="space-y-6 mode-fade">

      <!-- 1. 總覽分頁 (Dashboard) -->
      <section id="section-dashboard" class="space-y-5">
        <!-- 頂部三大核心 KPI -->
        <div id="dashboard-kpi-row" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

        <!-- 30 號自動扣繳各銀行水位檢核 -->
        <div id="dashboard-debit-card" class="bg-white dark:bg-nord-1 border border-slate-200 dark:border-nord-2 rounded-2xl p-5 shadow-sm space-y-4"></div>

        <!-- 總覽快速清單 (本月即將扣繳款項與分期排程) -->
        <div id="dashboard-details-row" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- 2. 圖表模組容器 (用於 信用卡費 / 銀行餘額 / 固定費用 / 分期付款) -->
      <section id="section-chart-module" class="hidden space-y-6">
        
        <!-- 動態 KPI 三聯卡 -->
        <div id="module-kpi-row" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>

        <!-- 12 個月趨勢折線圖 -->
        <div class="bg-white dark:bg-nord-1 border border-slate-200 dark:border-nord-2 rounded-2xl p-4 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <!-- 模式切換 (近 12 個月 / 當年度) 與標題 -->
            <div class="flex flex-wrap items-center gap-3">
              <div class="flex items-center bg-slate-100 dark:bg-nord-0 p-1 rounded-xl border border-slate-200 dark:border-nord-2">
                <button id="btn-chart-rolling12" onclick="switchChartRangeMode('rolling12')"
                  class="px-3 py-1 rounded-lg text-xs font-bold transition-all bg-nord-8 text-nord-0 shadow-sm">
                  近 12 個月
                </button>
                <button id="btn-chart-ytd" onclick="switchChartRangeMode('ytd')"
                  class="px-3 py-1 rounded-lg text-xs font-medium transition-all text-slate-500 dark:text-nord-4 hover:text-slate-800 dark:hover:text-nord-6">
                  當年度
                </button>
              </div>

              <div class="flex items-center space-x-2">
                <span id="chart-dot" class="w-2.5 h-2.5 rounded-full bg-nord-8"></span>
                <h2 id="chart-title" class="text-sm sm:text-base font-bold text-slate-800 dark:text-nord-6">趨勢走勢</h2>
                <span id="chart-subtitle" class="text-xs text-slate-400 dark:text-nord-4 font-mono">2025/11 ~ 2026/10</span>
              </div>
            </div>

            <!-- 右上篩選膠囊按鈕 -->
            <div id="chart-filter-pills" class="flex flex-wrap items-center gap-1.5"></div>
          </div>

          <!-- Canvas 容器 -->
          <div class="relative w-full h-[280px] sm:h-[340px]">
            <canvas id="main-line-chart"></canvas>
          </div>
        </div>

        <!-- 明細清單標題與快速登錄按鈕 -->
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-list-check text-nord-8 text-sm"></i>
            <span id="detail-section-title" class="text-sm font-bold text-slate-600 dark:text-nord-4">當期項目明細</span>
          </div>
          <button onclick="toggleViewInputMode()" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-nord-1 hover:bg-slate-200 dark:hover:bg-nord-2 border border-slate-200 dark:border-nord-2 text-xs font-semibold text-nord-8 hover:text-nord-7 flex items-center space-x-1.5 transition-colors">
            <i class="fa-solid fa-pen-to-square text-xs"></i>
            <span>登錄 / 調整本期資料</span>
          </button>
        </div>

        <!-- 明細清單網格 -->
        <div id="module-detail-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- 3. 投資部位分頁 (Stocks) -->
      <section id="section-stocks" class="hidden space-y-5">

       ------------------------------------------------------------------------- */
    function loadActiveProfileData(profileKey) {
      const localKey = 'PocketMoney_v2_profile_' + profileKey;
      const saved = localStorage.getItem(localKey);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          console.warn('解析 local profile 失敗，使用預設值', e);
        }
      }

      // 檢查外部 window.EMBEDDED_DUMMY_DB
      if (window.EMBEDDED_DUMMY_DB && window.EMBEDDED_DUMMY_DB[profileKey]) {
        const raw = window.EMBEDDED_DUMMY_DB[profileKey];
        const cloned = JSON.parse(JSON.stringify(raw));
        // 確保格式相容
        normalizeProfileDb(cloned);
        return cloned;
      }

      // 內部 fallback
      return JSON.parse(JSON.stringify(DEFAULT_EMBEDDED_PROFILES[profileKey] || DEFAULT_EMBEDDED_PROFILES.family));
    }

    function normalizeProfileDb(target) {
      if (!target.banks) target.banks = [];
      if (!target.cards) target.cards = [];
      if (!target.bills) target.bills = target.recurringBills || [];
      if (!target.installments) target.installments = [];
      if (!target.stocks) target.stocks = [];
      if (!target.settings) target.settings = { privacyMode: false, pinCode: "" };
    }

          ? 'fa-regular fa-eye-slash text-xs text-nord-8'
          : 'fa-regular fa-eye text-xs text-slate-600 dark:text-nord-4';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('PocketMoney_theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
      // 重繪圖表以配合深淺色格線
      if (lineChartInstance) {
        renderCurrentView();
      }
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-icon');
      if (icon) {
        icon.className = isDark ? 'fa-solid fa-moon text-xs' : 'fa-solid fa-sun text-xs text-amber-500';
      }
    }

      if (db && db.settings && db.settings.pinCode) {
        lockScreenNow();
      } else {
        openPinSetupModal();
      }
    }

    function lockScreenNow() {
      isLocked = true;
      enteredPin = '';
      updatePinDotsUI();
      document.getElementById('pinErrorMsg').innerText = '';
      document.getElementById('pinLockModal').classList.remove('hidden');
    }

    function enterPinDigit(d) {
      if (enteredPin.length < 4) {
        enteredPin += d;
        updatePinDotsUI();
        if (enteredPin.length === 4) {
          validateEnteredPin();
        }
      }
    }

    function backspacePinDigit() {
      enteredPin = enteredPin.slice(0, -1);
      updatePinDotsUI();
    }

    function clearPinDigits() {
      enteredPin = '';
      updatePinDotsUI();
    }

    function updatePinDotsUI() {
      const dots = document.getElementById('pinDots').children;
      for (let i = 0; i < 4; i++) {
        if (i < enteredPin.length) {
          dots[i].className = 'w-3.5 h-3.5 rounded-full bg-nord-8 border-2 border-nord-8 transition-all scale-110';
        } else {
          dots[i].className = 'w-3.5 h-3.5 rounded-full border-2 border-nord-8 transition-all';
        }
      }
    }

    function validateEnteredPin() {
      const correctPin = db?.settings?.pinCode;
      if (!correctPin || enteredPin === correctPin) {
        isLocked = false;
        document.getElementById('pinLockModal').classList.add('hidden');
        showToast('解鎖成功！');
      } else {
        document.getElementById('pinErrorMsg').innerText = '密碼錯誤，請重新輸入';
        setTimeout(() => {
          clearPinDigits();
          document.getElementById('pinErrorMsg').innerText = '';
        }, 800);
      }
    }

    /* -------------------------------------------------------------------------
       6. 核心財務指標計算 (Financial Metrics Engine)
       ------------------------------------------------------------------------- */
    function computeFinancialMetrics() {
      if (!db) return {};

      const totalBankBalance = (db.banks || []).reduce((sum, b) => sum + (Number(b.balance) || 0), 0);

      let stockMarketValue = 0;
      let stockCostValue = 0;
      (db.stocks || []).forEach(s => {
        const shares = Number(s.shares) || 0;
        stockMarketValue += shares * (Number(s.currentPrice) || 0);
        stockCostValue += shares * (Number(s.avgCost) || 0);
      });
      const stockPnL = stockMarketValue - stockCostValue;
      const stockPnLPercent = stockCostValue > 0 ? (stockPnL / stockCostValue) * 100 : 0;

      // 證券交割現金池
      const secBankIds = Array.isArray(db.settings?.securitiesBankIds)
        ? db.settings.securitiesBankIds
        : (db.banks || []).filter(b => b.name.includes('證券') || b.id.includes('sec')).map(b => b.id);
      
      const stockCashPool = (db.banks || [])
        .filter(b => secBankIds.includes(b.id))
        .reduce((sum, b) => sum + (Number(b.balance) || 0), 0);
      
      const stockTotalPool = stockMarketValue + stockCashPool;
      const stockHoldRatio = stockTotalPool > 0 ? Math.round((stockMarketValue / stockTotalPool) * 100) : 0;
      const stockCashRatio = stockTotalPool > 0 ? (100 - stockHoldRatio) : 0;

      // 信用卡未繳總額 (本期 10 月未付金額)
      let unpaidCardTotal = 0;
      (db.cards || []).forEach(c => {
        const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        const amt = (rec && rec.amount !== undefined) ? Number(rec.amount) : 0;
        if (!c.paid) unpaidCardTotal += amt;
      });

      // 固定費用未繳總額
      const unpaidBillsTotal = (db.bills || [])
        .filter(b => b.status === 'unpaid' || b.status === 'pending')
        .reduce((sum, b) => sum + (Number(b.amount) || Number(b.defaultAmount) || 0), 0);

      // 分期付款負債
      let installmentMonthlyTotal = 0;
      let installmentRemainingTotal = 0;
      (db.installments || []).forEach(i => {
        const totalPeriods = i.totalPeriods || i.totalTerms || 12;
        let curTerm = i.currentTerm !== undefined ? i.currentTerm : (i.paidPeriods || 1);
        const monthly = Number(i.monthlyAmount) || Number(i.regularPeriodAmount) || Math.round((i.totalAmount || 36000) / totalPeriods);
        const remainingTerms = Math.max(0, totalPeriods - curTerm);
        installmentMonthlyTotal += monthly;
        installmentRemainingTotal += remainingTerms * monthly;
      });

      // 30 號自動扣繳檢核 (比對各銀行餘額 vs 該銀行綁定應扣信用卡 + 固定支出)
      const bankCheckups = (db.banks || []).map(bank => {
        const boundCards = (db.cards || []).filter(c => c.bankId === bank.id && !c.paid);
        const boundBills = (db.bills || []).filter(b => b.bankId === bank.id && (b.status === 'unpaid' || b.status === 'pending'));

        const cardsSum = boundCards.reduce((sum, c) => {
          const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
          return sum + ((rec && rec.amount !== undefined) ? Number(rec.amount) : 0);
        }, 0);

        const billsSum = boundBills.reduce((sum, b) => sum + (Number(b.amount) || Number(b.defaultAmount) || 0), 0);
        const requiredTotal = cardsSum + billsSum;
        const afterBalance = Number(bank.balance || 0) - requiredTotal;
        const isShortfall = afterBalance < 0;

        return {
          bank,
          cardsSum,
          billsSum,
          requiredTotal,
          afterBalance,
          isShortfall
        };
      });

      const totalAssets = totalBankBalance + stockMarketValue;
      const totalUnpaidMonth = unpaidCardTotal + unpaidBillsTotal;
      const netWorth = totalAssets - totalUnpaidMonth;

      return {
        totalBankBalance, stockMarketValue, stockCostValue, stockPnL, stockPnLPercent,
        stockCashPool, stockTotalPool, stockHoldRatio, stockCashRatio, secBankIds,
        unpaidCardTotal, unpaidBillsTotal, totalUnpaidMonth,
        installmentMonthlyTotal, installmentRemainingTotal,
        bankCheckups, totalAssets, netWorth
      };
    }

    /* -------------------------------------------------------------------------
       8. 圖表模組 View 渲染 (信用卡費、銀行餘額、固定費用、分期付款)
       ------------------------------------------------------------------------- */
    function renderChartModuleView(cat) {
      const slots = getActiveSlots();
      const labels = slots.map(s => s.label);

      if (cat === 'cards') {
        renderCardsViewModule(slots, labels);
      } else if (cat === 'banks') {
        renderBanksViewModule(slots, labels);
      } else if (cat === 'bills') {
        renderBillsViewModule(slots, labels);
      } else if (cat === 'installments') {
        renderInstallmentsViewModule(slots, labels);
      }
    }

    /* 8.1 信用卡費模組 */
    function renderCardsViewModule(slots, labels) {
      const cards = db.cards || [];
      document.getElementById('detail-section-title').textContent = '本期信用卡帳單清單';

      let currentMonthTotal = 0;
      let periodTotal = 0;
      let bigExpenseCount = 0;

      cards.forEach(c => {
        slots.forEach(slot => {
          if (!slot.isFuture) {
            const rec = (c.records || []).find(r => r.year === slot.year && r.month === slot.month);
            if (rec && rec.amount !== null) periodTotal += rec.amount;
          }
        });
        const octRec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (octRec && octRec.amount !== null) {
          currentMonthTotal += octRec.amount;
          bigExpenseCount += (octRec.bigExpenses ? octRec.bigExpenses.length : 0);
        }
      });

      const activeSlotCount = slots.filter(s => !s.isFuture).length;
      const monthlyAvg = activeSlotCount > 0 ? Math.round(periodTotal / activeSlotCount) : 0;

      // 頂部三大 KPI 卡
      document.getElementById('module-kpi-row').innerHTML = `
        <div class="bg-white dark:bg-nord-1 border border-slate-200 dark:border-nord-2 rounded-2xl p-4 flex items-center justify-between shadow-sm">

    /* 8.4 分期付款模組 */
    function renderInstallmentsViewModule(slots, labels) {
      const rawInst = db.installments || [];
      document.getElementById('detail-section-title').textContent = '進行中分期消費明細';

      const installments = rawInst.map(i => {
        const totalPeriods = i.totalPeriods || i.totalTerms || 12;
        let curTerm = i.currentTerm !== undefined ? i.currentTerm : (i.paidPeriods || 1);
        const monthly = Number(i.monthlyAmount) || Number(i.regularPeriodAmount) || Math.round((i.totalAmount || 36000) / totalPeriods);
        return {
          id: i.id,
          name: i.title || i.name || '分期消費',
          monthlyAmount: monthly,
          totalTerms: totalPeriods,
          currentTerm: curTerm,
          totalAmount: i.totalAmount || (totalPeriods * monthly)
        };
      });

      const monthlyBurden = installments.reduce((s, i) => s + i.monthlyAmount, 0);
      const remainingTotal = installments.reduce((s, i) => s + (i.monthlyAmount * Math.max(0, i.totalTerms - i.currentTerm)), 0);

      document.getElementById('module-kpi-row').innerHTML = `
        <div class="bg-white dark:bg-nord-1 border border-slate-200 dark:border-nord-2 rounded-2xl p-4 flex items-center justify-between shadow-sm">

    function quickAddCardAmt(delta) {
      const inp = document.getElementById('v2-card-amt-input');
      if (inp) inp.value = (Number(inp.value) || 0) + delta;
    }
    function clearCardAmt() {
      const inp = document.getElementById('v2-card-amt-input');
      if (inp) inp.value = 0;
    }
    function stepCardCover(dir) {
      saveCardCurrentAmtTemp();
      cardCoverIndex += dir;
      renderCurrentInput();
    }
    function setCardCoverIdx(idx) {
      saveCardCurrentAmtTemp();
      cardCoverIndex = idx;
      renderCurrentInput();
    }
    function toggleCardStageMode() {
      saveCardCurrentAmtTemp();
      cardInputStage = (cardInputStage === 1) ? 2 : 1;
      renderCurrentInput();
    }
    function saveCardCurrentAmtTemp() {
      const inp = document.getElementById('v2-card-amt-input');
      if (!inp || !db.cards || !db.cards[cardCoverIndex]) return;
      const c = db.cards[cardCoverIndex];
      let rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
      if (rec) {
        rec.amount = Number(inp.value) || 0;
      } else {
        c.records.push({ year: CURRENT_YEAR, month: CURRENT_MONTH, amount: Number(inp.value) || 0 });
      }
      saveActiveProfileData();
    }
    function addBigExpenseItem() {
      const nameInp = document.getElementById('v2-big-name');
      const amtInp = document.getElementById('v2-big-amt');
      if (!nameInp || !nameInp.value || !db.cards[cardCoverIndex]) return;
      const c = db.cards[cardCoverIndex];
      let rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
      if (!rec) {
        rec = { year: CURRENT_YEAR, month: CURRENT_MONTH, amount: 0, bigExpenses: [] };
        c.records.push(rec);
      }
      if (!rec.bigExpenses) rec.bigExpenses = [];
      rec.bigExpenses.push({
        id: 'be_' + Date.now(),
        title: nameInp.value.trim(),
        amount: Number(amtInp.value) || 0
      });
      saveActiveProfileData();
      renderCurrentInput();
    }
    function removeBigExpenseItem(idx) {
      if (!db.cards[cardCoverIndex]) return;
      const c = db.cards[cardCoverIndex];
      const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
      if (rec && rec.bigExpenses) {
        rec.bigExpenses.splice(idx, 1);
        saveActiveProfileData();
        renderCurrentInput();
      }
    }
    function saveAndFinishCardInput() {
      saveCardCurrentAmtTemp();
      showToast('信用卡帳單已成功儲存！');
      toggleViewInputMode();

    function calcInstMonthlyPreview() {
      const tot = Number(document.getElementById('v2-inst-total')?.value) || 0;
      const per = Number(document.getElementById('v2-inst-periods')?.value) || 1;
      const monthly = Math.round(tot / per);
      const prev = document.getElementById('v2-inst-monthly-preview');
      if (prev) prev.innerText = `NT$ ${formatCurrency(monthly)} /月`;
    }

    function addInstItem() {
      const name = document.getElementById('v2-inst-name').value.trim();
      const tot = Number(document.getElementById('v2-inst-total').value) || 0;
      const per = Number(document.getElementById('v2-inst-periods').value) || 12;
      if (!name) return;

      if (!db.installments) db.installments = [];
      db.installments.push({
        id: 'inst_' + Date.now(),
        name,
        totalAmount: tot,
        totalPeriods: per,
        paidPeriods: 1,
        currentTerm: 1,
        monthlyAmount: Math.round(tot / per)
      });
      saveActiveProfileData();
      showToast('已新增分期項目：' + name);
      renderCurrentInput();
    }

    function advanceAllInstOnePeriod() {
      (db.installments || []).forEach(i => {
        const total = i.totalPeriods || i.totalTerms || 12;
        if (i.currentTerm !== undefined) {
          i.currentTerm = Math.min(total, i.currentTerm + 1);
        } else if (i.paidPeriods !== undefined) {
          i.paidPeriods = Math.min(total, i.paidPeriods + 1);
        }
      });
      saveActiveProfileData();
      showToast('全部分期期數已成功前進 1 期！');
      renderCurrentInput();
    }

    function stepInstItemInline(idx, delta) {
      if (db.installments && db.installments[idx]) {
        const i = db.installments[idx];
        const total = i.totalPeriods || i.totalTerms || 12;
        if (i.currentTerm !== undefined) {
          i.currentTerm = Math.max(1, Math.min(total, i.currentTerm + delta));
        } else {
          i.paidPeriods = Math.max(1, Math.min(total, (i.paidPeriods || 1) + delta));
        }
        saveActiveProfileData();
        renderCurrentInput();
      }
    }

    function deleteInstItem(idx) {
      if (db.installments && db.installments[idx]) {
        db.installments.splice(idx, 1);
        saveActiveProfileData();
        renderCurrentInput();
      }
    }

    /* -------------------------------------------------------------------------
       12. 全域 Chart.js 折線圖繪製
       ------------------------------------------------------------------------- */
    function drawLineChart(labels, datasets) {
      const ctx = document.getElementById('main-line-chart')?.getContext('2d');
      if (!ctx) return;

      if (lineChartInstance) {
        lineChartInstance.destroy();
        lineChartInstance = null;
      }

      const isDark = document.documentElement.classList.contains('dark');
      const gridColor = isDark ? 'rgba(76, 86, 106, 0.25)' : 'rgba(216, 222, 233, 0.7)';
      const textColor = isDark ? '#D8DEE9' : '#4C566A';

      lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              display: datasets.length > 1,
              position: 'top',
              labels: {
                color: textColor,
                boxWidth: 12,
                font: { size: 11, family: 'Inter, sans-serif' }
              }
            },
            tooltip: {
              backgroundColor: isDark ? 'rgba(46, 52, 64, 0.95)' : 'rgba(255, 255, 255, 0.95)',
              titleColor: isDark ? '#ECEFF4' : '#2E3440',
              bodyColor: isDark ? '#D8DEE9' : '#3B4252',
              borderColor: isDark ? '#434C5E' : '#D8DEE9',
              borderWidth: 1,
              padding: 10,
              boxPadding: 4,
              callbacks: {
                label: function (ctx) {
                  return ctx.dataset.label + ': NT$ ' + formatCurrency(ctx.raw);
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: gridColor },
              ticks: { color: textColor, font: { size: 11 } }
            },
            y: {
              grid: { color: gridColor },
              ticks: {
                color: textColor,
                font: { size: 11 },
                callback: function (val) {
                  return val >= 10000 ? (val / 10000) + '萬' : val;
                }
              }
            }
          }
        }
      });
    }

    /* -------------------------------------------------------------------------
       13. 綜合視圖派發器 (renderCurrentView)
       ------------------------------------------------------------------------- */
    function renderCurrentView() {
      // 隱藏所有分頁容器
      document.getElementById('section-dashboard').classList.add('hidden');
      document.getElementById('section-chart-module').classList.add('hidden');
      document.getElementById('section-stocks').classList.add('hidden');
      document.getElementById('section-settings').classList.add('hidden');

      if (currentCategory === 'dashboard') {
        document.getElementById('section-dashboard').classList.remove('hidden');
        renderDashboardView();
      } else if (currentCategory === 'cards' || currentCategory === 'banks' || currentCategory === 'bills' || currentCategory === 'installments') {
        document.getElementById('section-chart-module').classList.remove('hidden');
        renderChartModuleView(currentCategory);
      } else if (currentCategory === 'stocks') {
        document.getElementById('section-stocks').classList.remove('hidden');
        renderStocksView();
      } else if (currentCategory === 'settings') {
        document.getElementById('section-settings').classList.remove('hidden');
        renderSettingsView();
      }

      applyPrivacyUI();
    }

    /* -------------------------------------------------------------------------
       14. 彈出對話框 (Modal) 工具
       ------------------------------------------------------------------------- */
    function openAppModal(title, html) {
      document.getElementById('appModalTitle').innerText = title;
      document.getElementById('appModalContent').innerHTML = html;
      document.getElementById('appModal').classList.remove('hidden');
    }

    function closeAppModal() {
      document.getElementById('appModal').classList.add('hidden');
    }

    function openStockModal(stkId = null) {
      const stk = stkId ? (db.stocks || []).find(s => s.id === stkId) : null;
      openAppModal(stk ? '編輯持股' : '新增個股', `
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-nord-4 mb-1">股票代號</label>
            <input id="modal-stk-code" type="text" value="${stk ? stk.code : ''}" placeholder="例：2330" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-nord-0 border border-slate-200 dark:border-nord-2 text-xs font-mono outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-nord-4 mb-1">股票名稱</label>
            <input id="modal-stk-name" type="text" value="${stk ? stk.name : ''}" placeholder="例：台積電" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-nord-0 border border-slate-200 dark:border-nord-2 text-xs outline-none">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-nord-4 mb-1">持有股數</label>
              <input id="modal-stk-shares" type="number" value="${stk ? stk.shares : 1000}" class="w-full px-2 py-2 rounded-xl bg-slate-50 dark:bg-nord-0 border border-slate-200 dark:border-nord-2 text-xs font-mono outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-nord-4 mb-1">買進均價</label>
              <input id="modal-stk-cost" type="number" value="${stk ? stk.avgCost : ''}" class="w-full px-2 py-2 rounded-xl bg-slate-50 dark:bg-nord-0 border border-slate-200 dark:border-nord-2 text-xs font-mono outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-nord-4 mb-1">最新現價</label>
              <input id="modal-stk-price" type="number" value="${stk ? stk.currentPrice : ''}" class="w-full px-2 py-2 rounded-xl bg-slate-50 dark:bg-nord-0 border border-slate-200 dark:border-nord-2 text-xs font-mono outline-none">
            </div>
          </div>
          <div class="flex justify-between items-center pt-3">
            ${stk ? `<button onclick="deleteStockItem('${stk.id}')" class="text-nord-11 text-xs font-bold">刪除此股</button>` : '<span></span>'}
            <div class="flex gap-2">
              <button onclick="closeAppModal()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-nord-2 text-xs font-semibold">取消</button>
              <button onclick="saveStockModalForm('${stk ? stk.id : ''}')" class="px-4 py-2 rounded-xl bg-nord-8 text-nord-0 text-xs font-bold">儲存</button>
            </div>
          </div>
        </div>
      `);
    }

    function saveStockModalForm(stkId) {
      const code = document.getElementById('modal-stk-code').value.trim();
      const name = document.getElementById('modal-stk-name').value.trim();
      const shares = Number(document.getElementById('modal-stk-shares').value) || 0;
      const cost = Number(document.getElementById('modal-stk-cost').value) || 0;
      const price = Number(document.getElementById('modal-stk-price').value) || 0;
      if (!code || !name) return;

      if (!db.stocks) db.stocks = [];
      if (stkId) {
        const item = db.stocks.find(s => s.id === stkId);
        if (item) {
          item.code = code;
          item.name = name;
          item.shares = shares;
          item.avgCost = cost;
          item.currentPrice = price;
        }
      } else {
        db.stocks.push({
          id: 'stk_' + Date.now(),
          code,
          name,
          shares,
          avgCost: cost,
          currentPrice: price
        });
      }
      saveActiveProfileData();
      closeAppModal();
      showToast('股票資料已更新！');
      renderStocksView();
    }

    function deleteStockItem(stkId) {
      if (confirm('確定要刪除此筆持股嗎？')) {
        db.stocks = (db.stocks || []).filter(s => s.id !== stkId);
        saveActiveProfileData();
        closeAppModal();
        showToast('已刪除持股');
        renderStocksView();
      }
    }

    /* -------------------------------------------------------------------------
       15. Excel 與 JSON 匯出匯入
       ------------------------------------------------------------------------- */
    function exportToExcelCSV() {
      const m = computeFinancialMetrics();
      let csv = '﻿'; // UTF-8 BOM
      csv += 'PocketMoney v2 財務報表\n';
      csv += '匯出時間,' + new Date().toLocaleString() + '\n';
      csv += '使用人物,' + (db.profile?.label || currentProfileKey) + '\n\n';

      csv += '【資產負債總覽】\n';
      csv += '項目,金額(NT$)\n';
      csv += '總淨資產,' + Math.round(m.netWorth) + '\n';
      csv += '銀行總存款,' + Math.round(m.totalBankBalance) + '\n';
      csv += '股票持股市值,' + Math.round(m.stockMarketValue) + '\n';
      csv += '本月待扣款項,' + Math.round(m.totalUnpaidMonth) + '\n';
      csv += '分期未還總額,' + Math.round(m.installmentRemainingTotal) + '\n\n';

      csv += '【各銀行帳戶】\n';
      csv += '代碼,銀行名稱,存款餘額,保留底線\n';
      (db.banks || []).forEach(b => {
        csv += `"${b.code || ''}","${b.name}",${b.balance},${b.minReserve || 0}\n`;
      });
      csv += '\n';

      csv += '【信用卡明細】\n';
      csv += '卡片名稱,本期帳單金額,扣款銀行,結帳日\n';
      (db.cards || []).forEach(c => {
        const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        csv += `"${c.name}",${rec ? rec.amount : 0},"${c.bankId || ''}",${c.closingDay || 25}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `PocketMoney_Report_${currentProfileKey}_${CURRENT_YEAR}${CURRENT_MONTH}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Excel CSV 報表已成功匯出！');
    }

    function exportDatabaseJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `PocketMoney_${currentProfileKey}_backup.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
      showToast('資料庫 JSON 已備份！');
    }

    function importDatabaseJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          normalizeProfileDb(imported);
          db = imported;
          saveActiveProfileData();
          showToast('資料庫還原成功！');
          renderCurrentView();
        } catch (err) {
          alert('匯入失敗：JSON 格式無效');
        }
      };
      reader.readAsText(file);
    }

    function resetProfileToDefault() {
      if (confirm('確定要將當前人物資料重設為原始預設值嗎？')) {
        const localKey = 'PocketMoney_v2_profile_' + currentProfileKey;
        localStorage.removeItem(localKey);
        db = loadActiveProfileData(currentProfileKey);
        showToast('已重設為預設展示資料');
        renderCurrentView();
      }
    }

    /* -------------------------------------------------------------------------
       16. 初始化進入點
       ------------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      // 載入資料庫
      db = loadActiveProfileData(currentProfileKey);

      // 同步主題圖示與 Persona 選單
      updateThemeIcon(document.documentElement.classList.contains('dark'));
      const selMobile = document.getElementById('persona-select-mobile');
      if (selMobile) selMobile.value = currentProfileKey;

      // 若有 PIN 碼且初次進入，自動啟動 PIN 鎖定
      if (db?.settings?.pinCode) {
        lockScreenNow();
      }

      // 渲染預設 View 視圖 (總覽)
      updateNavTabsUI();
      renderCurrentView();
    });
  </script>
</body>
