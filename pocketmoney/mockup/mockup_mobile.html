<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketMoney Mobile</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <!-- 本機與離線離距資料庫支援 -->
  <script src="./database/dummy_db_embedded.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            nord: {
              0: '#2E3440',
              1: '#3B4252',
              2: '#434C5E',
              3: '#4C566A',
              4: '#D8DEE9',
              5: '#E5E9F0',
              6: '#ECEFF4',
              7: '#8FBCBB',
              8: '#88C0D0',
              9: '#81A1C1',
              10: '#5E81AC',
              11: '#BF616A',
              12: '#D08770',
              13: '#EBCB8B',
              14: '#A3BE8C',
              15: '#B48EAD'
            }
          }
        }
      }
    };
  </script>

  <style>
    /* 移除原生 Number Stepper 箭頭 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    body {
      background-color: #1e222a;
      color: #ECEFF4;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 行動視窗容器與手機外框模式支援 */
    .mobile-screen-wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #242933;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 640px) {
      body {
        padding: 24px 0;
        background-color: #1a1e24;
      }
      .mobile-screen-wrapper {
        min-height: 844px;
        height: 92vh;
        border-radius: 40px;
        border: 8px solid #2e3440;
        overflow: hidden;
      }
    }

    /* 隱私遮罩 */
    .privacy-masked .masked-amount {
      filter: blur(5px);
      user-select: none;
    }

    /* 自訂平滑滾動列 */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #2E3440;
    }
    ::-webkit-scrollbar-thumb {
      background: #434C5E;
      border-radius: 9999px;
    }

    /* 轉場與動畫 */
    .mode-transition {
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 脈衝微光按鈕 */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(136, 192, 208, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(136, 192, 208, 0); }
    }
    .pulse-glow {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    /* 3D 卡片視角 */
    .perspective-800 {
      perspective: 800px;
    }
  </style>
</head>

<body class="selection:bg-nord-8 selection:text-nord-0 flex items-center justify-center">

  <!-- ==================== 手機螢幕容器 (Mobile Mockup Container) ==================== -->
  <div class="mobile-screen-wrapper">

    <!-- 頂部狀態列 / 動態島 (桌機預覽修飾) -->
    <div class="hidden sm:flex items-center justify-between px-6 pt-3 pb-1 bg-[#2E3440] text-[11px] text-nord-4 font-mono select-none">
      <span>09:41</span>
      <div class="w-20 h-4 bg-nord-0 rounded-full mx-auto"></div>
      <div class="flex items-center space-x-1.5 text-[10px]">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <!-- ==================== 頂部行動 Header (精簡且高效率) ==================== -->
    <header class="sticky top-0 z-40 bg-[#2E3440]/95 backdrop-blur-md border-b border-nord-2 px-4 py-2.5 transition-colors">
      <div class="flex items-center justify-between">
        
        <!-- 左側：Brand Logo 與當前模式小標籤 -->
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-nord-10 to-nord-8 flex items-center justify-center shadow-md text-nord-0 font-bold">
            <i class="fa-solid fa-wallet text-sm"></i>
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <span class="text-base font-bold tracking-tight text-nord-6">PocketMoney</span>
              <span id="header-mode-badge" class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-nord-2 text-nord-4">
                瀏覽
              </span>
            </div>
            <div class="flex items-center space-x-1 text-[11px] text-nord-4">
              <span id="header-category-label">信用卡費</span>
              <span class="text-nord-3">•</span>
              <!-- 輕巧的 Persona 切換選單 -->
              <select id="persona-select" onchange="onPersonaSelectChange(this.value)" class="bg-transparent text-nord-8 font-medium focus:outline-none cursor-pointer">
                <option value="junior" class="bg-nord-0 text-nord-4">初級大人</option>
                <option value="family" selected class="bg-nord-0 text-nord-4">少子化勇者</option>
                <option value="senior" class="bg-nord-0 text-nord-4">高級大人</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 右側動作區：隱私切換 + 核心「+ / ✕」雙模式切換鈕 -->
        <div class="flex items-center space-x-2">
          
          <!-- 隱私遮罩 -->
          <button onclick="togglePrivacyMode()" title="隱私遮罩"
            class="w-8 h-8 rounded-lg bg-nord-1 border border-nord-2 text-nord-4 hover:text-nord-6 flex items-center justify-center transition-colors">
            <i id="privacy-icon" class="fa-regular fa-eye text-xs"></i>
          </button>

          <!-- 核心功能按鈕：在瀏覽模式為「+ 輸入」，在輸入模式為「✕ 瀏覽」 -->
          <button id="btn-mode-toggle" onclick="toggleViewInputMode()"
            class="h-8 px-3 rounded-lg bg-nord-8 hover:bg-nord-7 text-nord-0 font-bold text-xs flex items-center space-x-1.5 shadow-md shadow-nord-8/20 transition-all pulse-glow">
            <i id="mode-toggle-icon" class="fa-solid fa-plus text-xs"></i>
            <span id="mode-toggle-text">輸入</span>
          </button>

        </div>

      </div>
    </header>

    <!-- ==================== 頁面主要內容滾動區 ==================== -->
    <div id="main-content-scroll" class="flex-1 overflow-y-auto px-3.5 py-4 space-y-4 pb-24">

      <!-- ================================================================= -->
      <!-- [功能一]：預設 瀏覽模式 (View Mode)                              -->
      <!-- ================================================================= -->
      <section id="view-mode-container" class="space-y-4 mode-transition">

        <!-- 1. 解決痛點 2：緊湊型 KPI 指標卡 (主指標 + 雙欄副指標，垂直僅佔 85px) -->
        <div id="mobile-kpi-container" class="bg-nord-1/90 border border-nord-2 rounded-2xl p-3.5 shadow-md">
          <!-- 由 JS 根據當前 Tab 動態注入 -->
        </div>

        <!-- 2. 解決痛點 3：行動端降維折線圖 (高度適中 210px、標題不折行、X 軸抽樣) -->
        <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-3.5 shadow-md">
          <div class="flex items-center justify-between mb-2.5">
            <!-- 圖表標題與圓點 -->
            <div class="flex items-center space-x-2">
              <span id="chart-dot" class="w-2.5 h-2.5 rounded-full bg-nord-8"></span>
              <h2 id="chart-title" class="text-xs font-bold text-nord-6">信用卡費走勢</h2>
              <span id="chart-subtitle" class="text-[10px] text-nord-4 font-mono">25/11 ~ 26/10</span>
            </div>

            <!-- 時間軸模式切換 (近 12 個月 / 當年度) -->
            <div class="flex items-center bg-nord-0 p-0.5 rounded-lg border border-nord-2 text-[10px]">
              <button id="btn-chart-rolling12" onclick="switchChartMode('rolling12')"
                class="px-2 py-0.5 rounded-md font-bold bg-nord-8 text-nord-0 transition-all">
                近12月
              </button>
              <button id="btn-chart-ytd" onclick="switchChartMode('ytd')"
                class="px-2 py-0.5 rounded-md font-medium text-nord-4 transition-all">
                當年度
              </button>
            </div>
          </div>

          <!-- 個別帳戶/卡片快速篩選膠囊 (橫向水平捲動) -->
          <div id="chart-filter-scroll" class="flex items-center space-x-1.5 overflow-x-auto pb-1 mb-2 text-xs no-scrollbar">
            <!-- 由 JS 動態注入 -->
          </div>

          <!-- 折線圖 Canvas (高度 200px 完美留出下方空間) -->
          <div class="relative w-full h-[190px]">
            <canvas id="mobile-line-chart"></canvas>
          </div>
        </div>

        <!-- 3. 各項目明細清單與事件 -->
        <div>
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-xs font-bold text-nord-4 flex items-center space-x-1.5">
              <i class="fa-solid fa-list-check text-[10px]"></i>
              <span id="detail-list-title">本月信用卡明細</span>
            </span>
            <span id="detail-list-hint" class="text-[10px] text-nord-4">點擊「+」可快速登錄</span>
          </div>

          <!-- 清單容器 -->
          <div id="detail-items-container" class="space-y-2.5">
            <!-- 由 JS 動態注入各項目卡片 -->
          </div>
        </div>

      </section>


      <!-- ================================================================= -->
      <!-- [功能二]：右上角「+」進入 輸入模式 (Input Mode)                  -->
      <!-- ================================================================= -->
      <section id="input-mode-container" class="hidden space-y-4 mode-transition">

        <!-- 輸入模式引導橫條 (通知提示與返回快捷) -->
        <div class="flex items-center justify-between p-3 rounded-xl bg-nord-10/20 border border-nord-10/40 text-xs">
          <div class="flex items-center space-x-2 text-nord-8">
            <i class="fa-solid fa-pen-to-square text-sm"></i>
            <div>
              <span class="font-bold block" id="input-banner-title">登錄本期信用卡帳單</span>
              <span class="text-[10px] text-nord-4 block" id="input-banner-subtitle">依序輸入或直接填入金額</span>
            </div>
          </div>
          <button onclick="toggleViewInputMode()" class="px-2.5 py-1 rounded-lg bg-nord-1 border border-nord-2 text-[11px] text-nord-4 hover:text-nord-6 flex items-center space-x-1">
            <i class="fa-solid fa-arrow-left text-[10px]"></i>
            <span>回瀏覽</span>
          </button>
        </div>

        <!-- 流程容器：依據當前 Tab 切換渲染對應輸入面板 -->
        <div id="input-panel-wrapper">
          <!-- 由 JS 依 Tab 渲染 (cards/banks/bills/installments) -->
        </div>

      </section>

    </div>

    <!-- ==================== 底部固定導覽列 (Bottom Navigation Bar - 拇指熱區) ==================== -->
    <nav class="absolute bottom-0 left-0 right-0 z-40 bg-[#2E3440]/95 backdrop-blur-lg border-t border-nord-2/80 px-2 py-1.5 flex items-center justify-around shadow-lg">
      
      <!-- Tab 1: 信用卡費 -->
      <button id="nav-btn-cards" onclick="switchCategoryTab('cards')"
        class="nav-bottom-item flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center text-nord-8 transition-all">
        <i class="fa-regular fa-credit-card text-base mb-1"></i>
        <span class="text-[11px] font-bold leading-none">信用卡</span>
      </button>

      <!-- Tab 2: 銀行餘額 -->
      <button id="nav-btn-banks" onclick="switchCategoryTab('banks')"
        class="nav-bottom-item flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center text-nord-4 hover:text-nord-6 transition-all">
        <i class="fa-solid fa-building-columns text-base mb-1"></i>
        <span class="text-[11px] font-medium leading-none">銀行</span>
      </button>

      <!-- Tab 3: 固定費用 -->
      <button id="nav-btn-bills" onclick="switchCategoryTab('bills')"
        class="nav-bottom-item flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center text-nord-4 hover:text-nord-6 transition-all">
        <i class="fa-solid fa-calendar-check text-base mb-1"></i>
        <span class="text-[11px] font-medium leading-none">固定費</span>
      </button>

      <!-- Tab 4: 分期付款 -->
      <button id="nav-btn-installments" onclick="switchCategoryTab('installments')"
        class="nav-bottom-item flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center text-nord-4 hover:text-nord-6 transition-all">
        <i class="fa-solid fa-layer-group text-base mb-1"></i>
        <span class="text-[11px] font-medium leading-none">分期</span>
      </button>

    </nav>

    <!-- Toast 浮動反饋訊息 -->
    <div id="mobile-toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-nord-0/95 border border-nord-14/50 text-nord-14 text-xs font-semibold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-2">
      <i class="fa-solid fa-circle-check"></i>
      <span id="mobile-toast-text">已更新</span>
    </div>

  </div>

  <!-- ==================== 核心邏輯與資料庫 ==================== -->
  <script>
    /* -------------------------------------------------------------
       全域狀態
       ------------------------------------------------------------- */
    let currentMode = 'view'; // 'view' (瀏覽模式) | 'input' (輸入模式)
    let currentCategory = 'cards'; // 'cards' | 'banks' | 'bills' | 'installments'
    let currentPersona = 'family'; // 'junior' | 'family' | 'senior'
    let chartRangeMode = 'rolling12'; // 'rolling12' | 'ytd'
    let selectedEntityId = 'all';
    let isPrivacyMasked = false;
    let chartInstance = null;
    let dbCache = {};

    // 信用卡輸入流程子狀態
    let cardInputIndex = 0;
    let cardInputStage = 1; // 1: 帳單總額, 2: 逐張翻面確認大額, 3: 完成結算
    let cardStage2Order = [];

    // 銀行輸入流程子狀態
    let bankInputIndex = 0;
    let bankInputStage = 1; // 1: 盤點餘額(自動滾算推估), 2: 收支事件歸戶, 3: 完成結算
    let currentMobileBankEventType = 'withdrawal'; // 預設提款

    // 基準年月 (2026/10)
    const CURRENT_YEAR = 2026;
    const CURRENT_MONTH = 10;

    const ROLLING_12_SLOTS = [
      { year: 2025, month: 11, label: '25/11' },
      { year: 2025, month: 12, label: '25/12' },
      { year: 2026, month: 1,  label: '26/01' },
      { year: 2026, month: 2,  label: '26/02' },
      { year: 2026, month: 3,  label: '26/03' },
      { year: 2026, month: 4,  label: '26/04' },
      { year: 2026, month: 5,  label: '26/05' },
      { year: 2026, month: 6,  label: '26/06' },
      { year: 2026, month: 7,  label: '26/07' },
      { year: 2026, month: 8,  label: '26/08' },
      { year: 2026, month: 9,  label: '26/09' },
      { year: 2026, month: 10, label: '26/10' }
    ];

    const YTD_12_SLOTS = [
      { year: 2026, month: 1,  label: '1月' },
      { year: 2026, month: 2,  label: '2月' },
      { year: 2026, month: 3,  label: '3月' },
      { year: 2026, month: 4,  label: '4月' },
      { year: 2026, month: 5,  label: '5月' },
      { year: 2026, month: 6,  label: '6月' },
      { year: 2026, month: 7,  label: '7月' },
      { year: 2026, month: 8,  label: '8月' },
      { year: 2026, month: 9,  label: '9月' },
      { year: 2026, month: 10, label: '10月' },
      { year: 2026, month: 11, label: '11月' },
      { year: 2026, month: 12, label: '12月' }
    ];

    function formatCurrency(num) {
      if (num === null || num === undefined) return '0';
      return new Intl.NumberFormat('zh-TW').format(Math.round(num));
    }

    function showToast(msg) {
      const toast = document.getElementById('mobile-toast');
      const text = document.getElementById('mobile-toast-text');
      text.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2400);
    }

    function togglePrivacyMode() {
      isPrivacyMasked = !isPrivacyMasked;
      document.body.classList.toggle('privacy-masked', isPrivacyMasked);
      const icon = document.getElementById('privacy-icon');
      icon.className = isPrivacyMasked
        ? 'fa-regular fa-eye-slash text-xs text-nord-8'
        : 'fa-regular fa-eye text-xs text-nord-4';
    }

    /* -------------------------------------------------------------
       核心功能切換：右上角「+ / ✕」雙模式切換
       ------------------------------------------------------------- */
    function toggleViewInputMode() {
      if (currentMode === 'view') {
        currentMode = 'input';
      } else {
        currentMode = 'view';
      }
      syncModeUI();
    }

    function syncModeUI() {
      const viewContainer = document.getElementById('view-mode-container');
      const inputContainer = document.getElementById('input-mode-container');
      const badge = document.getElementById('header-mode-badge');
      const btn = document.getElementById('btn-mode-toggle');
      const icon = document.getElementById('mode-toggle-icon');
      const text = document.getElementById('mode-toggle-text');

      if (currentMode === 'view') {
        viewContainer.classList.remove('hidden');
        inputContainer.classList.add('hidden');
        badge.textContent = '瀏覽';
        badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-semibold bg-nord-2 text-nord-4';

        btn.className = 'h-8 px-3 rounded-lg bg-nord-8 hover:bg-nord-7 text-nord-0 font-bold text-xs flex items-center space-x-1.5 shadow-md shadow-nord-8/20 transition-all pulse-glow';
        icon.className = 'fa-solid fa-plus text-xs';
        text.textContent = '輸入';

        renderActiveCategoryView();
      } else {
        viewContainer.classList.add('hidden');
        inputContainer.classList.remove('hidden');
        badge.textContent = '輸入中';
        badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-semibold bg-nord-14/20 text-nord-14 border border-nord-14/40';

        btn.className = 'h-8 px-3 rounded-lg bg-nord-1 hover:bg-nord-2 border border-nord-2 text-nord-4 hover:text-nord-6 font-bold text-xs flex items-center space-x-1.5 transition-all';
        icon.className = 'fa-solid fa-xmark text-xs';
        text.textContent = '返回';

        renderActiveCategoryInput();
      }
    }

    /* -------------------------------------------------------------
       分類 Tab 切換 (底部導覽列)
       ------------------------------------------------------------- */
    function switchCategoryTab(cat) {
      currentCategory = cat;
      selectedEntityId = 'all';

      const catNames = {
        cards: '信用卡費',
        banks: '銀行餘額',
        bills: '固定費用',
        installments: '分期付款'
      };
      document.getElementById('header-category-label').textContent = catNames[cat];

      const tabs = ['cards', 'banks', 'bills', 'installments'];
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-btn-${t}`);
        const span = btn.querySelector('span');
        if (t === cat) {
          btn.className = 'nav-bottom-item flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center text-nord-8 transition-all';
          span.className = 'text-[11px] font-bold leading-none';
        } else {
          btn.className = 'nav-bottom-item flex-1 py-1 px-1 rounded-xl flex flex-col items-center justify-center text-nord-4 hover:text-nord-6 transition-all';
          span.className = 'text-[11px] font-medium leading-none';
        }
      });

      if (currentMode === 'view') {
        renderActiveCategoryView();
      } else {
        renderActiveCategoryInput();
      }
    }

    function onPersonaSelectChange(val) {
      currentPersona = val;
      selectedEntityId = 'all';
      if (currentMode === 'view') {
        renderActiveCategoryView();
      } else {
        renderActiveCategoryInput();
      }
    }

    function switchChartMode(mode) {
      chartRangeMode = mode;
      const b1 = document.getElementById('btn-chart-rolling12');
      const b2 = document.getElementById('btn-chart-ytd');
      if (mode === 'rolling12') {
        b1.className = 'px-2 py-0.5 rounded-md font-bold bg-nord-8 text-nord-0 transition-all';
        b2.className = 'px-2 py-0.5 rounded-md font-medium text-nord-4 transition-all';
      } else {
        b2.className = 'px-2 py-0.5 rounded-md font-bold bg-nord-8 text-nord-0 transition-all';
        b1.className = 'px-2 py-0.5 rounded-md font-medium text-nord-4 transition-all';
      }
      renderActiveCategoryView();
    }

    /* -------------------------------------------------------------
       資料加載 (優先使用嵌入資料庫，防止 file:// 跨域報錯)
       ------------------------------------------------------------- */
    async function getProfileData() {
      if (dbCache[currentPersona]) return dbCache[currentPersona];
      if (window.EMBEDDED_DUMMY_DB && window.EMBEDDED_DUMMY_DB[currentPersona]) {
        // Deep clone 避免污染預設資料
        dbCache[currentPersona] = JSON.parse(JSON.stringify(window.EMBEDDED_DUMMY_DB[currentPersona]));
        return dbCache[currentPersona];
      }
      try {
        const res = await fetch(`./database/dummy_db_${currentPersona}.json`);
        if (res.ok) {
          const data = await res.json();
          dbCache[currentPersona] = data;
          return data;
        }
      } catch (e) {
        // Fallback below
      }
      return getDefaultMockData(currentPersona);
    }

        let curTerm = i.currentTerm;
        if (curTerm === undefined && i.startYear && i.startMonth) {
          curTerm = Math.max(1, Math.min(totalPeriods, (CURRENT_YEAR - i.startYear) * 12 + (CURRENT_MONTH - i.startMonth) + 1));
        } else if (curTerm === undefined) {
          curTerm = 1;
        }
        return {
          id: i.id,
          name: i.title || i.name || '消費分期',
          monthlyAmount: i.regularPeriodAmount || i.monthlyAmount || (i.totalAmount ? Math.round(i.totalAmount / totalPeriods) : 3000),
          totalTerms: totalPeriods,
          currentTerm: curTerm,
          totalAmount: i.totalAmount || (totalPeriods * (i.regularPeriodAmount || 3000))
        };

    /* -------------------------------------------------------------
       Chart.js 圖表渲染 (行動端降維優化)
       ------------------------------------------------------------- */
    function initOrResetChart(labels, datasets) {
      const ctx = document.getElementById('mobile-line-chart').getContext('2d');
      if (chartInstance) {
        chartInstance.destroy();
      }

      // 行動端 X 軸抽樣過濾：每隔 1 個月顯示一次標籤，防止密擠破版
      const isMobileSmall = window.innerWidth <= 430;
      
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(46, 52, 64, 0.95)',
              titleColor: '#ECEFF4',
              bodyColor: '#D8DEE9',
              borderColor: '#434C5E',
              borderWidth: 1,
              padding: 8,
              boxPadding: 4,
              usePointStyle: true,
              callbacks: {
                label: function(ctx) {
                  return `${ctx.dataset.label}: NT$ ${formatCurrency(ctx.raw)}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(67, 76, 94, 0.3)',
                drawBorder: false
              },
              ticks: {
                color: '#81A1C1',
                font: { size: 9, family: 'JetBrains Mono' },
                maxRotation: 0,
                autoSkip: true,
                maxTicksLimit: isMobileSmall ? 6 : 12 // 行動端最多顯示 6 個標籤
              }
            },
            y: {
              grid: {
                color: 'rgba(67, 76, 94, 0.3)',
                drawBorder: false
              },
              ticks: {
                color: '#81A1C1',
                font: { size: 9, family: 'JetBrains Mono' },
                callback: function(v) {
                  return v >= 10000 ? `${v / 10000}萬` : v;
                }
              }
            }
          }
        }
      });
    }

    function renderCardsChart(cards, slots) {
      const labels = slots.map(s => s.label);
      let targetCards = selectedEntityId === 'all' ? cards : cards.filter(c => c.id === selectedEntityId);

      const colors = ['#88C0D0', '#81A1C1', '#A3BE8C', '#EBCB8B', '#B48EAD', '#D08770'];
      const datasets = targetCards.map((card, idx) => {
        const data = slots.map(slot => {
          const rec = (card.records || []).find(r => r.year === slot.year && r.month === slot.month);
          return rec ? rec.amount : Math.round(15000 + Math.sin(slot.month) * 4000);
        });
        const c = colors[idx % colors.length];
        return {
          label: card.name,
          data: data,
          borderColor: c,
          backgroundColor: c + '22',
          tension: 0.35,
          fill: targetCards.length === 1,
          pointRadius: 2.5,
          pointHitRadius: 25 // 解決痛點 4：觸控半徑加大
        };
      });

      initOrResetChart(labels, datasets);
    }

    function renderBanksChart(banks, slots) {
      const labels = slots.map(s => s.label);
      let targetBanks = selectedEntityId === 'all' ? banks : banks.filter(b => b.id === selectedEntityId);

      const colors = ['#5E81AC', '#88C0D0', '#A3BE8C', '#EBCB8B'];
      const datasets = targetBanks.map((bank, idx) => {
        const data = slots.map(slot => {
          const base = bank.balance || 100000;
          return Math.round(base * (0.9 + Math.cos(slot.month + idx) * 0.12));
        });
        const c = colors[idx % colors.length];
        return {
          label: bank.name,
          data: data,
          borderColor: c,
          backgroundColor: c + '22',
          tension: 0.35,
          fill: targetBanks.length === 1,
          pointRadius: 2.5,
          pointHitRadius: 25
        };
      });

      initOrResetChart(labels, datasets);
    }

    function renderBillsChart(bills, slots) {
      const labels = slots.map(s => s.label);
      const data = slots.map(slot => {
        return bills.reduce((sum, b) => {
          if (b.cycle === 'monthly') return sum + b.amount;
          return (slot.month % 2 === 0) ? sum + b.amount : sum;
        }, 0);
      });

      const datasets = [{
        label: '固定費用總支出',
        data: data,
        borderColor: '#8FBCBB',
        backgroundColor: '#8FBCBB25',
        tension: 0.3,
        fill: true,
        pointRadius: 3,
        pointHitRadius: 25
      }];

      initOrResetChart(labels, datasets);
    }

    function renderInstallmentsChart(installments, slots) {
      const labels = slots.map(s => s.label);
      const data = slots.map((slot, sIdx) => {
        return installments.reduce((sum, i) => {
          const term = i.currentTerm + sIdx;
          return term <= i.totalTerms ? sum + i.monthlyAmount : sum;
        }, 0);
      });

      const datasets = [{
        label: '分期每月攤提壓迫額',
        data: data,
        borderColor: '#B48EAD',
        backgroundColor: '#B48EAD25',
        tension: 0.35,
        fill: true,
        pointRadius: 3,
        pointHitRadius: 25
      }];

      initOrResetChart(labels, datasets);
    }

    function handleMobileCardAmountChange(val) {
      const db = dbCache[currentPersona];
      if (db && db.cards && db.cards[cardInputIndex]) {
        const c = db.cards[cardInputIndex];
        let rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        const num = val === '' ? null : Number(val);
        if (rec) rec.amount = num;
        else c.records.push({ year: CURRENT_YEAR, month: CURRENT_MONTH, amount: num, bigExpenses: [] });
      }
    }

    function stepCardIndex(dir) {
      cardInputIndex += dir;
      renderActiveCategoryInput();
    }

    function skipMobileCardAmount() {
      const db = dbCache[currentPersona];
      if (db && db.cards && db.cards[cardInputIndex]) {
        const c = db.cards[cardInputIndex];
        let rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (rec) rec.amount = 0;
        else c.records.push({ year: CURRENT_YEAR, month: CURRENT_MONTH, amount: 0, bigExpenses: [] });
      }
      nextMobileCard();
    }

    function nextMobileCard() {
      const db = dbCache[currentPersona];
      const cards = db.cards || [];
      const inp = document.getElementById('mobile-card-amount-input');
      if (inp && inp.value !== '') {
        handleMobileCardAmountChange(inp.value);
      }
      if (cardInputIndex < cards.length - 1) {
        cardInputIndex++;
        renderActiveCategoryInput();
      } else {
        enterMobileCardStage2();
      }
    }

    function enterMobileCardStage2() {
      const db = dbCache[currentPersona];
      const cards = db.cards || [];
      cardInputStage = 2;
      cardInputIndex = 0;
      cardStage2Order = cards
        .map((c, idx) => {
          const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
          return { originalIndex: idx, amount: (rec && rec.amount) || 0 };
        })
        .sort((a, b) => b.amount - a.amount);
      renderActiveCategoryInput();
    }

    function confirmStage2MobileCard() {
      const list = cardStage2Order.length > 0 ? cardStage2Order : (dbCache[currentPersona].cards || []);
      if (cardInputIndex < list.length - 1) {
        cardInputIndex++;
        renderActiveCategoryInput();
      } else {
        cardInputStage = 3;
        renderActiveCategoryInput();
      }
    }

    async function addMobileBigExpense() {
      const nameInp = document.getElementById('mobile-big-title');
      const amtInp = document.getElementById('mobile-big-amt');
      if (!nameInp || !nameInp.value || !amtInp || !amtInp.value) return;

      const title = nameInp.value.trim();
      const amount = Number(amtInp.value);
      if (!title || isNaN(amount) || amount <= 0) return;

      const db = dbCache[currentPersona];
      const targetCard = (cardInputStage === 2 && cardStage2Order.length > 0)
        ? db.cards[cardStage2Order[cardInputIndex].originalIndex]
        : db.cards[cardInputIndex];

      if (targetCard) {
        let rec = (targetCard.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (!rec) {
          rec = { year: CURRENT_YEAR, month: CURRENT_MONTH, amount: 0, bigExpenses: [] };
          targetCard.records.push(rec);
        }
        if (!rec.bigExpenses) rec.bigExpenses = [];
        rec.bigExpenses.push({ id: 'be_' + Date.now(), title, amount });
        nameInp.value = '';
        amtInp.value = '';
        renderActiveCategoryInput();
      }
    }

    async function removeMobileBigExpense(expIdx) {
      const db = dbCache[currentPersona];
      const targetCard = (cardInputStage === 2 && cardStage2Order.length > 0)
        ? db.cards[cardStage2Order[cardInputIndex].originalIndex]
        : db.cards[cardInputIndex];

      if (targetCard) {
        const rec = (targetCard.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (rec && rec.bigExpenses) {
          rec.bigExpenses.splice(expIdx, 1);
          renderActiveCategoryInput();
        }
      }

    function resetCardFlowMobile() {
      cardInputStage = 1;

    /* 2. 銀行餘額輸入面板 (行動端兩階段：智慧滾算推估 + [推估無誤] + 收支事件歸戶) */
    function getMobileBankEstimated(db, bank) {
      const snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
      if (snap && snap.theoreticalBalance !== undefined) return snap.theoreticalBalance;
      
      const lastBal = bank.balance || 80000;
      const salary = bank.defaultSalary || 0;
      const pendingCards = (db.cards || [])
        .filter(c => c.bankId === bank.id)
        .reduce((sum, c) => {
          const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
          return sum + ((rec && rec.amount) || 0);
        }, 0);
      const pendingBills = (db.recurringBills || db.bills || [])
        .filter(b => (b.paymentMethod === 'bank_direct' || b.targetType === 'bank') && b.targetId === bank.id)
        .reduce((sum, b) => sum + (b.defaultAmount !== undefined ? b.defaultAmount : (b.amount || 0)), 0);

      return lastBal + salary - pendingCards - pendingBills;
    }

    function renderBankInputPanel(db, panel) {
      const banks = db.banks || [];
      if (banks.length === 0) {
        panel.innerHTML = `<div class="p-6 text-center text-nord-4">無可用銀行帳戶資料</div>`;
        return;
      }

      if (bankInputStage === 3) {
        renderBankCompleteViewMobile(db, panel);
        return;
      }

      if (bankInputIndex >= banks.length) bankInputIndex = 0;
      const bank = banks[bankInputIndex];
      const isStage2 = (bankInputStage === 2);
      const isLast = (bankInputIndex === banks.length - 1);

      const snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id) || {
        balance: bank.balance || 0,
        theoreticalBalance: bank.balance || 0,
        events: []
      };
      if (!snap.events) snap.events = [];

      const estimated = getMobileBankEstimated(db, bank);
      const curBal = (bank.balance !== null && bank.balance !== undefined) ? bank.balance : estimated;
      const diff = curBal - estimated;
      const hasEvents = snap.events.length > 0;

      // 滾算因子
      const salary = bank.defaultSalary || 0;
      const cardDebit = (db.cards || [])
        .filter(c => c.bankId === bank.id)
        .reduce((sum, c) => {
          const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
          return sum + ((rec && rec.amount) || 0);
        }, 0);
      const fixedDebit = (db.recurringBills || db.bills || [])
        .filter(b => (b.paymentMethod === 'bank_direct' || b.targetType === 'bank') && b.targetId === bank.id)
        .reduce((sum, b) => sum + (b.defaultAmount !== undefined ? b.defaultAmount : (b.amount || 0)), 0);
      const lastBal = bank.lastBalance || (curBal - salary + cardDebit + fixedDebit);

      panel.innerHTML = `
        <div class="space-y-4">
          
          <!-- 頂部進度 -->
          <div class="flex items-center justify-between text-xs px-1">
            <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold ${isStage2 ? 'bg-nord-13/15 text-nord-13 border border-nord-13/30' : 'bg-nord-9/15 text-nord-9 border border-nord-9/30'} flex items-center space-x-1.5">
              <span class="w-1.5 h-1.5 rounded-full ${isStage2 ? 'bg-nord-13 animate-pulse' : 'bg-nord-9 animate-pulse'}"></span>
              <span>${isStage2 ? '第二階段：收支事件歸戶' : '第一階段：盤點銀行餘額'}</span>

            <span class="font-mono text-nord-4 text-[11px]">

            </span>

          <!-- 卡面擬真展示區塊 -->
          <div class="relative bg-gradient-to-tr from-nord-0 via-nord-1 to-nord-2 rounded-2xl p-5 border border-nord-4/20 shadow-xl overflow-hidden">
            
            ${!isStage2 ? `
              <!-- 正面 (第一階段：月度自動滾算理論餘額 + 一鍵確認) -->
              <div class="space-y-3.5">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-building-columns text-nord-9"></i>
                    <span class="text-sm font-bold text-nord-6">${bank.name}</span>
                    <span class="text-[10px] text-nord-4 font-mono">代碼 ${bank.code || '808'}</span>

                  <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-nord-9/20 text-nord-9 border border-nord-9/30">
                    月度自動滾算
                  </span>
                </div>

                <!-- 滾算明細展示框 -->
                <div class="bg-nord-0/60 p-2.5 rounded-xl border border-white/5 space-y-1 text-xs">
                  <div class="flex items-center justify-between text-nord-4">
                    <span>上次盤點餘額</span>
                    <span class="font-mono masked-amount">NT$ ${formatCurrency(lastBal)}</span>
                  </div>
                  ${salary > 0 ? `
                  <div class="flex items-center justify-between text-nord-14">
                    <span>+ 固定薪資入帳</span>
                    <span class="font-mono masked-amount">+NT$ ${formatCurrency(salary)}</span>
                  </div>` : ''}
                  ${cardDebit > 0 ? `
                  <div class="flex items-center justify-between text-nord-11">
                    <span>- 綁定信用卡費</span>
                    <span class="font-mono masked-amount">-NT$ ${formatCurrency(cardDebit)}</span>
                  </div>` : ''}
                  ${fixedDebit > 0 ? `
                  <div class="flex items-center justify-between text-nord-12">
                    <span>- 房租/車貸直扣</span>
                    <span class="font-mono masked-amount">-NT$ ${formatCurrency(fixedDebit)}</span>
                  </div>` : ''}
                  <div class="pt-1 border-t border-nord-2/60 flex items-center justify-between font-semibold">
                    <span class="text-nord-9 font-bold">今日推估餘額</span>
                    <span class="font-mono text-sm text-nord-9 font-bold masked-amount">NT$ ${formatCurrency(estimated)}</span>
                  </div>
                </div>

                <!-- 實際餘額微調輸入框 -->
                <div>
                  <div class="relative">
                    <span class="absolute left-3.5 top-2.5 text-xs font-bold text-nord-4 font-mono">實際 NT$</span>
                    <input id="mobile-bank-input" type="number" inputmode="decimal" value="${curBal}"
                      oninput="handleMobileBankAmountChange('${bank.id}', this.value)"
                      class="w-full pl-20 pr-4 py-2 text-center text-lg font-bold font-mono tracking-tight rounded-xl bg-nord-0/90 border-2 border-nord-9/40 focus:border-nord-9 text-nord-6 outline-none shadow-inner">
                  </div>
                </div>

                <div class="flex items-center justify-between text-[11px] text-nord-4/70 pt-0.5">
                  <span>點擊「推估無誤」即以此餘額歸檔</span>
                  <span class="font-mono">差額 NT$ ${formatCurrency(diff)}</span>
                </div>
              </div>
            ` : `
              <!-- 背面 (第二階段：收支事件歸戶) -->
              <div class="space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-nord-2/60">
                  <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold text-nord-6">${bank.name}</span>
                    <span class="text-[11px] text-nord-4">盤點：<b class="text-nord-9 font-mono masked-amount">NT$ ${formatCurrency(curBal)}</b></span>
                  </div>
                  <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-nord-9/20 text-nord-9 border border-nord-9/30">收支事件歸戶</span>

                <!-- 歸戶事件清單 -->

                  ${snap.events.length === 0 ? `
                    <div class="p-2 bg-nord-0/40 rounded-lg border border-dashed border-nord-2 text-center text-[11px] text-nord-4/70 italic">
                      尚無收支事件歸戶
                    </div>
                  ` : snap.events.map((evt, idx) => {
                    const isOut = (evt.type === 'withdrawal' || evt.type === 'transfer_out');
                    const typeLabel = {
                      withdrawal: '提款', dividend: '股利', interest: '利息',
                      transfer_out: '轉帳', salary: '薪資', bonus: '獎金'

                    return `

                        <div class="flex items-center space-x-1.5">

                        <div class="flex items-center space-x-2">
                          <span class="font-mono font-bold ${isOut ? 'text-nord-11' : 'text-nord-14'} masked-amount">

                          </span>
                          <button onclick="removeMobileBankEvent(${idx})" class="text-nord-4 hover:text-nord-11 p-0.5">
                            <i class="fa-solid fa-xmark text-xs"></i>
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- 6 大標準事件類型膠囊與新增面板 -->
                <div class="pt-2 border-t border-nord-2/60 space-y-2">
                  <div class="flex items-center space-x-1 overflow-x-auto pb-0.5">
                    <button type="button" onclick="setMobileBankEventType('withdrawal')" class="px-2 py-0.5 rounded text-[10px] transition-colors ${currentMobileBankEventType === 'withdrawal' ? 'bg-nord-11 text-nord-0 font-bold' : 'bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2'}">提款</button>
                    <button type="button" onclick="setMobileBankEventType('dividend')" class="px-2 py-0.5 rounded text-[10px] transition-colors ${currentMobileBankEventType === 'dividend' ? 'bg-nord-14 text-nord-0 font-bold' : 'bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2'}">股利收入</button>
                    <button type="button" onclick="setMobileBankEventType('interest')" class="px-2 py-0.5 rounded text-[10px] transition-colors ${currentMobileBankEventType === 'interest' ? 'bg-nord-14 text-nord-0 font-bold' : 'bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2'}">利息收入</button>
                    <button type="button" onclick="setMobileBankEventType('transfer_out')" class="px-2 py-0.5 rounded text-[10px] transition-colors ${currentMobileBankEventType === 'transfer_out' ? 'bg-nord-12 text-nord-0 font-bold' : 'bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2'}">轉帳支出</button>
                    <button type="button" onclick="setMobileBankEventType('salary')" class="px-2 py-0.5 rounded text-[10px] transition-colors ${currentMobileBankEventType === 'salary' ? 'bg-nord-14 text-nord-0 font-bold' : 'bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2'}">薪資收入</button>
                    <button type="button" onclick="setMobileBankEventType('bonus')" class="px-2 py-0.5 rounded text-[10px] transition-colors ${currentMobileBankEventType === 'bonus' ? 'bg-nord-14 text-nord-0 font-bold' : 'bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2'}">獎金收入</button>
                  </div>

                  <div class="space-y-1.5">
                    <input id="mobile-event-title" type="text" placeholder="事件說明 (如：ATM提款、0050配息)"
                      class="w-full px-2.5 py-1.5 rounded-lg bg-nord-0 border border-nord-2 text-xs text-nord-6 placeholder-nord-3 focus:border-nord-9 outline-none">
                    <div class="flex items-center space-x-2">
                      <div class="relative flex-1">
                        <span class="absolute left-2 top-1.5 text-[10px] text-nord-4 font-mono">$</span>
                        <input id="mobile-event-amount" type="number" inputmode="decimal" placeholder="金額"
                          class="w-full pl-5 pr-2 py-1.5 rounded-lg bg-nord-0 border border-nord-2 text-xs font-mono text-nord-6 placeholder-nord-3 focus:border-nord-9 outline-none">
                      </div>
                      <button onclick="addMobileBankEvent()"
                        class="px-3.5 py-1.5 rounded-lg bg-nord-9 hover:bg-nord-8 text-nord-0 text-xs font-bold transition-all flex items-center space-x-1 shrink-0">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>新增</span>
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            `}
          </div>

          <!-- 控制動作列 (嚴格對齊 UI_VOCABULARY 規範) -->
          <div class="flex items-center space-x-2 pt-1">
            ${!isStage2 ? `
              <button onclick="stepBankIndexMobile(-1)" ${bankInputIndex === 0 ? 'disabled' : ''}
                class="flex-1 py-2.5 rounded-xl bg-nord-1 border border-nord-2 text-xs text-nord-4 hover:text-nord-6 disabled:opacity-30 disabled:cursor-not-allowed">
                上一家
              </button>
              <button onclick="confirmEstimatedBankMobile()"
                class="flex-[2] py-2.5 rounded-xl bg-nord-9 hover:bg-nord-8 text-nord-0 font-bold text-xs shadow-md shadow-nord-9/20 flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-check text-[10px]"></i>
                <span>推估無誤</span>
              </button>
              <button onclick="nextBankMobile()"
                class="flex-1 py-2.5 rounded-xl bg-nord-1 border border-nord-2 text-xs text-nord-4 hover:text-nord-6">
                下一家
              </button>
            ` : `
              <button onclick="stepBankIndexMobile(-1)" ${bankInputIndex === 0 ? 'disabled' : ''}
                class="flex-1 py-2.5 rounded-xl bg-nord-1 border border-nord-2 text-xs text-nord-4 hover:text-nord-6 disabled:opacity-30 disabled:cursor-not-allowed">
                上一家
              </button>
              <button onclick="confirmStage2MobileBank()"
                class="flex-[2] py-2.5 rounded-xl ${hasEvents ? 'bg-nord-14 text-nord-0' : 'bg-nord-9 text-nord-0'} font-bold text-xs shadow-md flex items-center justify-center space-x-1.5">
                <span>${hasEvents ? (isLast ? '確認並完成結算' : '確認，下一家') : (isLast ? '無事件，完成盤點' : '無事件，下一家')}</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>
            `}
          </div>

        </div>
      `;
    }

    function handleMobileBankAmountChange(bankId, val) {
      const db = dbCache[currentPersona];
      const bank = (db.banks || []).find(b => b.id === bankId);
      if (bank) {
        const num = val === '' ? null : Number(val);
        bank.balance = num;
        let snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bankId);
        if (snap) snap.balance = num;
      }
    }

    function stepBankIndexMobile(dir) {
      bankInputIndex += dir;
      renderActiveCategoryInput();
    }

    function confirmEstimatedBankMobile() {
      const db = dbCache[currentPersona];
      const banks = db.banks || [];
      const bank = banks[bankInputIndex];
      const estimated = getMobileBankEstimated(db, bank);
      bank.balance = estimated;
      let snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
      if (snap) snap.balance = estimated;
      nextBankMobile();
    }

    function nextBankMobile() {
      const db = dbCache[currentPersona];
      const banks = db.banks || [];
      if (bankInputIndex < banks.length - 1) {
        bankInputIndex++;
        renderActiveCategoryInput();
      } else {
        bankInputStage = 2;
        bankInputIndex = 0;
        renderActiveCategoryInput();
      }
    }

    function setMobileBankEventType(type) {
      currentMobileBankEventType = type;
      renderActiveCategoryInput();
    }

    function addMobileBankEvent() {
      const titleInp = document.getElementById('mobile-event-title');
      const amtInp = document.getElementById('mobile-event-amount');
      if (!titleInp || !titleInp.value || !amtInp || !amtInp.value) return;

      const title = titleInp.value.trim();
      const amount = Number(amtInp.value);
      if (!title || isNaN(amount) || amount <= 0) return;

      const db = dbCache[currentPersona];
      const bank = db.banks[bankInputIndex];
      if (bank) {
        let snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
        if (!snap) {
          snap = { year: CURRENT_YEAR, month: CURRENT_MONTH, bankId: bank.id, balance: bank.balance, events: [] };
          if (!db.bankSnapshots) db.bankSnapshots = [];
          db.bankSnapshots.push(snap);
        }
        if (!snap.events) snap.events = [];
        snap.events.push({
          id: 'be_' + Date.now(),
          type: currentMobileBankEventType,
          title,
          amount
        });
        titleInp.value = '';
        amtInp.value = '';
        renderActiveCategoryInput();
      }
    }

    function removeMobileBankEvent(idx) {
      const db = dbCache[currentPersona];
      const bank = db.banks[bankInputIndex];
      if (bank) {
        const snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
        if (snap && snap.events) {
          snap.events.splice(idx, 1);
          renderActiveCategoryInput();
        }
      }
    }

    function confirmStage2MobileBank() {
      const db = dbCache[currentPersona];
      const banks = db.banks || [];
      if (bankInputIndex < banks.length - 1) {
        bankInputIndex++;
        renderActiveCategoryInput();
      } else {
        bankInputStage = 3;
        renderActiveCategoryInput();
      }
    }

    function renderBankCompleteViewMobile(db, panel) {
      const banks = db.banks || [];
      const totalBal = banks.reduce((s, b) => s + (b.balance || 0), 0);
      let totalEvents = 0;
      (db.bankSnapshots || []).forEach(s => {
        if (s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.events) {
          totalEvents += s.events.length;
        }
      });

      panel.innerHTML = `
        <div class="my-auto max-w-sm mx-auto w-full bg-nord-1/90 border border-nord-2 rounded-2xl p-5 text-center shadow-2xl backdrop-blur-xl">
          <div class="w-12 h-12 rounded-full bg-nord-14/20 text-nord-14 border border-nord-14/30 flex items-center justify-center mx-auto mb-3 text-xl">
            <i class="fa-solid fa-building-columns"></i>
          </div>
          <h3 class="text-base font-bold text-nord-6 mb-1">銀行餘額盤點完成</h3>
          <p class="text-xs text-nord-4 mb-4">全數 ${banks.length} 間銀行帳戶結餘與收支事件已完成同步歸戶</p>

          <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="bg-nord-0/60 p-2.5 rounded-xl border border-nord-2/60 text-left">
              <span class="text-[10px] text-nord-4 block">銀行總流動資金</span>
              <span class="text-sm font-bold font-mono text-nord-14 masked-amount">NT$ ${formatCurrency(totalBal)}</span>
            </div>
            <div class="bg-nord-0/60 p-2.5 rounded-xl border border-nord-2/60 text-left">
              <span class="text-[10px] text-nord-4 block">歸戶收支事件</span>
              <span class="text-sm font-bold font-mono text-nord-9">${totalEvents} 筆</span>
            </div>
          </div>

          <div class="space-y-2">
            <button onclick="switchCategoryTab('bills')" class="w-full py-2.5 rounded-xl bg-nord-9 hover:bg-nord-8 text-nord-0 text-xs font-bold shadow-md shadow-nord-9/20 transition-all flex items-center justify-center space-x-1.5">
              <span>前往固定費用</span>
              <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="resetBankFlowMobile()" class="py-2 rounded-xl border border-nord-2 bg-nord-0 text-xs text-nord-4 hover:text-nord-6">
                重新盤點
              </button>
              <button onclick="toggleViewInputMode()" class="py-2 rounded-xl bg-nord-2 text-xs text-nord-6 font-medium">
                返回瀏覽
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function resetBankFlowMobile() {
      bankInputStage = 1;
      bankInputIndex = 0;
      renderActiveCategoryInput();
    }

    /* 3. 固定費用輸入面板 */
    function renderBillInputPanel(db, panel) {
      const rawBills = db.recurringBills || db.bills || [];
      const bills = rawBills.map(b => ({
        id: b.id,
        name: b.name || '固定支出',
        amount: b.defaultAmount !== undefined ? b.defaultAmount : (b.amount || 0),
        cycle: b.cycle || 'monthly',
        status: b.status || 'pending'
      }));

      panel.innerHTML = `
        <div class="space-y-3">
          <div class="p-3 bg-nord-0/60 rounded-xl border border-nord-2 text-xs space-y-2">
            <span class="text-xs font-bold text-nord-7 block">快速新增一筆支出</span>
            <div class="grid grid-cols-2 gap-2">
              <input id="new-bill-name" type="text" placeholder="費用名稱 (如 水費)" class="px-3 py-1.5 rounded-lg bg-nord-1 border border-nord-2 text-xs text-nord-6 outline-none">
              <input id="new-bill-amt" type="number" inputmode="decimal" placeholder="金額 NT$" class="px-3 py-1.5 rounded-lg bg-nord-1 border border-nord-2 text-xs text-nord-6 font-mono outline-none">
            </div>
            <button onclick="addNewBillFast()" class="w-full py-1.5 rounded-lg bg-nord-7/20 hover:bg-nord-7/30 text-nord-7 font-bold text-xs border border-nord-7/40 transition-colors">
              + 登記新費用
            </button>
          </div>

          <div class="text-[11px] font-bold text-nord-4 px-1">本月扣繳狀態快速標記</div>
          ${bills.map((b, idx) => `
            <div class="bg-nord-1/80 border border-nord-2 rounded-xl p-3 flex items-center justify-between">
              <div>
                <span class="text-xs font-bold text-nord-6 block">${b.name}</span>
                <span class="text-[10px] text-nord-4 font-mono">NT$ ${formatCurrency(b.amount)} • ${b.cycle === 'monthly' ? '每月' : '雙月'}</span>
              </div>
              <div class="flex items-center space-x-1">
                <button onclick="toggleBillStatus(${idx}, 'paid')" class="px-2 py-1 rounded-md text-[10px] font-bold ${b.status === 'paid' ? 'bg-nord-14 text-nord-0' : 'bg-nord-0 text-nord-4 border border-nord-2'}">
                  已繳
                </button>
                <button onclick="toggleBillStatus(${idx}, 'pending')" class="px-2 py-1 rounded-md text-[10px] font-bold ${b.status === 'pending' ? 'bg-nord-13 text-nord-0' : 'bg-nord-0 text-nord-4 border border-nord-2'}">
                  待繳
                </button>
                <button onclick="toggleBillStatus(${idx}, 'waived')" class="px-2 py-1 rounded-md text-[10px] font-bold ${b.status === 'waived' ? 'bg-nord-3 text-nord-4' : 'bg-nord-0 text-nord-4 border border-nord-2'}">
                  免繳
                </button>
              </div>
            </div>
          `).join('')}

          <div class="pt-2">
            <button onclick="saveBillsAndReturn()"
              class="w-full py-3 rounded-xl bg-nord-7 hover:bg-nord-8 text-nord-0 font-bold text-sm shadow-lg shadow-nord-7/20 transition-all flex items-center justify-center space-x-2">
              <i class="fa-solid fa-check text-xs"></i>
              <span>儲存固定費用狀態 (返回瀏覽)</span>
            </button>
          </div>
        </div>
      `;
    }

    async function toggleBillStatus(idx, status) {
      const db = await getProfileData();
      const list = db.recurringBills || db.bills;
      if (list && list[idx]) {
        list[idx].status = status;
        renderActiveCategoryInput();
      }
    }
    async function addNewBillFast() {
      const nameInp = document.getElementById('new-bill-name');
      const amtInp = document.getElementById('new-bill-amt');
      if (!nameInp || !nameInp.value) return;
      const db = await getProfileData();
      if (db) {
        if (!db.recurringBills) db.recurringBills = [];
        db.recurringBills.push({
          id: 'b_' + Date.now(),
          name: nameInp.value,
          defaultAmount: Number(amtInp.value) || 0,
          cycle: 'monthly',
          dueDay: 15,
          paymentMethod: 'bank_direct',
          status: 'pending'
        });
        showToast('已登記新固定費用！');
        renderActiveCategoryInput();
      }
    }
    function saveBillsAndReturn() {
      showToast('✅ 固定費用已確認完畢！');
      toggleViewInputMode();
    }

    /* 4. 分期付款輸入面板 */
    function renderInstallmentInputPanel(db, panel) {
      const rawInst = db.installments || [];
      const installments = rawInst.map((i, idx) => {
        const totalPeriods = i.totalPeriods || i.totalTerms || 12;
        let curTerm = i.currentTerm;
        if (curTerm === undefined && i.startYear && i.startMonth) {
          curTerm = Math.max(1, Math.min(totalPeriods, (CURRENT_YEAR - i.startYear) * 12 + (CURRENT_MONTH - i.startMonth) + 1));
        } else if (curTerm === undefined) {
          curTerm = 1;
        }
        return {
          id: i.id,
          name: i.title || i.name || '消費分期',
          monthlyAmount: i.regularPeriodAmount || i.monthlyAmount || 3000,
          totalTerms: totalPeriods,
          currentTerm: curTerm,
          rawIndex: idx
        };
      });

      panel.innerHTML = `
        <div class="space-y-3">
          <!-- 一鍵全數推進 +1 期 -->
          <div class="bg-nord-15/15 border border-nord-15/30 rounded-xl p-3 flex items-center justify-between">
            <div>
              <span class="text-xs font-bold text-nord-15 block">月結換季快速推進</span>
              <span class="text-[10px] text-nord-4">將所有進行中分期推進 1 期</span>
            </div>
            <button onclick="advanceAllInstallments()" class="px-3 py-1.5 rounded-lg bg-nord-15 hover:bg-nord-15/90 text-nord-0 font-bold text-xs shadow-md transition-colors">
              全部 +1 期
            </button>
          </div>

          <!-- 快速新增一筆分期商品 -->
          <div class="p-3 bg-nord-0/60 rounded-xl border border-nord-2 text-xs space-y-2">
            <span class="text-xs font-bold text-nord-15 block">新增消費分期</span>
            <input id="new-inst-name" type="text" placeholder="商品名稱 (如：iPhone 16 Pro)" class="w-full px-3 py-1.5 rounded-lg bg-nord-1 border border-nord-2 text-xs text-nord-6 outline-none">
            <div class="grid grid-cols-2 gap-2">
              <input id="new-inst-monthly" type="number" inputmode="decimal" placeholder="每月攤提 NT$" class="px-3 py-1.5 rounded-lg bg-nord-1 border border-nord-2 text-xs text-nord-6 font-mono outline-none">
              <input id="new-inst-terms" type="number" inputmode="numeric" placeholder="總期數 (如 12)" class="px-3 py-1.5 rounded-lg bg-nord-1 border border-nord-2 text-xs text-nord-6 font-mono outline-none">
            </div>
            <button onclick="addNewInstallmentFast()" class="w-full py-1.5 rounded-lg bg-nord-15/20 hover:bg-nord-15/30 text-nord-15 font-bold text-xs border border-nord-15/40 transition-colors">
              + 登記新分期
            </button>
          </div>

          <div class="text-[11px] font-bold text-nord-4 px-1">進行中分期進度調整</div>
          ${installments.map((i, idx) => `
            <div class="bg-nord-1/80 border border-nord-2 rounded-xl p-3 flex items-center justify-between">
              <div>
                <span class="text-xs font-bold text-nord-6 block">${i.name}</span>
                <span class="text-[10px] text-nord-4 font-mono">
                  NT$ ${formatCurrency(i.monthlyAmount)} /月 (剩 ${Math.max(0, i.totalTerms - i.currentTerm)} 期)
                </span>
              </div>
              <div class="flex items-center space-x-2">
                <button onclick="stepSingleInstallment(${i.rawIndex}, -1)" class="w-7 h-7 rounded-lg bg-nord-0 border border-nord-2 text-nord-4 hover:text-nord-6 text-xs">-</button>
                <span class="text-xs font-mono font-bold text-nord-6 w-8 text-center">${i.currentTerm}/${i.totalTerms}</span>
                <button onclick="stepSingleInstallment(${i.rawIndex}, 1)" class="w-7 h-7 rounded-lg bg-nord-0 border border-nord-2 text-nord-4 hover:text-nord-6 text-xs">+</button>
              </div>
            </div>
          `).join('')}

          <div class="pt-2">
            <button onclick="saveInstallmentsAndReturn()"
              class="w-full py-3 rounded-xl bg-nord-15 hover:bg-nord-15/90 text-nord-0 font-bold text-sm shadow-lg shadow-nord-15/20 transition-all flex items-center justify-center space-x-2">
              <i class="fa-solid fa-check text-xs"></i>
              <span>儲存分期進度 (返回瀏覽)</span>
            </button>
          </div>
        </div>
      `;
    }

    async function advanceAllInstallments() {
      const db = await getProfileData();
      if (db && db.installments) {
        db.installments.forEach(i => {
          const tot = i.totalPeriods || i.totalTerms || 12;
          let cur = i.currentTerm;
          if (cur === undefined && i.startYear && i.startMonth) {
            cur = Math.max(1, Math.min(tot, (CURRENT_YEAR - i.startYear) * 12 + (CURRENT_MONTH - i.startMonth) + 1));
          } else if (cur === undefined) {
            cur = 1;
          }
          if (cur < tot) i.currentTerm = cur + 1;
        });
        showToast('已將全數分期推進 +1 期！');
        renderActiveCategoryInput();
      }
    }
    async function stepSingleInstallment(rawIdx, delta) {
      const db = await getProfileData();
      if (db && db.installments && db.installments[rawIdx]) {
        const item = db.installments[rawIdx];
        const tot = item.totalPeriods || item.totalTerms || 12;
        let cur = item.currentTerm;
        if (cur === undefined && item.startYear && item.startMonth) {
          cur = Math.max(1, Math.min(tot, (CURRENT_YEAR - item.startYear) * 12 + (CURRENT_MONTH - item.startMonth) + 1));
        } else if (cur === undefined) {
          cur = 1;
        }
        item.currentTerm = Math.max(0, Math.min(tot, cur + delta));
        renderActiveCategoryInput();
      }
    }
    async function addNewInstallmentFast() {
      const nameInp = document.getElementById('new-inst-name');
      const monthlyInp = document.getElementById('new-inst-monthly');
      const termsInp = document.getElementById('new-inst-terms');
      if (!nameInp || !nameInp.value || !monthlyInp || !monthlyInp.value) {
        showToast('請填寫分期商品名稱與每月金額！');
        return;
      }
      const db = await getProfileData();
      if (db) {
        if (!db.installments) db.installments = [];
        const terms = Number(termsInp.value) || 12;
        const monthly = Number(monthlyInp.value) || 0;
        db.installments.push({
          id: 'inst_' + Date.now(),
          title: nameInp.value,
          name: nameInp.value,
          totalPeriods: terms,
          regularPeriodAmount: monthly,
          monthlyAmount: monthly,
          totalAmount: monthly * terms,
          currentTerm: 1,
          startYear: CURRENT_YEAR,
          startMonth: CURRENT_MONTH
        });
        showToast(`已登記新分期：${nameInp.value}`);
        renderActiveCategoryInput();
      }
    }

    function saveInstallmentsAndReturn() {
      showToast('✅ 分期款項進度已更新！');
      toggleViewInputMode();
    }

    /* -------------------------------------------------------------
       初始化啟動
       ------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', async () => {
      syncModeUI();
    });
  </script>
</body>
</html>
