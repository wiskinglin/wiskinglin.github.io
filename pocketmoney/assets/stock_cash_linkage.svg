<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="auto" style="background:#1e222a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei',sans-serif; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.3);">
  <defs>
    <marker id="arrowCyan2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#88C0D0"/>
    </marker>
  </defs>

  <!-- 頂部標題列 -->
  <rect x="0" y="0" width="940" height="52" fill="#242933" rx="12"/>
  <circle cx="28" cy="26" r="6" fill="#BF616A"/>
  <circle cx="48" cy="26" r="6" fill="#EBCB8B"/>
  <circle cx="68" cy="26" r="6" fill="#A3BE8C"/>
  <text x="470" y="32" fill="#D8DEE9" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">PocketMoney 股市待命現金與銀行證券戶雙向動態連動流程圖</text>

  <!-- 左側：銀行帳戶集合 -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="260" height="260" rx="10" fill="#2E3440" stroke="#5E81AC" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#5E81AC"/>
    <text x="130" y="23" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">銀行帳戶庫 (Banks)</text>

    <rect x="15" y="50" width="230" height="50" rx="6" fill="#3B4252" stroke="#88C0D0" stroke-width="1"/>
    <text x="25" y="70" fill="#88C0D0" font-size="12" font-weight="bold">玉山證券交割戶</text>
    <text x="25" y="88" fill="#ECEFF4" font-size="11">存款餘額：NT$ 200,000</text>

    <rect x="15" y="110" width="230" height="50" rx="6" fill="#3B4252" stroke="#88C0D0" stroke-width="1"/>
    <text x="25" y="130" fill="#88C0D0" font-size="12" font-weight="bold">中信證券交割戶</text>
    <text x="25" y="148" fill="#ECEFF4" font-size="11">存款餘額：NT$ 150,000</text>

    <rect x="15" y="170" width="230" height="50" rx="6" fill="#3B4252"/>
    <text x="25" y="190" fill="#D8DEE9" font-size="12">國泰世華生活戶</text>
    <text x="25" y="208" fill="#D8DEE9" font-size="11">存款餘額：NT$ 80,000</text>

    <text x="130" y="244" fill="#81A1C1" font-size="10" text-anchor="middle">自動讀取 banks 資料庫即時餘額</text>
  </g>

  <!-- 中間：設定選擇器 -->
  <g transform="translate(340, 115)">
    <rect x="0" y="0" width="230" height="190" rx="10" fill="#3B4252" stroke="#88C0D0" stroke-width="1.5"/>
    <text x="115" y="30" fill="#EBCB8B" font-size="12" font-weight="bold" text-anchor="middle">⚙️ 勾選證券交割戶</text>
    <text x="115" y="48" fill="#D8DEE9" font-size="10" text-anchor="middle">(securitiesBankIds)</text>

    <rect x="18" y="65" width="194" height="30" rx="5" fill="#2E3440"/>
    <text x="30" y="84" fill="#A3BE8C" font-size="11">☑️ 玉山證券交割戶</text>

    <rect x="18" y="103" width="194" height="30" rx="5" fill="#2E3440"/>
    <text x="30" y="122" fill="#A3BE8C" font-size="11">☑️ 中信證券交割戶</text>

    <rect x="18" y="141" width="194" height="30" rx="5" fill="#2E3440"/>
    <text x="30" y="160" fill="#616E85" font-size="11">⬜ 國泰世華生活戶</text>
  </g>

  <!-- 連線 1 ➔ 2 -->
  <line x1="300" y1="210" x2="340" y2="210" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrowCyan2)"/>

  <!-- 連線 2 ➔ 3 -->
  <line x1="570" y1="210" x2="610" y2="210" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrowCyan2)"/>

  <!-- 右側：股票總資金池 -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="290" height="260" rx="10" fill="#2E3440" stroke="#A3BE8C" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="36" rx="10" fill="#A3BE8C"/>
    <text x="145" y="23" fill="#2E3440" font-size="13" font-weight="bold" text-anchor="middle">股票投資部位總資金池</text>

    <rect x="15" y="50" width="260" height="50" rx="6" fill="#3B4252"/>
    <text x="25" y="70" fill="#88C0D0" font-size="11">動態待命現金總額 (自動加總)</text>
    <text x="25" y="89" fill="#ECEFF4" font-size="13" font-weight="bold">NT$ 350,000 (免手動輸入)</text>

    <rect x="15" y="110" width="260" height="50" rx="6" fill="#3B4252"/>
    <text x="25" y="130" fill="#EBCB8B" font-size="11">股票持倉總市值 (即時股價)</text>
    <text x="25" y="149" fill="#ECEFF4" font-size="13" font-weight="bold">NT$ 2,232,000</text>

    <rect x="15" y="170" width="260" height="65" rx="6" fill="#242933" stroke="#81A1C1"/>
    <text x="25" y="190" fill="#81A1C1" font-size="11" font-weight="bold">即時資產水位比例 (即時重算)</text>
    <text x="25" y="210" fill="#A3BE8C" font-size="14" font-weight="bold">持股 86%  /  待命現金 14%</text>
    <text x="25" y="226" fill="#D8DEE9" font-size="10">銀行交割戶變動 ➔ 資金池零延遲聯動！</text>
  </g>
</svg>
