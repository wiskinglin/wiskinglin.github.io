<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" width="100%" height="auto" style="background:#1e222a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei',sans-serif; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.3);">
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E81AC"/>
      <stop offset="100%" stop-color="#81A1C1"/>
    </linearGradient>
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B4252"/>
      <stop offset="100%" stop-color="#2E3440"/>
    </linearGradient>
    <linearGradient id="spotlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C566A"/>
      <stop offset="100%" stop-color="#3B4252"/>
    </linearGradient>
    <linearGradient id="checklistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3440"/>
      <stop offset="100%" stop-color="#242933"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3BE8C"/>
      <stop offset="100%" stop-color="#8FBCBB"/>
    </linearGradient>
    
    <!-- 箭頭定義 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#88C0D0"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#616E85"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A3BE8C"/>
    </marker>
  </defs>

  <!-- 頂部標題列 -->
  <rect x="0" y="0" width="940" height="52" fill="#242933" rx="12"/>
  <circle cx="28" cy="26" r="6" fill="#BF616A"/>
  <circle cx="48" cy="26" r="6" fill="#EBCB8B"/>
  <circle cx="68" cy="26" r="6" fill="#A3BE8C"/>
  <text x="470" y="32" fill="#D8DEE9" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">PocketMoney 新手初次使用三階段引導漏斗架構 (Onboarding Funnel)</text>

  <!-- 節點 1: 起點 -->
  <rect x="330" y="75" width="280" height="42" rx="21" fill="url(#primaryGrad)" stroke="#88C0D0" stroke-width="1.5"/>
  <text x="470" y="101" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">🚀 使用者首次造訪 PocketMoney</text>

  <!-- 連線 1 ➔ 判斷節點 -->
  <line x1="470" y1="117" x2="470" y2="148" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 判斷節點: 檢查狀態 -->
  <polygon points="470,150 630,185 470,220 310,185" fill="#3B4252" stroke="#88C0D0" stroke-width="1.5"/>
  <text x="470" y="180" fill="#ECEFF4" font-size="12" font-weight="bold" text-anchor="middle">檢查 localStorage 狀態</text>
  <text x="470" y="196" fill="#88C0D0" font-size="11" text-anchor="middle">onboardingCompleted !== true ?</text>

  <!-- 分支 1: 否 (老手) -->
  <line x1="630" y1="185" x2="770" y2="185" stroke="#616E85" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowDim)"/>
  <rect x="770" y="162" width="130" height="46" rx="8" fill="#2E3440" stroke="#4C566A" stroke-width="1"/>
  <text x="835" y="183" fill="#D8DEE9" font-size="11" text-anchor="middle">已完成 / 老手</text>
  <text x="835" y="199" fill="#81A1C1" font-size="11" font-weight="bold" text-anchor="middle">直接進入主儀表板</text>

  <!-- 分支 2: 是 (首次進入) -->
  <line x1="470" y1="220" x2="470" y2="258" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="244" fill="#A3BE8C" font-size="11" font-weight="bold">首次進入</text>

  <!-- 階段一：歡迎彈窗 Welcome Modal -->
  <g transform="translate(170, 260)">
    <rect x="0" y="0" width="600" height="115" rx="10" fill="url(#modalGrad)" stroke="#81A1C1" stroke-width="1.5"/>
    <rect x="0" y="0" width="600" height="28" rx="10" fill="#434C5E"/>
    <text x="18" y="19" fill="#ECEFF4" font-size="12" font-weight="bold">【第 1 階段】首次造訪歡迎彈窗 (Welcome Modal)</text>
    <text x="580" y="19" fill="#88C0D0" font-size="11" text-anchor="end">心智模型震撼定調</text>
    
    <text x="300" y="52" fill="#EBCB8B" font-size="13" font-weight="bold" text-anchor="middle">💡「不記瑣碎流水帳，算清手頭還能安心花多少錢」</text>
    <text x="300" y="70" fill="#D8DEE9" font-size="11" text-anchor="middle">每月只需花 3 分鐘更新「銀行存款」與「信用卡帳單總額」，算清可用餘額</text>

    <!-- 三大按鈕分流 -->
    <rect x="30" y="80" width="165" height="26" rx="6" fill="#5E81AC"/>
    <text x="112" y="97" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">✨ 帶我導覽 (3分鐘)</text>

    <rect x="215" y="80" width="170" height="26" rx="6" fill="#4C566A"/>
    <text x="300" y="97" fill="#ECEFF4" font-size="11" text-anchor="middle">🚀 載入示範資料體驗</text>

    <rect x="405" y="80" width="165" height="26" rx="6" fill="#3B4252" stroke="#4C566A"/>
    <text x="487" y="97" fill="#D8DEE9" font-size="11" text-anchor="middle">我懂了，直接開始 ➔</text>
  </g>

  <!-- 分流連線 -->
  <!-- 按鈕 1 ➔ 階段二 Spotlight -->
  <path d="M 282 375 L 282 410" fill="none" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 按鈕 2 & 3 繞行直接進入階段三 -->
  <path d="M 470 375 L 470 395 L 720 395 L 720 520" fill="none" stroke="#616E85" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowDim)"/>
  <path d="M 657 375 L 657 395" fill="none" stroke="#616E85" stroke-width="1.5"/>

  <!-- 階段二：原生 Spotlight 導覽 -->
  <g transform="translate(60, 412)">
    <rect x="0" y="0" width="445" height="118" rx="10" fill="url(#spotlightGrad)" stroke="#88C0D0" stroke-width="1.5"/>
    <rect x="0" y="0" width="445" height="26" rx="10" fill="#434C5E"/>
    <text x="14" y="18" fill="#ECEFF4" font-size="12" font-weight="bold">【第 2 階段】原生 0 依賴 Spotlight 導覽 (SVG Cutout 聚光燈)</text>
    
    <!-- 焦點 1 -->
    <rect x="14" y="34" width="417" height="23" rx="5" fill="#2E3440"/>
    <text x="24" y="50" fill="#88C0D0" font-size="11" font-weight="bold">焦點 1：頂部「財務總覽」KPI</text>
    <text x="420" y="50" fill="#D8DEE9" font-size="10" text-anchor="end">手頭還能花多少，告別流水帳</text>

    <!-- 焦點 2 -->
    <rect x="14" y="61" width="417" height="23" rx="5" fill="#2E3440"/>
    <text x="24" y="77" fill="#A3BE8C" font-size="11" font-weight="bold">焦點 2：戶頭裡的錢，夠不夠扣款？</text>
    <text x="420" y="77" fill="#D8DEE9" font-size="10" text-anchor="end">自動對齊帳單，不怕透支扣款失敗</text>

    <!-- 焦點 3 -->
    <rect x="14" y="88" width="417" height="23" rx="5" fill="#2E3440"/>
    <text x="24" y="104" fill="#EBCB8B" font-size="11" font-weight="bold">焦點 3：買東西分期很無痛？</text>
    <text x="420" y="104" fill="#D8DEE9" font-size="10" text-anchor="end">算算每個月默默被扣了多少錢</text>
  </g>

  <!-- 階段二 ➔ 階段三連線 -->
  <path d="M 282 530 L 282 555 L 430 555" fill="none" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 階段三：首頁頂部收合式微型檢查清單 Setup Checklist -->
  <g transform="translate(170, 545)">
    <rect x="0" y="0" width="600" height="115" rx="10" fill="url(#checklistGrad)" stroke="#A3BE8C" stroke-width="1.5"/>
    <rect x="0" y="0" width="600" height="28" rx="10" fill="#3B4252"/>
    <text x="18" y="19" fill="#A3BE8C" font-size="12" font-weight="bold">【第 3 階段】首頁頂部收合式微型檢查清單 (Setup Checklist)</text>
    <text x="580" y="19" fill="#D8DEE9" font-size="11" text-anchor="end">系統狀態自動感應打勾</text>

    <!-- 4 大任務 -->
    <text x="25" y="48" fill="#ECEFF4" font-size="11">☑️ 1. 設定至少 1 個主力銀行帳戶與餘額</text>
    <text x="310" y="48" fill="#ECEFF4" font-size="11">☑️ 2. 登記 1 張本期信用卡金額與扣款帳戶</text>
    <text x="25" y="68" fill="#ECEFF4" font-size="11">☑️ 3. 檢查「戶頭扣款安全」亮綠燈</text>
    <text x="310" y="68" fill="#81A1C1" font-size="11">☑️ 4.（選填）設定 PIN 碼保護本機離線隱私</text>

    <!-- 達成條 -->
    <rect x="18" y="81" width="564" height="24" rx="5" fill="#2E3440" stroke="#4C566A"/>
    <text x="300" y="97" fill="#A3BE8C" font-size="11" font-weight="bold" text-anchor="middle">🎉 4 項全部達成 ➔ 觸發微型慶祝彩帶動效 ➔ 3 秒後清單平滑向上收縮淡出！</text>
  </g>
</svg>
