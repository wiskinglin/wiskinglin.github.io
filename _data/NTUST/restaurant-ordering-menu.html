<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏數字輸入框預設的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        @media print {
            body {
                padding-bottom: 0 !important;
                background-color: white !important;
            }

            header,
            main,
            footer {
                display: none !important;
            }

            #print-area {
                display: block !important;
            }
        }
    </style>
</head>

<body class="bg-gray-100 font-sans pb-40">

    <!-- 頂部導覽列 -->

        <h1 class="text-xl md:text-2xl font-bold text-center tracking-wider">曉鹿鳴樓 點菜系統</h1>
    </header>

    <!-- 菜單列表容器 -->

        <!-- 菜單內容由 JavaScript 動態生成 -->
    </main>

    <!-- 底部結帳資訊列 -->

        class="fixed bottom-0 left-0 w-full bg-white border-t-2 border-red-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 z-30">
        <div class="max-w-4xl mx-auto flex flex-col items-end">
            <div class="text-gray-600 text-sm md:text-base mb-1">
                小計： NT$ <span id="subtotal" class="font-mono">0</span>
            </div>
            <div class="text-gray-600 text-sm md:text-base mb-1">
                服務費 (10%)： NT$ <span id="service-fee" class="font-mono">0</span>
            </div>
            <div class="text-xl md:text-2xl font-bold text-red-700 mb-1">
                總計金額： NT$ <span id="total" class="font-mono">0</span>
            </div>
            <div class="text-xs text-gray-500">
                * 時價品項（如大沙公、海鮮泡飯鍋）不計入自動結算，需另行確認。
            </div>
            <div class="mt-4 w-full flex justify-end">
                <button onclick="printOrder()"
                    class="bg-red-800 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-red-900 transition-colors focus:outline-none focus:ring-2 focus:ring-red-700 focus:ring-offset-2">列印點菜單</button>
            </div>
        </div>
    </footer>

    <!-- 列印專用區域 -->
    <div id="print-area" class="hidden p-4 bg-white text-black font-sans"></div>

                    { name: "普娜天然礦泉水", price: 180 },
                    { name: "海尼根啤酒 (瓶)", price: 130 },
                    { name: "金牌台灣啤酒 (瓶)", price: 120 },
                    { name: "經典台灣啤酒 (瓶)", price: 100 },
                    { name: "可口可樂 (瓶)", price: 80 },
                    { name: "噶瑪蘭經典 威士忌", price: 2400 },
                    { name: "噶瑪蘭山川首席波特風味桶 威士忌", price: 1800 },
                    { name: "噶瑪蘭珍選No.1 威士忌", price: 1500 }
                ]
            }
        ];

        const container = document.getElementById('menu-container');

        // 生成菜單 DOM
        menuData.forEach((section) => {
            // 分類外框
            const catDiv = document.createElement('div');
            catDiv.className = 'mb-6 bg-white rounded-lg shadow-sm overflow-hidden border border-gray-200';

            // 分類標題
            const catHeader = document.createElement('div');
            catHeader.className = 'bg-red-800 text-white px-4 py-3 font-bold text-lg md:text-xl';
            catHeader.textContent = section.category;
            catDiv.appendChild(catHeader);

            // 菜色列表容器
            const itemsList = document.createElement('div');
            itemsList.className = 'divide-y divide-gray-100';

            section.items.forEach((item) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex justify-between items-center p-4 hover:bg-gray-50 transition-colors';

                const priceText = item.price === 0 ? item.note : `NT$ ${item.price}`;

                itemDiv.innerHTML = `
                    <div class="flex-1 pr-4">
                        <div class="font-bold text-gray-800 text-base md:text-lg mb-1">${item.name}</div>
                        <div class="text-sm text-gray-500">${priceText}</div>
                    </div>
                    <div class="flex items-center space-x-2 md:space-x-4">
                        <button class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-gray-200 text-gray-700 font-bold hover:bg-gray-300 active:bg-gray-400 flex items-center justify-center transition-colors text-xl select-none" onclick="updateQuantity(this, -1)">-</button>
                        
                        <input type="number" min="0" value="0" class="qty-input w-12 md:w-16 h-8 md:h-10 text-center border border-gray-300 rounded font-bold text-gray-800 bg-white" data-price="${item.price}" data-name="${item.name}" onchange="validateAndUpdate()" onkeyup="validateAndUpdate()">
                        
                        <button class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-red-700 text-white font-bold hover:bg-red-800 active:bg-red-900 flex items-center justify-center transition-colors text-xl select-none" onclick="updateQuantity(this, 1)">+</button>
                    </div>
                `;
                itemsList.appendChild(itemDiv);
            });

            catDiv.appendChild(itemsList);
            container.appendChild(catDiv);
        });

        // 點擊加減按鈕更新數量
        function updateQuantity(btn, change) {
            const input = btn.parentElement.querySelector('.qty-input');
            let currentValue = parseInt(input.value) || 0;
            let newValue = currentValue + change;

            if (newValue < 0) {
                newValue = 0;
            }

            input.value = newValue;
            calculateTotal();
        }

        // 檢查手動輸入並更新
        function validateAndUpdate() {
            const inputs = document.querySelectorAll('.qty-input');
            inputs.forEach(input => {
                if (parseInt(input.value) < 0 || isNaN(parseInt(input.value))) {
                    input.value = 0;
                }
            });
            calculateTotal();
        }

        // 計算總金額
        function calculateTotal() {
            let subtotal = 0;
            const inputs = document.querySelectorAll('.qty-input');

            inputs.forEach(input => {
                const qty = parseInt(input.value) || 0;
                const price = parseInt(input.getAttribute('data-price')) || 0;

                if (qty > 0 && price > 0) {
                    subtotal += qty * price;
                }
            });

            const serviceFee = Math.round(subtotal * 0.1);
            const total = subtotal + serviceFee;

            // 更新畫面金額
            document.getElementById('subtotal').innerText = subtotal.toLocaleString();
            document.getElementById('service-fee').innerText = serviceFee.toLocaleString();
            document.getElementById('total').innerText = total.toLocaleString();
        }

        // 列印點菜單功能
        function printOrder() {
            const inputs = document.querySelectorAll('.qty-input');
            let hasItems = false;
            let subtotal = 0;

            let printHtml = `
                <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px;">
                    <h2 style="font-size: 24px; font-weight: bold; margin: 0;">曉鹿鳴樓 點菜單</h2>
                    <p style="font-size: 12px; color: #666; margin-top: 5px;">列印時間：${new Date().toLocaleString('zh-TW')}</p>
                </div>
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                    <thead>
                        <tr style="border-bottom: 1px solid #000;">
                            <th style="padding: 8px 4px; width: 60px;">編號</th>
                            <th style="padding: 8px 4px;">品項</th>
                            <th style="padding: 8px 4px; text-align: right;">單價</th>
                            <th style="padding: 8px 4px; text-align: right;">數量</th>
                            <th style="padding: 8px 4px; text-align: right;">小計</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let itemIndex = 0;
            inputs.forEach(input => {
                const qty = parseInt(input.value) || 0;
                if (qty > 0) {
                    hasItems = true;
                    itemIndex++;
                    const name = input.getAttribute('data-name');
                    const price = parseInt(input.getAttribute('data-price')) || 0;
                    const itemSub = qty * price;
                    subtotal += itemSub;

                    const priceText = price === 0 ? '時價' : price.toLocaleString();
                    const itemSubText = price === 0 ? '時價' : itemSub.toLocaleString();

                    printHtml += `
                        <tr style="border-bottom: 1px dashed #ccc;">
                            <td style="padding: 8px 4px;">${itemIndex}</td>
                            <td style="padding: 8px 4px;">${name}</td>
                            <td style="padding: 8px 4px; text-align: right;">${priceText}</td>
                            <td style="padding: 8px 4px; text-align: right;">${qty}</td>
                            <td style="padding: 8px 4px; text-align: right;">${itemSubText}</td>
                        </tr>
                    `;
                }
            });

            if (!hasItems) {
                // 若沒有選擇任何餐點，不執行列印
                return;
            }

            const serviceFee = Math.round(subtotal * 0.1);
            const total = subtotal + serviceFee;

            printHtml += `
                    </tbody>
                </table>
                <div style="margin-top: 20px; border-top: 2px solid #000; padding-top: 10px; text-align: right; font-size: 16px;">
                    <div style="margin-bottom: 4px;">小計： NT$ ${subtotal.toLocaleString()}</div>
                    <div style="margin-bottom: 4px;">服務費 (10%)： NT$ ${serviceFee.toLocaleString()}</div>
                    <div style="font-size: 20px; font-weight: bold; margin-top: 8px; color: #b91c1c;">總計金額： NT$ ${total.toLocaleString()}</div>
                </div>
                <div style="margin-top: 20px; font-size: 12px; color: #666; text-align: center;">
                    * 時價品項不計入自動結算，需另行確認。
                </div>
            `;

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = printHtml;

            // 觸發瀏覽器列印
            window.print();
        }
    </script>
</body>

</html>
