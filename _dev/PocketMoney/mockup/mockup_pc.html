<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PocketMoney - 個人家庭理財管理</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC & JetBrains Mono -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <!-- 本機與離線資料庫支援 -->
  <script src="./database/dummy_db_embedded.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            nord: {
              0: '#2E3440',
              1: '#3B4252',
              2: '#434C5E',
              3: '#4C566A',
              4: '#D8DEE9',
              5: '#E5E9F0',
              6: '#ECEFF4',
              7: '#8FBCBB',
              8: '#88C0D0',
              9: '#81A1C1',
              10: '#5E81AC',
              11: '#BF616A',
              12: '#D08770',
              13: '#EBCB8B',
              14: '#A3BE8C',
              15: '#B48EAD'
            }
          }
        }
      }
    };
  </script>

  <style>
    /* 移除原生 Number Stepper 箭頭 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    body {
      background-color: #242933;
      color: #ECEFF4;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 自訂平滑滾動列 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #2E3440;
    }
    ::-webkit-scrollbar-thumb {
      background: #434C5E;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4C566A;
    }

    /* 隱私遮罩 */
    .privacy-masked .masked-amount {
      filter: blur(5px);
      user-select: none;
    }

    /* 3D 卡片視角與 Cover Flow 效果 */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .cover-flow-card {
      transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, opacity;
    }

    /* 模式轉場動畫 */
    .mode-fade {
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 脈衝微光按鈕動效 */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(136, 192, 208, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(136, 192, 208, 0); }
    }
    .pulse-glow {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
  </style>
</head>

<body class="bg-[#242933] text-nord-6 min-h-screen flex flex-col antialiased selection:bg-nord-8 selection:text-nord-0">

  <!-- ==================== 頂部全域導覽 (Header) ==================== -->
  <header class="sticky top-0 z-50 bg-[#2E3440]/95 backdrop-blur-md border-b border-nord-2 px-4 lg:px-8 py-3 transition-colors">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand Logo 與當前模式 Badge -->
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-nord-10 to-nord-8 flex items-center justify-center shadow-lg shadow-nord-10/20 text-nord-0 font-bold">
          <i class="fa-solid fa-wallet text-base"></i>
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-lg font-bold tracking-tight text-nord-6">PocketMoney</span>
          <!-- 模式徽章：瀏覽 / 輸入中 -->
          <span id="header-mode-badge" class="px-2 py-0.5 rounded text-xs font-semibold bg-nord-2 text-nord-4 border border-nord-3/40 transition-all">
            瀏覽
          </span>
        </div>
      </div>

      <!-- 四大模組導覽按鈕 (信用卡費、銀行餘額、固定費用、分期付款) -->
      <nav class="flex items-center bg-nord-1 p-1 rounded-xl border border-nord-2/60 shadow-inner">
        <button id="nav-tab-cards" onclick="switchMainTab('cards')"
          class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-6 bg-nord-2 shadow-sm flex items-center space-x-2">
          <i class="fa-regular fa-credit-card text-nord-8 text-xs"></i>
          <span>信用卡費</span>
        </button>
        <button id="nav-tab-banks" onclick="switchMainTab('banks')"
          class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2">
          <i class="fa-solid fa-building-columns text-nord-9 text-xs"></i>
          <span>銀行餘額</span>
        </button>
        <button id="nav-tab-bills" onclick="switchMainTab('bills')"
          class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2">
          <i class="fa-solid fa-calendar-check text-nord-7 text-xs"></i>
          <span>固定費用</span>
        </button>
        <button id="nav-tab-installments" onclick="switchMainTab('installments')"
          class="nav-tab px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2">
          <i class="fa-solid fa-layer-group text-nord-15 text-xs"></i>
          <span>分期付款</span>
        </button>
      </nav>

      <!-- 右側：Persona 切換 + 隱私遮罩 + 核心「+ 輸入 / ✕ 瀏覽」切換鈕 -->
      <div class="flex items-center space-x-2.5">
        
        <!-- Persona 切換 -->
        <div class="flex items-center bg-nord-1 p-0.5 rounded-lg border border-nord-2 text-xs">
          <button id="prof-junior" onclick="switchProfile('junior')" class="px-2.5 py-1 rounded-md font-medium transition-colors text-nord-4 hover:text-nord-6">初級大人</button>
          <button id="prof-family" onclick="switchProfile('family')" class="px-2.5 py-1 rounded-md font-bold transition-colors bg-nord-8 text-nord-0">少子化勇者</button>
          <button id="prof-senior" onclick="switchProfile('senior')" class="px-2.5 py-1 rounded-md font-medium transition-colors text-nord-4 hover:text-nord-6">高級大人</button>
        </div>

        <!-- 隱私遮罩開關 -->
        <button onclick="togglePrivacyMode()" title="切換金額隱私遮罩"
          class="w-9 h-9 rounded-lg bg-nord-1 border border-nord-2 text-nord-4 hover:text-nord-6 hover:bg-nord-2/60 flex items-center justify-center transition-colors">
          <i id="privacy-icon" class="fa-regular fa-eye text-sm"></i>
        </button>

        <!-- 核心功能按鈕：在瀏覽模式為「+ 輸入」，在輸入模式為「✕ 瀏覽」 -->
        <button id="btn-mode-toggle" onclick="toggleViewInputMode()"
          class="h-9 px-3.5 rounded-lg bg-nord-8 hover:bg-nord-7 text-nord-0 font-bold text-xs flex items-center space-x-1.5 shadow-md shadow-nord-8/20 transition-all pulse-glow">
          <i id="mode-toggle-icon" class="fa-solid fa-plus text-xs"></i>
          <span id="mode-toggle-text">輸入</span>
        </button>

      </div>

    </div>
  </header>

  <!-- ==================== 主視圖容器 (Main Container) ==================== -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col space-y-6">

    <!-- ========================================================================= -->
    <!-- [模式一]：瀏覽模式 (View Mode) - 參照 mockup_view.html                  -->
    <!-- ========================================================================= -->
    <div id="view-mode-container" class="space-y-6 mode-fade">

      <!-- 1. 頂部三大 KPI 金額摘要卡 -->
      <div id="kpi-cards-row" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <!-- 由 JS 根據當前分頁動態渲染 -->
      </div>

      <!-- 2. 中間 12 個月趨勢折線圖區塊 -->
      <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-5 sm:p-6 shadow-xl">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          
          <!-- 左上方：12 個月時間軸模式切換 (近 12 個月 / 當年度) + 圖表標題 -->
          <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center bg-nord-0 p-1 rounded-xl border border-nord-2">
              <button id="btn-mode-rolling12" onclick="switchChartRangeMode('rolling12')"
                class="px-3 py-1 rounded-lg text-xs font-bold transition-all bg-nord-8 text-nord-0 shadow-sm">
                近 12 個月
              </button>
              <button id="btn-mode-ytd" onclick="switchChartRangeMode('ytd')"
                class="px-3 py-1 rounded-lg text-xs font-medium transition-all text-nord-4 hover:text-nord-6">
                當年度
              </button>
            </div>

            <div class="flex items-center space-x-2">
              <span id="chart-dot" class="w-2.5 h-2.5 rounded-full bg-nord-8"></span>
              <h2 id="chart-title" class="text-base font-bold text-nord-6">信用卡費走勢</h2>
              <span id="chart-subtitle" class="text-xs text-nord-4 font-mono">2025/11 ~ 2026/10</span>
            </div>
          </div>

          <!-- 右上方：篩選單一銀行/卡片的膠囊按鈕列 -->
          <div id="chart-filter-pills" class="flex flex-wrap items-center gap-1.5">
            <!-- 動態注入「全部」與個別帳戶/卡片切換按鈕 -->
          </div>
        </div>

        <!-- 圖表 Canvas 容器 -->
        <div class="relative w-full h-[300px] sm:h-[340px]">
          <canvas id="main-line-chart"></canvas>
        </div>
      </div>

      <!-- 3. 下方明細清單標題列 (含快速輸入捷徑按鈕) -->
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-list-check text-nord-8 text-sm"></i>
          <span id="detail-section-title" class="text-sm font-bold text-nord-4">當期項目明細</span>
        </div>
        <button onclick="toggleViewInputMode()" class="px-3 py-1 rounded-lg bg-nord-1 hover:bg-nord-2 border border-nord-2 text-xs font-semibold text-nord-8 hover:text-nord-7 flex items-center space-x-1.5 transition-colors">
          <i class="fa-solid fa-pen-to-square text-xs"></i>
          <span>登錄 / 調整本期資料</span>
        </button>
      </div>

      <!-- 4. 各項目金額與事件/明細卡片清單 -->
      <div id="detail-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- 由 JS 根據當前分頁動態渲染 -->
      </div>

    </div>


    <!-- ========================================================================= -->
    <!-- [模式二]：輸入模式 (Input Mode) - 參照 mockup_input.html                 -->
    <!-- ========================================================================= -->
    <div id="input-mode-container" class="hidden space-y-6 mode-fade">

      <!-- 輸入模式頂部導引橫條 (Banner：提示當前登錄項目與快速返回快捷按鈕) -->
      <div class="flex items-center justify-between p-4 rounded-2xl bg-nord-10/20 border border-nord-10/40 shadow-lg text-sm">
        <div class="flex items-center space-x-3 text-nord-8">
          <div class="w-10 h-10 rounded-xl bg-nord-10/30 flex items-center justify-center text-nord-8 border border-nord-8/30">
            <i id="input-banner-icon" class="fa-solid fa-pen-to-square text-lg"></i>
          </div>
          <div>
            <span class="font-bold block text-nord-6" id="input-banner-title">登錄本期信用卡帳單</span>
            <span class="text-xs text-nord-4 block" id="input-banner-subtitle">依序輪播輸入金額或填寫大額明細，完成後自動更新並返回</span>
          </div>
        </div>

        <button onclick="toggleViewInputMode()" class="px-3.5 py-1.5 rounded-xl bg-nord-1 border border-nord-2 text-xs text-nord-4 hover:text-nord-6 hover:bg-nord-2 flex items-center space-x-1.5 transition-all">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          <span>返回瀏覽視圖</span>
        </button>
      </div>

      <!-- 各 Tab 對應的輸入面板容器 -->
      <div id="input-panels-wrapper">
        <!-- 由 JS 依據 currentMainTab 動態渲染 (cards / banks / bills / installments) -->
      </div>

    </div>

  </main>

  <!-- ==================== 全域 Toast 浮動反饋訊息 ==================== -->
  <div id="pc-toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl bg-nord-0/95 border border-nord-14/60 text-nord-14 text-sm font-semibold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-2.5">
    <i class="fa-solid fa-circle-check text-base"></i>
    <span id="pc-toast-text">已更新</span>
  </div>

  <!-- ==================== 核心邏輯與資料驅動 ==================== -->
  <script>
    /* -------------------------------------------------------------------------
       全域狀態 (Global State)
       ------------------------------------------------------------------------- */
    let currentMode = 'view'; // 'view' (瀏覽模式) | 'input' (輸入模式)
    let currentProfileKey = 'family'; // 'junior' | 'family' | 'senior'
    let currentMainTab = 'cards'; // 'cards' | 'banks' | 'bills' | 'installments'
    let chartRangeMode = 'rolling12'; // 'rolling12' | 'ytd'
    let selectedEntityId = 'all';
    let isPrivacyMasked = false;
    let lineChartInstance = null;
    let dbCache = {};

    // 信用卡輸入專屬狀態
    let cardCoverIndex = 0;
    let cardInputStage = 1; // 1: 帳單總額, 2: 逐張翻面確認大額, 3: 完成結算
    let cardStage2Order = [];

    // 銀行輸入專屬狀態
    let bankCoverIndex = 0;
    let bankInputStage = 1; // 1: 盤點餘額(自動滾算推估), 2: 收支事件歸戶, 3: 完成結算
    let currentBankEventType = 'withdrawal'; // 預設提款

    // 系統當前基準年月 (2026年 10月)
    const CURRENT_YEAR = 2026;
    const CURRENT_MONTH = 10;

    // 連續 12 個月座標 (2025/11 ~ 2026/10，全數已發生)
    const ROLLING_12_SLOTS = [
      { year: 2025, month: 11, label: '25/11', isFuture: false },
      { year: 2025, month: 12, label: '25/12', isFuture: false },
      { year: 2026, month: 1,  label: '26/01', isFuture: false },
      { year: 2026, month: 2,  label: '26/02', isFuture: false },
      { year: 2026, month: 3,  label: '26/03', isFuture: false },
      { year: 2026, month: 4,  label: '26/04', isFuture: false },
      { year: 2026, month: 5,  label: '26/05', isFuture: false },
      { year: 2026, month: 6,  label: '26/06', isFuture: false },
      { year: 2026, month: 7,  label: '26/07', isFuture: false },
      { year: 2026, month: 8,  label: '26/08', isFuture: false },
      { year: 2026, month: 9,  label: '26/09', isFuture: false },
      { year: 2026, month: 10, label: '26/10', isFuture: false }
    ];

    // 當年度 12 個月座標 (2026/01 ~ 2026/12，11月、12月為未發生月份)
    const YTD_12_SLOTS = [
      { year: 2026, month: 1,  label: '1月',  isFuture: false },
      { year: 2026, month: 2,  label: '2月',  isFuture: false },
      { year: 2026, month: 3,  label: '3月',  isFuture: false },
      { year: 2026, month: 4,  label: '4月',  isFuture: false },
      { year: 2026, month: 5,  label: '5月',  isFuture: false },
      { year: 2026, month: 6,  label: '6月',  isFuture: false },
      { year: 2026, month: 7,  label: '7月',  isFuture: false },
      { year: 2026, month: 8,  label: '8月',  isFuture: false },
      { year: 2026, month: 9,  label: '9月',  isFuture: false },
      { year: 2026, month: 10, label: '10月', isFuture: false },
      { year: 2026, month: 11, label: '11月 (推估)', isFuture: true },
      { year: 2026, month: 12, label: '12月 (推估)', isFuture: true }
    ];

    function getActiveSlots() {
      return chartRangeMode === 'rolling12' ? ROLLING_12_SLOTS : YTD_12_SLOTS;
    }

    function formatCurrency(num) {
      if (num === null || num === undefined) return '0';
      return new Intl.NumberFormat('zh-TW').format(Math.round(num));
    }

    function showToast(msg) {
      const toast = document.getElementById('pc-toast');
      const text = document.getElementById('pc-toast-text');
      text.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2600);
    }

    function togglePrivacyMode() {
      isPrivacyMasked = !isPrivacyMasked;
      document.body.classList.toggle('privacy-masked', isPrivacyMasked);
      const icon = document.getElementById('privacy-icon');
      icon.className = isPrivacyMasked
        ? 'fa-regular fa-eye-slash text-sm text-nord-8'
        : 'fa-regular fa-eye text-sm text-nord-4';
    }

    /* -------------------------------------------------------------------------
       模式切換核心：瀏覽 (View) 與 輸入 (Input) 雙向切換
       ------------------------------------------------------------------------- */
    function toggleViewInputMode() {
      currentMode = (currentMode === 'view') ? 'input' : 'view';
      syncModeUI();
    }

    function syncModeUI() {
      const viewContainer = document.getElementById('view-mode-container');
      const inputContainer = document.getElementById('input-mode-container');
      const badge = document.getElementById('header-mode-badge');
      const btn = document.getElementById('btn-mode-toggle');
      const icon = document.getElementById('mode-toggle-icon');
      const text = document.getElementById('mode-toggle-text');

      if (currentMode === 'view') {
        viewContainer.classList.remove('hidden');
        inputContainer.classList.add('hidden');
        badge.textContent = '瀏覽';
        badge.className = 'px-2 py-0.5 rounded text-xs font-semibold bg-nord-2 text-nord-4 border border-nord-3/40';

        btn.className = 'h-9 px-3.5 rounded-lg bg-nord-8 hover:bg-nord-7 text-nord-0 font-bold text-xs flex items-center space-x-1.5 shadow-md shadow-nord-8/20 transition-all pulse-glow';
        icon.className = 'fa-solid fa-plus text-xs';
        text.textContent = '輸入';

        renderViewMode();
      } else {
        viewContainer.classList.add('hidden');
        inputContainer.classList.remove('hidden');
        badge.textContent = '輸入中';
        badge.className = 'px-2 py-0.5 rounded text-xs font-semibold bg-nord-14/20 text-nord-14 border border-nord-14/40';

        btn.className = 'h-9 px-3.5 rounded-lg bg-nord-1 hover:bg-nord-2 border border-nord-2 text-nord-4 hover:text-nord-6 font-bold text-xs flex items-center space-x-1.5 transition-all';
        icon.className = 'fa-solid fa-xmark text-xs';
        text.textContent = '瀏覽';

        renderInputMode();
      }
    }

    /* -------------------------------------------------------------------------
       主導覽 Tab 切換
       ------------------------------------------------------------------------- */
    async function switchMainTab(tab) {
      currentMainTab = tab;
      selectedEntityId = 'all';

      const tabs = ['cards', 'banks', 'bills', 'installments'];
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-tab-${t}`);
        if (t === tab) {
          btn.className = 'nav-tab px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-6 bg-nord-2 shadow-sm flex items-center space-x-2';
        } else {
          btn.className = 'nav-tab px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2';
        }
      });

      if (currentMode === 'view') {
        await renderViewMode();
      } else {
        await renderInputMode();
      }
    }

    async function switchProfile(profileKey) {
      currentProfileKey = profileKey;
      selectedEntityId = 'all';
      cardCoverIndex = 0;

      ['junior', 'family', 'senior'].forEach(k => {
        const btn = document.getElementById(`prof-${k}`);
        if (k === profileKey) {
          btn.className = 'px-2.5 py-1 rounded-md font-bold transition-colors bg-nord-8 text-nord-0';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md font-medium transition-colors text-nord-4 hover:text-nord-6';
        }
      });

      if (currentMode === 'view') {
        await renderViewMode();
      } else {
        await renderInputMode();
      }
    }

    function switchChartRangeMode(mode) {
      chartRangeMode = mode;
      const btnRolling = document.getElementById('btn-mode-rolling12');
      const btnYtd = document.getElementById('btn-mode-ytd');

      if (mode === 'rolling12') {
        btnRolling.className = 'px-3 py-1 rounded-lg text-xs font-bold transition-all bg-nord-8 text-nord-0 shadow-sm';
        btnYtd.className = 'px-3 py-1 rounded-lg text-xs font-medium transition-all text-nord-4 hover:text-nord-6';
      } else {
        btnYtd.className = 'px-3 py-1 rounded-lg text-xs font-bold transition-all bg-nord-8 text-nord-0 shadow-sm';
        btnRolling.className = 'px-3 py-1 rounded-lg text-xs font-medium transition-all text-nord-4 hover:text-nord-6';
      }

      renderViewMode();
    }

    function selectEntityFilter(id) {
      selectedEntityId = id;
      renderViewMode();
    }

    /* -------------------------------------------------------------------------
       資料庫載入與快取同步
       ------------------------------------------------------------------------- */
    async function loadProfileData(profileKey) {
      if (dbCache[profileKey]) return dbCache[profileKey];
      
      // 優先使用嵌入式離線資料庫以防止 CORS 限制
      if (window.EMBEDDED_DUMMY_DB && window.EMBEDDED_DUMMY_DB[profileKey]) {
        dbCache[profileKey] = JSON.parse(JSON.stringify(window.EMBEDDED_DUMMY_DB[profileKey]));
        return dbCache[profileKey];
      }

      try {
        const res = await fetch(`./database/dummy_db_${profileKey}.json`);
        if (res.ok) {
          const data = await res.json();
          dbCache[profileKey] = data;
          return data;
        }
      } catch (e) {
        // Fallback
      }

      return null;
    }

    function getCardAvgAmount(card) {
      const active = (card.records || []).filter(r => r.amount !== null && r.amount !== undefined);
      if (active.length === 0) return 0;
      return Math.round(active.reduce((s, r) => s + r.amount, 0) / active.length);
    }

    function getFutureBankProjectedBalance(db, bank, targetMonth) {
      const octSnap = (db.bankSnapshots || []).find(s => s.year === 2026 && s.month === 10 && s.bankId === bank.id);
      let bal = octSnap ? octSnap.balance : (bank.balance || 0);
      for (let m = 11; m <= targetMonth; m++) {
        const salary = bank.defaultSalary || 0;
        const directBills = (db.recurringBills || [])
          .filter(b => b.paymentMethod === 'bank_direct' && b.targetId === bank.id && (b.activeMonths || [m]).includes(m))
          .reduce((sum, b) => sum + (b.defaultAmount || b.amount || 0), 0);
        const boundCardsAvg = (db.cards || [])
          .filter(c => c.bankId === bank.id)
          .reduce((sum, c) => sum + getCardAvgAmount(c), 0);
        bal = bal + salary - directBills - boundCardsAvg;
      }
      return bal;
    }

    /* =========================================================================
       [模式一] 瀏覽模式渲染控制器 (View Mode)
       ========================================================================= */
    async function renderViewMode() {
      const db = await loadProfileData(currentProfileKey);
      if (!db) return;

      if (currentMainTab === 'cards') {
        renderCardsView(db);
      } else if (currentMainTab === 'banks') {
        renderBanksView(db);
      } else if (currentMainTab === 'bills') {
        renderBillsView(db);
      } else if (currentMainTab === 'installments') {
        renderInstallmentsView(db);
      }
    }

    /* 4. 分期付款 - 瀏覽視圖 */
    function renderInstallmentsView(db) {
      const slots = getActiveSlots();
      const labels = slots.map(s => s.label);
      document.getElementById('detail-section-title').textContent = '進行中分期消費明細';

      const rawInst = db.installments || [];
      const installments = rawInst.map(i => {
        const totalPeriods = i.totalPeriods || i.totalTerms || 12;
        let curTerm = i.currentTerm;
        if (curTerm === undefined && i.startYear && i.startMonth) {
          curTerm = Math.max(1, Math.min(totalPeriods, (CURRENT_YEAR - i.startYear) * 12 + (CURRENT_MONTH - i.startMonth) + 1));
        } else if (curTerm === undefined) {
          curTerm = 1;
        }
        return {
          id: i.id,
          name: i.title || i.name || '分期消費',
          monthlyAmount: i.regularPeriodAmount || i.monthlyAmount || Math.round((i.totalAmount || 36000) / totalPeriods),
          totalTerms: totalPeriods,
          currentTerm: curTerm,
          totalAmount: i.totalAmount || (totalPeriods * (i.regularPeriodAmount || 3000))
        };
      });

      const monthlyBurden = installments.reduce((s, i) => s + (i.monthlyAmount || 0), 0);
      const remainingTotal = installments.reduce((s, i) => s + (i.monthlyAmount * Math.max(0, (i.totalTerms - i.currentTerm))), 0);

      document.getElementById('kpi-cards-row').innerHTML = `
        <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-4 flex items-center justify-between shadow-md">

          </div>

            <i class="fa-solid fa-hourglass-half"></i>

            <i class="fa-solid fa-list-check"></i>
          </div>

      `;

      document.getElementById('chart-dot').className = 'w-2.5 h-2.5 rounded-full bg-nord-15';
      document.getElementById('chart-title').innerText = '分期累積現金流壓迫線';
      document.getElementById('chart-subtitle').innerText = chartRangeMode === 'rolling12'

      const monthlyBurnSeries = slots.map((slot, sIdx) =>

          return term <= i.totalTerms ? sum + i.monthlyAmount : sum;

      );

        pointRadius: 4,
        fill: true,

      }]);

      document.getElementById('detail-list-container').innerHTML = installments.map(i => {
        const remainingTerms = Math.max(0, i.totalTerms - i.currentTerm);

        return `

    /* -------------------------------------------------------------------------
       Chart.js 折線圖繪製
       ------------------------------------------------------------------------- */
    function drawLineChart(labels, datasets) {
      const ctx = document.getElementById('main-line-chart').getContext('2d');
      if (lineChartInstance) {
        lineChartInstance.destroy();
      }

      lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'top',
              labels: {
                color: '#D8DEE9',
                font: { family: 'Inter', size: 12 },
                boxWidth: 12,
                usePointStyle: true
              }
            },
            tooltip: {
              backgroundColor: 'rgba(46, 52, 64, 0.95)',
              titleColor: '#ECEFF4',
              bodyColor: '#D8DEE9',
              borderColor: '#434C5E',
              borderWidth: 1,
              padding: 10,
              boxPadding: 4,
              callbacks: {
                label: function(ctx) {
                  return `${ctx.dataset.label}: NT$ ${formatCurrency(ctx.raw)}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(67, 76, 94, 0.3)', drawBorder: false },
              ticks: { color: '#81A1C1', font: { size: 11, family: 'JetBrains Mono' } }
            },
            y: {
              grid: { color: 'rgba(67, 76, 94, 0.3)', drawBorder: false },
              ticks: {
                color: '#81A1C1',
                font: { size: 11, family: 'JetBrains Mono' },
                callback: function(v) {
                  return v >= 10000 ? `${v / 10000}萬` : v;
                }
              }
            }
          }
        }
      });
    }

                <!-- 新增列 -->

                  </div>
                  <button onclick="addPCBigExpense()"
                    class="px-3 py-1.5 rounded-lg bg-nord-8 hover:bg-nord-7 text-nord-0 text-xs font-bold transition-all flex items-center space-x-1">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>新增</span>
                  </button>

              </div>

            </div>
          </div>

          <!-- 控制按鈕列 (嚴格對齊 UI_VOCABULARY 規範) -->
          <div class="w-full max-w-[500px] flex items-center justify-center space-x-3 mt-4">
            ${!isStage2 ? `
              <button onclick="prevCardPC()" ${cardCoverIndex === 0 ? 'disabled' : ''}
                class="px-4 py-2 rounded-xl bg-nord-1 border border-nord-2 text-xs font-medium text-nord-4 hover:text-nord-6 hover:bg-nord-2 transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                上一張
              </button>
              <button onclick="skipCardAmountPC()"
                class="px-4 py-2 rounded-xl bg-nord-1 border border-nord-2 text-xs font-medium text-nord-4 hover:text-nord-6 hover:bg-nord-2 transition-all">
                略過此卡 (0元)
              </button>
              <button onclick="nextCardPC()"
                class="px-6 py-2 rounded-xl bg-nord-8 hover:bg-nord-7 text-nord-0 text-xs font-bold shadow-lg shadow-nord-8/20 transition-all flex items-center space-x-1.5">
                <span>下一張 (Enter)</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>

              <button onclick="prevCardPC()" ${cardCoverIndex === 0 ? 'disabled' : ''}
                class="px-4 py-2 rounded-xl bg-nord-1 border border-nord-2 text-xs font-medium text-nord-4 hover:text-nord-6 hover:bg-nord-2 transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                上一張
              </button>
              <button onclick="confirmStage2CardPC()"
                class="px-6 py-2 rounded-xl ${hasBig ? 'bg-nord-14 hover:bg-nord-14/80 text-nord-0' : 'bg-nord-8 hover:bg-nord-7 text-nord-0'} text-xs font-bold shadow-lg transition-all flex items-center space-x-1.5">
                <span>${hasBig ? (isLast ? '確認並完成結算' : '確認，下一張 (Enter)') : (isLast ? '無大額，完成結算' : '無大額，下一張 (Enter)')}</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>

    }

    function handlePCCardAmountChange(val) {
      const db = dbCache[currentProfileKey];
      if (db && db.cards && db.cards[cardCoverIndex]) {
        const c = db.cards[cardCoverIndex];
        let rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        const num = val === '' ? null : Number(val);
        if (rec) rec.amount = num;
        else c.records.push({ year: CURRENT_YEAR, month: CURRENT_MONTH, amount: num, bigExpenses: [] });
      }
    }

    function handlePCCardInputKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        nextCardPC();
      }
    }

    function prevCardPC() {
      if (cardCoverIndex > 0) {
        cardCoverIndex--;
        renderInputMode();
      }
    }

    function skipCardAmountPC() {
      const db = dbCache[currentProfileKey];
      if (db && db.cards && db.cards[cardCoverIndex]) {
        const c = db.cards[cardCoverIndex];
        let rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (rec) rec.amount = 0;
        else c.records.push({ year: CURRENT_YEAR, month: CURRENT_MONTH, amount: 0, bigExpenses: [] });
      }
      nextCardPC();
    }

    function nextCardPC() {
      const db = dbCache[currentProfileKey];
      const cards = db.cards || [];
      if (cardInputStage === 1) {
        const inp = document.getElementById('pc-card-amount-input');
        if (inp && inp.value !== '') {
          handlePCCardAmountChange(inp.value);
        }
        if (cardCoverIndex < cards.length - 1) {
          cardCoverIndex++;
          renderInputMode();
          setTimeout(() => {
            const nextInp = document.getElementById('pc-card-amount-input');
            if (nextInp) { nextInp.focus(); nextInp.select(); }
          }, 50);
        } else {
          // 8 張卡輸完，自動進入第二階段
          enterCardStage2Directly();
        }
      }
    }

    function enterCardStage2Directly() {
      const db = dbCache[currentProfileKey];
      const cards = db.cards || [];
      cardInputStage = 2;
      cardCoverIndex = 0;
      cardStage2Order = cards
        .map((c, idx) => {
          const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
          return { originalIndex: idx, amount: (rec && rec.amount) || 0 };
        })
        .sort((a, b) => b.amount - a.amount);
      renderInputMode();
    }

    function confirmStage2CardPC() {
      const list = cardStage2Order.length > 0 ? cardStage2Order : (dbCache[currentProfileKey].cards || []);
      if (cardCoverIndex < list.length - 1) {
        cardCoverIndex++;
        renderInputMode();
      } else {
        // 完成全部卡片登記
        cardInputStage = 3;
        renderInputMode();
      }
    }

    async function addPCBigExpense() {
      const nameInp = document.getElementById('pc-big-name');
      const amtInp = document.getElementById('pc-big-amt');
      if (!nameInp || !nameInp.value || !amtInp || !amtInp.value) return;

      const title = nameInp.value.trim();
      const amount = Number(amtInp.value);
      if (!title || isNaN(amount) || amount <= 0) return;

      const db = dbCache[currentProfileKey];
      const list = cardStage2Order.length > 0 ? cardStage2Order : db.cards;
      const targetCard = (cardInputStage === 2 && cardStage2Order.length > 0)
        ? db.cards[cardStage2Order[cardCoverIndex].originalIndex]
        : db.cards[cardCoverIndex];

      if (targetCard) {
        let rec = (targetCard.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (!rec) {
          rec = { year: CURRENT_YEAR, month: CURRENT_MONTH, amount: 0, bigExpenses: [] };
          targetCard.records.push(rec);
        }
        if (!rec.bigExpenses) rec.bigExpenses = [];
        rec.bigExpenses.push({ id: 'be_' + Date.now(), title, amount });
        nameInp.value = '';
        amtInp.value = '';
        renderInputMode();
      }
    }

    async function removePCBigExpense(bIdx) {
      const db = dbCache[currentProfileKey];
      const targetCard = (cardInputStage === 2 && cardStage2Order.length > 0)
        ? db.cards[cardStage2Order[cardCoverIndex].originalIndex]
        : db.cards[cardCoverIndex];

      if (targetCard) {
        const rec = (targetCard.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (rec && rec.bigExpenses) {
          rec.bigExpenses.splice(bIdx, 1);
          renderInputMode();
        }
      }
    }

    function setCardCoverIndex(idx) {
      cardCoverIndex = idx;
      renderInputMode();
    }

    function renderCardCompleteViewPC(db, wrapper) {
      const cards = db.cards || [];
      const totalSpend = cards.reduce((sum, c) => {
        const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        return sum + ((rec && rec.amount) || 0);
      }, 0);
      let totalBigCount = 0;
      cards.forEach(c => {
        const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
        if (rec && rec.bigExpenses) totalBigCount += rec.bigExpenses.length;
      });

      wrapper.innerHTML = `
        <div class="my-auto max-w-xl mx-auto w-full bg-nord-1/90 border border-nord-2 rounded-2xl p-6 sm:p-8 text-center shadow-2xl backdrop-blur-xl">
          <div class="w-14 h-14 rounded-full bg-nord-14/20 text-nord-14 border border-nord-14/30 flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fa-solid fa-check"></i>
          </div>
          <h3 class="text-xl font-bold text-nord-6 mb-1">信用卡費登記完成</h3>
          <p class="text-sm text-nord-4 mb-6">全數 ${cards.length} 張信用卡帳單與大額明細已全數建檔完畢</p>

          <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-nord-0/60 p-3 rounded-xl border border-nord-2/60 text-left">
              <span class="text-xs text-nord-4 block">本月帳單總計</span>
              <span class="text-lg font-bold font-mono text-nord-6 masked-amount">NT$ ${formatCurrency(totalSpend)}</span>
            </div>
            <div class="bg-nord-0/60 p-3 rounded-xl border border-nord-2/60 text-left">
              <span class="text-xs text-nord-4 block">大額消費項目</span>
              <span class="text-lg font-bold font-mono text-nord-8">${totalBigCount} 筆</span>
            </div>
          </div>

          <div class="flex items-center justify-center space-x-3">
            <button onclick="resetCardFlowPC()" class="px-5 py-2.5 rounded-xl border border-nord-2 bg-nord-0 hover:bg-nord-2 text-sm text-nord-4 hover:text-nord-6 font-medium transition-colors">
              重新填寫
            </button>
            <button onclick="switchMainTab('banks')" class="px-6 py-2.5 rounded-xl bg-nord-8 hover:bg-nord-7 text-nord-0 text-sm font-bold shadow-lg shadow-nord-8/20 transition-all flex items-center space-x-2">
              <span>前往銀行餘額</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
            <button onclick="toggleViewInputMode()" class="px-5 py-2.5 rounded-xl bg-nord-2 hover:bg-nord-3 text-sm text-nord-6 font-medium transition-colors">
              返回瀏覽視圖
            </button>
          </div>
        </div>
      `;
    }

    function resetCardFlowPC() {
      cardInputStage = 1;
      cardCoverIndex = 0;
      renderInputMode();
    }


    /* 2. 銀行餘額輸入 (PC 版智慧滾算 + [推估無誤] 一鍵確認 + 收支事件歸戶) */
    function getPCBankEstimated(db, bank) {
      const snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
      if (snap && snap.theoreticalBalance !== undefined) return snap.theoreticalBalance;
      
      const lastBal = bank.balance || 80000;
      const salary = bank.defaultSalary || 0;
      const pendingCards = (db.cards || [])
        .filter(c => c.bankId === bank.id)
        .reduce((sum, c) => {
          const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
          return sum + ((rec && rec.amount) || 0);
        }, 0);
      const pendingBills = (db.recurringBills || db.bills || [])
        .filter(b => (b.paymentMethod === 'bank_direct' || b.targetType === 'bank') && b.targetId === bank.id)
        .reduce((sum, b) => sum + (b.defaultAmount !== undefined ? b.defaultAmount : (b.amount || 0)), 0);

      return lastBal + salary - pendingCards - pendingBills;
    }

    function renderBankInputPC(db, wrapper) {
      const banks = db.banks || [];
      if (banks.length === 0) {
        wrapper.innerHTML = `<div class="p-8 text-center text-nord-4">無可用銀行帳戶資料</div>`;
        return;
      }

      if (bankInputStage === 3) {
        renderBankCompleteViewPC(db, wrapper);
        return;
      }

      if (bankCoverIndex >= banks.length) bankCoverIndex = 0;
      const bank = banks[bankCoverIndex];
      const isStage2 = (bankInputStage === 2);
      const isLast = (bankCoverIndex === banks.length - 1);

      const snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id) || {
        balance: bank.balance || 0,
        theoreticalBalance: bank.balance || 0,
        events: []
      };
      if (!snap.events) snap.events = [];

      const estimated = getPCBankEstimated(db, bank);
      const curBal = (bank.balance !== null && bank.balance !== undefined) ? bank.balance : estimated;
      const diff = curBal - estimated;
      const hasEvents = snap.events.length > 0;

      // 滾算因子明細
      const salary = bank.defaultSalary || 0;
      const cardDebit = (db.cards || [])
        .filter(c => c.bankId === bank.id)
        .reduce((sum, c) => {
          const rec = (c.records || []).find(r => r.year === CURRENT_YEAR && r.month === CURRENT_MONTH);
          return sum + ((rec && rec.amount) || 0);
        }, 0);
      const fixedDebit = (db.recurringBills || db.bills || [])
        .filter(b => (b.paymentMethod === 'bank_direct' || b.targetType === 'bank') && b.targetId === bank.id)
        .reduce((sum, b) => sum + (b.defaultAmount !== undefined ? b.defaultAmount : (b.amount || 0)), 0);
      const lastBal = bank.lastBalance || (curBal - salary + cardDebit + fixedDebit);

      wrapper.innerHTML = `
        <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-6 sm:p-8 shadow-xl flex flex-col items-center">
          
          <!-- 頂部進度標籤 -->
          <div class="w-full flex items-center justify-between mb-6 pb-3 border-b border-nord-2/60">
            <div class="flex items-center space-x-3">
              <span class="px-3 py-1 rounded-full text-xs font-semibold ${isStage2 ? 'bg-nord-13/15 text-nord-13 border border-nord-13/30' : 'bg-nord-9/15 text-nord-9 border border-nord-9/30'} flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full ${isStage2 ? 'bg-nord-13 animate-pulse' : 'bg-nord-9 animate-pulse'}"></span>
                <span id="bank-stage-title">${isStage2 ? '第二階段：收支事件歸戶' : '第一階段：盤點銀行餘額'}</span>
              </span>
              <span class="text-xs font-mono text-nord-4">銀行 ${bankCoverIndex + 1} / ${banks.length}</span>
            </div>

            <!-- 圓點導引 -->
            <div class="flex items-center space-x-1.5">
              ${banks.map((_, idx) => `
                <button onclick="setBankCoverIndex(${idx})" class="h-2 rounded-full transition-all ${idx === bankCoverIndex ? (isStage2 ? 'bg-nord-13 w-6' : 'bg-nord-9 w-6') : 'bg-nord-3 hover:bg-nord-4 w-2'}"></button>
              `).join('')}
            </div>
          </div>

          <!-- 銀行卡面 3D 擬真展示舞台 (寬度 520px，高度 340px) -->
          <div class="w-full max-w-[520px] h-[340px] perspective-1000 my-2">
            <div class="w-full h-full relative transform-style-3d transition-transform duration-700 ${isStage2 ? 'rotate-y-180' : ''}">
              
              <!-- 正面 (第一階段：月度自動滾算理論餘額 + 一鍵確認) -->
              <div class="absolute inset-0 w-full h-full rounded-2xl p-6 bg-gradient-to-tr from-nord-0 via-nord-1 to-nord-2 backface-hidden flex flex-col justify-between border border-nord-4/20 shadow-2xl select-none">
                
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-nord-9/20 text-nord-9 flex items-center justify-center border border-nord-9/30">
                      <i class="fa-solid fa-building-columns text-base"></i>
                    </div>
                    <div>
                      <span class="text-base font-bold text-nord-6 block">${bank.name}</span>
                      <span class="text-xs font-mono text-nord-4/70">代碼 ${bank.code || '808'}</span>
                    </div>
                  </div>
                  <span class="px-2.5 py-0.5 rounded text-xs font-semibold bg-nord-9/20 text-nord-9 border border-nord-9/30">
                    月度自動滾算
                  </span>
                </div>

                <!-- 滾算明細展示框 -->
                <div class="my-2 bg-nord-0/60 p-3 rounded-xl border border-white/5 space-y-1.5 text-xs">
                  <div class="flex items-center justify-between text-nord-4">
                    <span>上次盤點餘額</span>
                    <span class="font-mono masked-amount">NT$ ${formatCurrency(lastBal)}</span>
                  </div>
                  ${salary > 0 ? `
                  <div class="flex items-center justify-between text-nord-14">
                    <span>+ 固定薪資入帳</span>
                    <span class="font-mono masked-amount">+NT$ ${formatCurrency(salary)}</span>
                  </div>` : ''}
                  ${cardDebit > 0 ? `
                  <div class="flex items-center justify-between text-nord-11">
                    <span>- 綁定信用卡費</span>
                    <span class="font-mono masked-amount">-NT$ ${formatCurrency(cardDebit)}</span>
                  </div>` : ''}
                  ${fixedDebit > 0 ? `
                  <div class="flex items-center justify-between text-nord-12">
                    <span>- 房租/車貸直扣</span>
                    <span class="font-mono masked-amount">-NT$ ${formatCurrency(fixedDebit)}</span>
                  </div>` : ''}
                  <div class="pt-1.5 border-t border-nord-2/60 flex items-center justify-between font-semibold">
                    <span class="text-nord-9 font-bold">今日推估餘額</span>
                    <span class="font-mono text-base text-nord-9 font-bold masked-amount">NT$ ${formatCurrency(estimated)}</span>
                  </div>
                </div>

                <!-- 實際餘額輸入框 (可微調) -->
                <div onclick="event.stopPropagation()">
                  <div class="relative max-w-[320px] mx-auto">
                    <span class="absolute left-3.5 top-2.5 text-sm font-bold text-nord-4 font-mono">實際 NT$</span>
                    <input id="pc-bank-input-${bank.id}" type="number" inputmode="decimal" value="${curBal}"
                      onkeydown="handlePCBankInputKeyDown(event)"
                      oninput="handlePCBankAmountChange('${bank.id}', this.value)"
                      class="w-full pl-24 pr-4 py-2 text-center text-xl font-bold font-mono tracking-tight rounded-xl bg-nord-0/90 border-2 border-nord-9/40 focus:border-nord-9 text-nord-6 outline-none shadow-inner">
                  </div>
                </div>

                <div class="flex items-center justify-between text-xs text-nord-4/70 pt-1">
                  <span>點擊「推估無誤」即以此餘額歸檔</span>
                  <span class="font-mono">差額 NT$ ${formatCurrency(diff)}</span>
                </div>

              </div>

              <!-- 背面 (第二階段：收支事件歸戶) -->

              <button onclick="prevBankPC()" ${bankCoverIndex === 0 ? 'disabled' : ''}

                上一家
              </button>
              <button onclick="confirmStage2BankPC()"
                class="px-6 py-2 rounded-xl ${hasEvents ? 'bg-nord-14 hover:bg-nord-14/80 text-nord-0' : 'bg-nord-9 hover:bg-nord-8 text-nord-0'} text-xs font-bold shadow-lg transition-all flex items-center space-x-1.5">

    function setBankCoverIndex(idx) {
      bankCoverIndex = idx;
      renderInputMode();
    }

    function handlePCBankAmountChange(bankId, val) {
      const db = dbCache[currentProfileKey];
      const bank = (db.banks || []).find(b => b.id === bankId);
      if (bank) {
        const num = val === '' ? null : Number(val);
        bank.balance = num;
        let snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bankId);
        if (snap) snap.balance = num;
      }
    }

    function handlePCBankInputKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        confirmEstimatedBankPC();
      }
    }

    function prevBankPC() {
      if (bankCoverIndex > 0) {
        bankCoverIndex--;
        renderInputMode();
      }
    }

    function confirmEstimatedBankPC() {
      const db = dbCache[currentProfileKey];
      const banks = db.banks || [];
      const bank = banks[bankCoverIndex];
      const estimated = getPCBankEstimated(db, bank);
      bank.balance = estimated;
      let snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
      if (snap) snap.balance = estimated;
      nextBankPC();
    }

    function nextBankPC() {
      const db = dbCache[currentProfileKey];
      const banks = db.banks || [];
      if (bankInputStage === 1) {
        if (bankCoverIndex < banks.length - 1) {
          bankCoverIndex++;
          renderInputMode();
        } else {
          // 銀行餘額輸完，進入第二階段收支事件歸戶
          bankInputStage = 2;
          bankCoverIndex = 0;
          renderInputMode();
        }
      }
    }

    function setPCBankEventType(type) {
      currentBankEventType = type;
      renderInputMode();
    }

    function addPCBankEvent() {
      const titleInp = document.getElementById('pc-event-title');
      const amtInp = document.getElementById('pc-event-amount');
      if (!titleInp || !titleInp.value || !amtInp || !amtInp.value) return;

      const title = titleInp.value.trim();
      const amount = Number(amtInp.value);
      if (!title || isNaN(amount) || amount <= 0) return;

      const db = dbCache[currentProfileKey];
      const bank = db.banks[bankCoverIndex];
      if (bank) {
        let snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
        if (!snap) {
          snap = { year: CURRENT_YEAR, month: CURRENT_MONTH, bankId: bank.id, balance: bank.balance, events: [] };
          if (!db.bankSnapshots) db.bankSnapshots = [];
          db.bankSnapshots.push(snap);
        }
        if (!snap.events) snap.events = [];
        snap.events.push({
          id: 'be_' + Date.now(),
          type: currentBankEventType,
          title,
          amount
        });
        titleInp.value = '';
        amtInp.value = '';
        renderInputMode();
      }
    }

    function removePCBankEvent(idx) {
      const db = dbCache[currentProfileKey];
      const bank = db.banks[bankCoverIndex];
      if (bank) {
        const snap = (db.bankSnapshots || []).find(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.bankId === bank.id);
        if (snap && snap.events) {
          snap.events.splice(idx, 1);
          renderInputMode();
        }
      }
    }

    function confirmStage2BankPC() {
      const db = dbCache[currentProfileKey];
      const banks = db.banks || [];
      if (bankCoverIndex < banks.length - 1) {
        bankCoverIndex++;
        renderInputMode();
      } else {
        bankInputStage = 3;
        renderInputMode();
      }
    }

      const banks = db.banks || [];
      const totalBal = banks.reduce((s, b) => s + (b.balance || 0), 0);

      (db.bankSnapshots || []).forEach(s => {
        if (s.year === CURRENT_YEAR && s.month === CURRENT_MONTH && s.events) {
          totalEvents += s.events.length;
        }
      });

      wrapper.innerHTML = `
        <div class="my-auto max-w-xl mx-auto w-full bg-nord-1/90 border border-nord-2 rounded-2xl p-6 sm:p-8 text-center shadow-2xl backdrop-blur-xl">

              <span class="text-lg font-bold font-mono text-nord-14 masked-amount">NT$ ${formatCurrency(totalBal)}</span>

              <span class="text-xs text-nord-4 block">歸戶收支事件</span>

          <div class="flex items-center justify-center space-x-3">

              返回瀏覽視圖
            </button>
          </div>
        </div>
      `;
    }

    function resetBankFlowPC() {
      bankInputStage = 1;
      bankCoverIndex = 0;
      renderInputMode();
    }

    function quickFillBillPC(name, amt, day, cycle, route) {

      document.getElementById('pc-bill-cycle').value = cycle;
      document.getElementById('pc-bill-route').value = route;

    async function addBillItemPC() {
      const nameInp = document.getElementById('pc-bill-name');
      const amtInp = document.getElementById('pc-bill-amt');
      const dayInp = document.getElementById('pc-bill-day');
      const cycleSel = document.getElementById('pc-bill-cycle');
      const routeSel = document.getElementById('pc-bill-route');

      if (!nameInp || !nameInp.value) return;
      const db = await loadProfileData(currentProfileKey);
      if (db) {
        if (!db.recurringBills) db.recurringBills = [];
        db.recurringBills.push({
          id: 'bill_' + Date.now(),
          name: nameInp.value,
          defaultAmount: Number(amtInp.value) || 0,
          dueDay: Number(dayInp.value) || 10,
          cycle: cycleSel.value,
          paymentMethod: routeSel.value === 'bank' ? 'bank_direct' : 'card_auto',
          status: 'pending'
        });
        showToast('已登記新固定費用！');
        renderInputMode();
      }
    }
    async function toggleBillStatusPC(idx, st) {
      const db = await loadProfileData(currentProfileKey);
      const list = db.recurringBills || db.bills;
      if (list && list[idx]) {
        list[idx].status = st;
        renderInputMode();
      }
    }
    function saveBillsAndReturnPC() {
      showToast('✅ 固定費用狀態已儲存完畢！');
      toggleViewInputMode();
    }


    /* 4. 分期付款輸入 (PC 版左側新增 + 右側進度推進) */
    function renderInstallmentInputPC(db, wrapper) {
      const rawInst = db.installments || [];
      const totalRemaining = rawInst.reduce((s, i) => {
        const totalPeriods = i.totalPeriods || i.totalTerms || 12;
        let curTerm = i.currentTerm !== undefined ? i.currentTerm : 1;
        const left = Math.max(0, totalPeriods - curTerm);
        const monthly = i.regularPeriodAmount || i.monthlyAmount || 3000;
        return s + (left * monthly);
      }, 0);

      wrapper.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          
          <!-- 左側：新增分期付款 (佔 5 欄) -->
          <div class="lg:col-span-5 bg-nord-1/80 border border-nord-2 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-4 pb-2 border-b border-nord-2/60">
                <span class="text-sm font-bold text-nord-6 flex items-center space-x-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-nord-15"></span>
                  <span>新增分期消費</span>
                </span>
                <span class="text-xs text-nord-4">自動推算每月負擔</span>
              </div>

              <!-- 快捷範本 -->
              <div class="mb-4">
                <span class="text-[11px] text-nord-4 block mb-1.5 font-medium">快速套用範本</span>
                <div class="flex flex-wrap gap-1.5">
                  <button onclick="quickFillInstPC('iPhone 16 Pro', 42000, 12)" class="px-2.5 py-1 rounded-md text-xs bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2">iPhone</button>
                  <button onclick="quickFillInstPC('MacBook Air M3', 35900, 12)" class="px-2.5 py-1 rounded-md text-xs bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2">MacBook</button>
                  <button onclick="quickFillInstPC('日本機票住宿', 28000, 6)" class="px-2.5 py-1 rounded-md text-xs bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2">機票住宿</button>
                  <button onclick="quickFillInstPC('SONY 智慧電視', 24000, 12)" class="px-2.5 py-1 rounded-md text-xs bg-nord-0 text-nord-4 hover:text-nord-6 border border-nord-2">電視</button>
                </div>
              </div>

              <div class="space-y-3.5">
                <div>
                  <label class="block text-xs text-nord-4 mb-1">分期項目名稱</label>
                  <input id="pc-inst-name" type="text" placeholder="例：iPhone 16 Pro 256GB"
                    class="w-full px-3.5 py-2 rounded-xl bg-nord-0 border border-nord-2 text-nord-6 text-sm outline-none focus:border-nord-15">
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-nord-4 mb-1">總金額 (NT$)</label>
                    <input id="pc-inst-total" type="number" placeholder="0" oninput="calcInstMonthlyPC()"
                      class="w-full px-3.5 py-2 rounded-xl bg-nord-0 border border-nord-2 text-nord-6 text-sm font-mono outline-none focus:border-nord-15">
                  </div>
                  <div>
                    <label class="block text-xs text-nord-4 mb-1">總期數</label>
                    <input id="pc-inst-periods" type="number" value="12" min="2" max="60" oninput="calcInstMonthlyPC()"
                      class="w-full px-3.5 py-2 rounded-xl bg-nord-0 border border-nord-2 text-nord-6 text-sm font-mono outline-none focus:border-nord-15">
                  </div>
                </div>

                <!-- 每月試算回饋 -->
                <div class="p-3 bg-nord-0/60 rounded-xl border border-nord-2/60 flex items-center justify-between text-xs">
                  <span class="text-nord-4">每期預估扣款：</span>
                  <span id="pc-inst-calc-preview" class="font-mono font-bold text-nord-15 text-sm">NT$ 0</span>
                </div>
              </div>
            </div>

            <button onclick="addInstItemPC()"
              class="w-full mt-6 py-2.5 rounded-xl bg-nord-15 hover:bg-nord-15/80 text-nord-0 font-bold text-xs shadow-md transition-all flex items-center justify-center space-x-1.5">
              <i class="fa-solid fa-plus text-xs"></i>
              <span>儲存並登記新分期</span>
            </button>
          </div>

          <!-- 右側：分期清單與一鍵推進 (佔 7 欄) -->
          <div class="lg:col-span-7 bg-nord-1/80 border border-nord-2 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-4 pb-2 border-b border-nord-2/60">
                <div>
                  <span class="text-sm font-bold text-nord-6 block">進行中分期項目與進度調整</span>
                  <span class="text-xs text-nord-4">未還尾款總額：<span class="font-mono text-nord-11 font-bold">NT$ ${formatCurrency(totalRemaining)}</span></span>
                </div>
                <!-- 一鍵全數推進 -->
                <button onclick="advanceAllInstPC()" class="px-3.5 py-1.5 rounded-lg bg-nord-15/20 hover:bg-nord-15/30 border border-nord-15/40 text-nord-15 font-bold text-xs flex items-center space-x-1 transition-colors">
                  <i class="fa-solid fa-forward-step text-xs"></i>
                  <span>全數推進 +1 期</span>
                </button>
              </div>

              <div class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                ${rawInst.map((item, idx) => {
                  const totalPeriods = item.totalPeriods || item.totalTerms || 12;
                  let curTerm = item.currentTerm !== undefined ? item.currentTerm : 1;
                  const monthly = item.regularPeriodAmount || item.monthlyAmount || 3000;
                  const left = Math.max(0, totalPeriods - curTerm);

                  return `
                    <div class="bg-nord-0/60 border border-nord-2/80 rounded-xl p-3 flex items-center justify-between">
                      <div>
                        <span class="text-xs font-bold text-nord-6 block">${item.title || item.name}</span>
                        <span class="text-[10px] text-nord-4 font-mono">
                          NT$ ${formatCurrency(monthly)} /月 • 剩餘 ${left} 期 (尾款 NT$ ${formatCurrency(left * monthly)})
                        </span>
                      </div>

                      <div class="flex items-center space-x-2">
                        <button onclick="stepInstItemPC(${idx}, -1)" class="w-7 h-7 rounded-lg bg-nord-1 border border-nord-2 text-nord-4 hover:text-nord-6 text-xs">-</button>
                        <span class="text-xs font-mono font-bold text-nord-6 w-12 text-center">${curTerm} / ${totalPeriods}</span>
                        <button onclick="stepInstItemPC(${idx}, 1)" class="w-7 h-7 rounded-lg bg-nord-1 border border-nord-2 text-nord-4 hover:text-nord-6 text-xs">+</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="pt-4 flex justify-end">
              <button onclick="saveInstAndReturnPC()"
                class="px-8 py-3 rounded-xl bg-nord-15 hover:bg-nord-15/90 text-nord-0 font-bold text-sm shadow-xl shadow-nord-15/20 transition-all flex items-center space-x-2">
                <i class="fa-solid fa-check text-sm"></i>
                <span>儲存分期進度 (返回瀏覽視圖)</span>
              </button>
            </div>
          </div>

        </div>
      `;
    }

    function quickFillInstPC(name, total, periods) {
      document.getElementById('pc-inst-name').value = name;
      document.getElementById('pc-inst-total').value = total;
      document.getElementById('pc-inst-periods').value = periods;
      calcInstMonthlyPC();
    }
    function calcInstMonthlyPC() {
      const tot = Number(document.getElementById('pc-inst-total').value) || 0;
      const per = Number(document.getElementById('pc-inst-periods').value) || 12;
      const m = Math.round(tot / (per || 1));
      document.getElementById('pc-inst-calc-preview').textContent = `NT$ ${formatCurrency(m)}`;
    }
    async function addInstItemPC() {
      const name = document.getElementById('pc-inst-name').value;
      const tot = Number(document.getElementById('pc-inst-total').value) || 0;
      const per = Number(document.getElementById('pc-inst-periods').value) || 12;
      if (!name) return;

      const db = await loadProfileData(currentProfileKey);
      if (db) {
        if (!db.installments) db.installments = [];
        db.installments.push({
          id: 'inst_' + Date.now(),
          title: name,
          totalAmount: tot,
          totalPeriods: per,
          currentTerm: 1,
          regularPeriodAmount: Math.round(tot / per),
          firstPeriodAmount: Math.round(tot / per)
        });
        showToast('已登記新分期付款！');
        renderInputMode();
      }
    }
    async function advanceAllInstPC() {
      const db = await loadProfileData(currentProfileKey);
      if (db && db.installments) {
        db.installments.forEach(i => {
          const tot = i.totalPeriods || i.totalTerms || 12;
          let cur = i.currentTerm !== undefined ? i.currentTerm : 1;
          if (cur < tot) i.currentTerm = cur + 1;
        });
        showToast('全數分期已推進 +1 期！');
        renderInputMode();
      }
    }
    async function stepInstItemPC(idx, delta) {
      const db = await loadProfileData(currentProfileKey);
      if (db && db.installments && db.installments[idx]) {
        const item = db.installments[idx];
        const tot = item.totalPeriods || item.totalTerms || 12;
        let cur = item.currentTerm !== undefined ? item.currentTerm : 1;
        item.currentTerm = Math.max(0, Math.min(tot, cur + delta));
        renderInputMode();
      }
    }
    function saveInstAndReturnPC() {
      showToast('✅ 分期款項進度已更新！');
      toggleViewInputMode();
    }


    /* -------------------------------------------------------------------------
       初始化啟動 (DOMContentLoaded)
       ------------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', async () => {
      syncModeUI();
    });
  </script>
</body>
</html>
