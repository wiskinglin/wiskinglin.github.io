<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PocketMoney</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            nord: {
              0: '#2E3440',
              1: '#3B4252',
              2: '#434C5E',
              3: '#4C566A',
              4: '#D8DEE9',
              5: '#E5E9F0',
              6: '#ECEFF4',
              7: '#8FBCBB',
              8: '#88C0D0',
              9: '#81A1C1',
              10: '#5E81AC',
              11: '#BF616A',
              12: '#D08770',
              13: '#EBCB8B',
              14: '#A3BE8C',
              15: '#B48EAD'
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #242933;
      color: #ECEFF4;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #2E3440;
    }

    ::-webkit-scrollbar-thumb {
      background: #434C5E;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4C566A;
    }

    .privacy-masked .masked-amount {
      filter: blur(5px);
      user-select: none;
    }
  </style>
</head>

<body class="bg-[#242933] text-nord-6 min-h-screen flex flex-col antialiased selection:bg-nord-8 selection:text-nord-0">

  <!-- ==================== 頂部全域導覽 ==================== -->
  <header class="sticky top-0 z-50 bg-[#2E3440]/90 backdrop-blur-md border-b border-nord-2 px-4 lg:px-8 py-3 transition-colors">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-nord-10 to-nord-8 flex items-center justify-center shadow-lg shadow-nord-10/20 text-nord-0 font-bold">
          <i class="fa-solid fa-wallet text-base"></i>
        </div>
        <span class="text-lg font-bold tracking-tight text-nord-6">PocketMoney</span>
      </div>

      <!-- 四大模組導覽按鈕 -->
      <nav class="flex items-center bg-nord-1 p-1 rounded-xl border border-nord-2/60 shadow-inner">
        <button id="nav-tab-cards" onclick="switchMainTab('cards')"
          class="nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2">
          <i class="fa-regular fa-credit-card text-nord-8 text-xs"></i>
          <span>信用卡費</span>
        </button>
        <button id="nav-tab-banks" onclick="switchMainTab('banks')"
          class="nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-6 bg-nord-2 shadow-sm flex items-center space-x-2">
          <i class="fa-solid fa-building-columns text-nord-9 text-xs"></i>
          <span>銀行餘額</span>
        </button>
        <button id="nav-tab-bills" onclick="switchMainTab('bills')"
          class="nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2">
          <i class="fa-solid fa-calendar-check text-nord-7 text-xs"></i>
          <span>固定費用</span>
        </button>
        <button id="nav-tab-installments" onclick="switchMainTab('installments')"
          class="nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2">
          <i class="fa-solid fa-layer-group text-nord-15 text-xs"></i>
          <span>分期付款</span>
        </button>
      </nav>

      <!-- 右側：三種模擬資料庫切換 + 隱私遮罩 -->
      <div class="flex items-center space-x-2">
        <div class="flex items-center bg-nord-1 p-1 rounded-lg border border-nord-2 text-xs">
          <button id="prof-junior" onclick="switchProfile('junior')" class="px-2.5 py-1 rounded-md font-medium transition-colors text-nord-4 hover:text-nord-6">初級大人</button>
          <button id="prof-family" onclick="switchProfile('family')" class="px-2.5 py-1 rounded-md font-bold transition-colors bg-nord-8 text-nord-0">少子化勇者</button>
          <button id="prof-senior" onclick="switchProfile('senior')" class="px-2.5 py-1 rounded-md font-medium transition-colors text-nord-4 hover:text-nord-6">高級大人</button>
        </div>

        <button onclick="togglePrivacyMode()" title="隱私遮罩"
          class="w-9 h-9 rounded-lg bg-nord-1 border border-nord-2 text-nord-4 hover:text-nord-6 hover:bg-nord-2/60 flex items-center justify-center transition-colors">
          <i id="privacy-icon" class="fa-regular fa-eye text-sm"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== 主瀏覽視圖容器 ==================== -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col space-y-6">

    <!-- 1. 頂部三大 KPI 金額摘要卡 -->
    <div id="kpi-cards-row" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- 由 JS 根據當前分頁動態渲染 -->
    </div>

    <!-- 2. 中間 12 個月趨勢折線圖區塊 -->
    <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-5 sm:p-6 shadow-xl">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        
        <!-- 左上方：兩種 12 個月時間軸模式切換按鈕 + 圖表標題 -->
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center bg-nord-0 p-1 rounded-xl border border-nord-2">
            <button id="btn-mode-rolling12" onclick="switchChartRangeMode('rolling12')"
              class="px-3 py-1 rounded-lg text-xs font-bold transition-all bg-nord-8 text-nord-0 shadow-sm">
              近 12 個月
            </button>
            <button id="btn-mode-ytd" onclick="switchChartRangeMode('ytd')"
              class="px-3 py-1 rounded-lg text-xs font-medium transition-all text-nord-4 hover:text-nord-6">
              當年度
            </button>
          </div>

          <div class="flex items-center space-x-2">
            <span id="chart-dot" class="w-2.5 h-2.5 rounded-full bg-nord-9"></span>
            <h2 id="chart-title" class="text-base font-bold text-nord-6">銀行餘額</h2>
            <span id="chart-subtitle" class="text-xs text-nord-4 font-mono">2025/11 ~ 2026/10</span>
          </div>
        </div>

        <!-- 右上方：篩選單一銀行/卡片的膠囊按鈕列 -->
        <div id="chart-filter-pills" class="flex flex-wrap items-center gap-1.5">
          <!-- 動態注入「全部」與個別帳戶/卡片切換按鈕 -->
        </div>
      </div>

      <!-- 圖表 Canvas 容器 -->
      <div class="relative w-full h-[300px] sm:h-[340px]">
        <canvas id="main-line-chart"></canvas>
      </div>
    </div>

    <!-- 3. 下方各項目金額與事件/明細卡片清單 -->
    <div id="detail-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- 由 JS 根據當前分頁動態渲染 -->
    </div>

  </main>

  <script>
    let currentProfileKey = 'family';
    let currentMainTab = 'banks';      // 'cards' | 'banks' | 'bills' | 'installments'
    let chartRangeMode = 'rolling12';  // 'rolling12' (預設：連續 12 個月 25/11~26/10) | 'ytd' (當年度 26/01~26/12)
    let selectedEntityId = 'all';
    let isPrivacyMasked = false;
    let lineChartInstance = null;
    let dbCache = {};

    // 系統當前基準年月 (2026年 10月)
    const CURRENT_YEAR = 2026;
    const CURRENT_MONTH = 10;

    // 連續 12 個月座標 (2025/11 ~ 2026/10，全數已發生)
    const ROLLING_12_SLOTS = [
      { year: 2025, month: 11, label: '25/11', isFuture: false },
      { year: 2025, month: 12, label: '25/12', isFuture: false },
      { year: 2026, month: 1,  label: '26/01', isFuture: false },
      { year: 2026, month: 2,  label: '26/02', isFuture: false },
      { year: 2026, month: 3,  label: '26/03', isFuture: false },
      { year: 2026, month: 4,  label: '26/04', isFuture: false },
      { year: 2026, month: 5,  label: '26/05', isFuture: false },
      { year: 2026, month: 6,  label: '26/06', isFuture: false },
      { year: 2026, month: 7,  label: '26/07', isFuture: false },
      { year: 2026, month: 8,  label: '26/08', isFuture: false },
      { year: 2026, month: 9,  label: '26/09', isFuture: false },
      { year: 2026, month: 10, label: '26/10', isFuture: false }
    ];

    // 當年度 12 個月座標 (2026/01 ~ 2026/12，其中 11月、12月為未發生月份)
    const YTD_12_SLOTS = [
      { year: 2026, month: 1,  label: '1月',  isFuture: false },
      { year: 2026, month: 2,  label: '2月',  isFuture: false },
      { year: 2026, month: 3,  label: '3月',  isFuture: false },
      { year: 2026, month: 4,  label: '4月',  isFuture: false },
      { year: 2026, month: 5,  label: '5月',  isFuture: false },
      { year: 2026, month: 6,  label: '6月',  isFuture: false },
      { year: 2026, month: 7,  label: '7月',  isFuture: false },
      { year: 2026, month: 8,  label: '8月',  isFuture: false },
      { year: 2026, month: 9,  label: '9月',  isFuture: false },
      { year: 2026, month: 10, label: '10月', isFuture: false },
      { year: 2026, month: 11, label: '11月 (未發生)', isFuture: true },
      { year: 2026, month: 12, label: '12月 (未發生)', isFuture: true }
    ];

    function getActiveSlots() {
      return chartRangeMode === 'rolling12' ? ROLLING_12_SLOTS : YTD_12_SLOTS;
    }

    function formatCurrency(num) {
      if (num === null || num === undefined) return '0';
      return new Intl.NumberFormat('zh-TW').format(Math.round(num));
    }

    function togglePrivacyMode() {
      isPrivacyMasked = !isPrivacyMasked;
      document.body.classList.toggle('privacy-masked', isPrivacyMasked);
      const icon = document.getElementById('privacy-icon');
      icon.className = isPrivacyMasked
        ? 'fa-regular fa-eye-slash text-sm text-nord-8'
        : 'fa-regular fa-eye text-sm text-nord-4';
    }

    async function loadProfileData(profileKey) {
      if (dbCache[profileKey]) return dbCache[profileKey];
      try {
        const res = await fetch(`./database/dummy_db_${profileKey}.json`);
        if (res.ok) {
          const data = await res.json();
          dbCache[profileKey] = data;
          return data;
        }
      } catch (e) {
        // file:// 離線開啟時自動使用內嵌資料庫
      }
      return EMBEDDED_DUMMY_DB[profileKey];
    }

    async function switchProfile(profileKey) {
      currentProfileKey = profileKey;
      selectedEntityId = 'all';

      ['junior', 'family', 'senior'].forEach(k => {
        const btn = document.getElementById(`prof-${k}`);
        if (k === profileKey) {
          btn.className = 'px-2.5 py-1 rounded-md font-bold transition-colors bg-nord-8 text-nord-0';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md font-medium transition-colors text-nord-4 hover:text-nord-6';
        }
      });

      await renderView();
    }

    async function switchMainTab(tab) {
      currentMainTab = tab;
      selectedEntityId = 'all';

      const tabs = ['cards', 'banks', 'bills', 'installments'];
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-tab-${t}`);
        if (t === tab) {
          btn.className = 'nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-6 bg-nord-2 shadow-sm flex items-center space-x-2';
        } else {
          btn.className = 'nav-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-nord-4 hover:text-nord-6 hover:bg-nord-2/40 flex items-center space-x-2';
        }
      });

      await renderView();
    }

    function switchChartRangeMode(mode) {
      chartRangeMode = mode;
      const btnRolling = document.getElementById('btn-mode-rolling12');
      const btnYtd = document.getElementById('btn-mode-ytd');

      if (mode === 'rolling12') {
        btnRolling.className = 'px-3 py-1 rounded-lg text-xs font-bold transition-all bg-nord-8 text-nord-0 shadow-sm';
        btnYtd.className = 'px-3 py-1 rounded-lg text-xs font-medium transition-all text-nord-4 hover:text-nord-6';
      } else {
        btnYtd.className = 'px-3 py-1 rounded-lg text-xs font-bold transition-all bg-nord-8 text-nord-0 shadow-sm';
        btnRolling.className = 'px-3 py-1 rounded-lg text-xs font-medium transition-all text-nord-4 hover:text-nord-6';
      }

      renderView();
    }

    function selectEntityFilter(id) {
      selectedEntityId = id;
      renderView();
    }

    /* =========================================================================
       主渲染控制器
       ========================================================================= */
    async function renderView() {
      const db = await loadProfileData(currentProfileKey);
      if (!db) return;

      if (currentMainTab === 'banks') {
        renderBanksView(db);
      } else if (currentMainTab === 'cards') {
        renderCardsView(db);
      } else if (currentMainTab === 'bills') {
        renderBillsView(db);
      } else if (currentMainTab === 'installments') {
        renderInstallmentsView(db);
      }
    }

    /* -------------------------------------------------------------------------
       工具：推算未發生月份 (11月、12月) 的銀行理論滾算餘額與卡費常態推估值
       ------------------------------------------------------------------------- */
    function getCardAvgAmount(card) {
      const active = card.records.filter(r => r.amount !== null);
      if (active.length === 0) return 0;
      return Math.round(active.reduce((s, r) => s + r.amount, 0) / active.length);
    }

    function getFutureBankProjectedBalance(db, bank, targetMonth) {
      // 以 2026/10 實際餘額為基準，往後滾算 (targetMonth = 11 或 12)
      const octSnap = db.bankSnapshots.find(s => s.year === 2026 && s.month === 10 && s.bankId === bank.id);
      let bal = octSnap ? octSnap.balance : bank.balance;
      for (let m = 11; m <= targetMonth; m++) {
        const salary = bank.defaultSalary || 0;
        const directBills = db.recurringBills
          .filter(b => b.paymentMethod === 'bank_direct' && b.targetId === bank.id && b.activeMonths.includes(m))
          .reduce((sum, b) => sum + b.defaultAmount, 0);
        const boundCardsAvg = db.cards
          .filter(c => c.bankId === bank.id)
          .reduce((sum, c) => sum + getCardAvgAmount(c), 0);
        bal = bal + salary - directBills - boundCardsAvg;
      }
      return bal;
    }

    /* -------------------------------------------------------------------------
       分頁 A：銀行餘額
       ------------------------------------------------------------------------- */
    function renderBanksView(db) {
      const slots = getActiveSlots();
      const labels = slots.map(s => s.label);

      const latestSnaps = db.bankSnapshots.filter(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH);
      const totalBalance = latestSnaps.reduce((sum, s) => sum + s.balance, 0);
      const totalPending = latestSnaps.reduce((sum, s) => sum + s.pendingBills + s.pendingCards, 0);
      const totalProjected = latestSnaps.reduce((sum, s) => sum + s.projectedBalance, 0);

      document.getElementById('kpi-cards-row').innerHTML = `
        <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-4 flex items-center justify-between">
          <div>
            <span class="text-xs text-nord-4 block mb-1">銀行總餘額</span>
            <span class="text-2xl font-bold font-mono text-nord-14 masked-amount">NT$ ${formatCurrency(totalBalance)}</span>
          </div>
          <div class="w-10 h-10 rounded-xl bg-nord-14/15 text-nord-14 flex items-center justify-center">
            <i class="fa-solid fa-building-columns"></i>
          </div>
        </div>
        <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-4 flex items-center justify-between">
          <div>
            <span class="text-xs text-nord-4 block mb-1">本月待扣總額</span>
            <span class="text-2xl font-bold font-mono text-nord-11 masked-amount">-NT$ ${formatCurrency(totalPending)}</span>
          </div>
          <div class="w-10 h-10 rounded-xl bg-nord-11/15 text-nord-11 flex items-center justify-center">
            <i class="fa-solid fa-arrow-trend-down"></i>
          </div>
        </div>
        <div class="bg-nord-1/80 border border-nord-2 rounded-2xl p-4 flex items-center justify-between">
          <div>
            <span class="text-xs text-nord-4 block mb-1">扣後預估結餘</span>
            <span class="text-2xl font-bold font-mono text-nord-8 masked-amount">NT$ ${formatCurrency(totalProjected)}</span>
          </div>
          <div class="w-10 h-10 rounded-xl bg-nord-8/15 text-nord-8 flex items-center justify-center">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
        </div>
      `;

      document.getElementById('chart-dot').className = 'w-2.5 h-2.5 rounded-full bg-nord-9';
      document.getElementById('chart-title').innerText = '銀行餘額';
      document.getElementById('chart-subtitle').innerText = chartRangeMode === 'rolling12'
        ? '2025/11 ~ 2026/10 (連續 12 個月)'
        : '2026/01 ~ 2026/12 (11~12月為自動滾算推估虛線)';

      const pillsHtml = [
        `<button onclick="selectEntityFilter('all')" class="px-3 py-1 rounded-lg text-xs font-semibold transition-all ${selectedEntityId === 'all' ? 'bg-nord-9 text-nord-0' : 'bg-nord-0 text-nord-4 hover:text-nord-6'}">全部銀行</button>`,
        ...db.banks.map(b => `
          <button onclick="selectEntityFilter('${b.id}')" class="px-3 py-1 rounded-lg text-xs font-semibold transition-all ${selectedEntityId === b.id ? 'bg-nord-9 text-nord-0' : 'bg-nord-0 text-nord-4 hover:text-nord-6'}">${b.name}</button>
        `)
      ].join('');
      document.getElementById('chart-filter-pills').innerHTML = pillsHtml;

      const palette = ['#88C0D0', '#A3BE8C', '#EBCB8B', '#B48EAD', '#D08770'];
      let datasets = [];

      if (selectedEntityId === 'all') {
        // 實際總餘額：未發生月份設為 null (不畫實線，避免歸零誤解)
        const actualSeries = slots.map(slot => {
          if (slot.isFuture) return null;
          return db.bankSnapshots
            .filter(s => s.year === slot.year && s.month === slot.month)
            .reduce((sum, s) => sum + s.balance, 0);
        });

        datasets.push({
          label: '實際總餘額',
          data: actualSeries,
          borderColor: '#88C0D0',
          backgroundColor: 'rgba(136, 192, 208, 0.12)',
          borderWidth: 3,
          pointRadius: 4,
          pointBackgroundColor: '#88C0D0',
          fill: true,
          tension: 0.3
        });

        // 當年度模式下：額外畫出 10月 連向 11月、12月 的「未發生月份理論推估虛線」
        if (chartRangeMode === 'ytd') {
          const forecastSeries = slots.map((slot, idx) => {
            if (idx < 9) return null; // 1~9月不重複畫
            if (idx === 9) return actualSeries[9]; // 10月錨點接合
            return db.banks.reduce((sum, b) => sum + getFutureBankProjectedBalance(db, b, slot.month), 0);
          });
          datasets.push({
            label: '未發生月份推估 (自動滾算)',
            data: forecastSeries,
            borderColor: '#88C0D0',
            borderDash: [6, 4],
            borderWidth: 2.5,
            pointRadius: 4,
            pointBackgroundColor: '#242933',
            pointBorderColor: '#88C0D0',
            pointBorderWidth: 2,
            fill: false,
            tension: 0.3
          });
        }

        if (db.banks.length > 1) {
          db.banks.forEach((b, idx) => {
            const color = palette[(idx + 1) % palette.length];
            const series = slots.map(slot => {
              if (slot.isFuture) return getFutureBankProjectedBalance(db, b, slot.month);
              const snap = db.bankSnapshots.find(s => s.year === slot.year && s.month === slot.month && s.bankId === b.id);
              return snap ? snap.balance : 0;
            });
            datasets.push({
              label: b.name,
              data: series,
              borderColor: color,
              borderWidth: 1.8,
              pointRadius: 3,
              pointBackgroundColor: ctx => slots[ctx.dataIndex]?.isFuture ? '#242933' : color,
              pointBorderColor: color,
              segment: {
                borderDash: ctx => slots[ctx.p1DataIndex]?.isFuture ? [5, 4] : undefined
              },
              fill: false,
              tension: 0.3
            });
          });
        }
      } else {
        const bank = db.banks.find(b => b.id === selectedEntityId) || db.banks[0];
        const actualSeries = slots.map(slot => {
          if (slot.isFuture) return null;
          const snap = db.bankSnapshots.find(s => s.year === slot.year && s.month === slot.month && s.bankId === bank.id);
          return snap ? snap.balance : 0;
        });
        const theoSeries = slots.map(slot => {
          if (slot.isFuture) return getFutureBankProjectedBalance(db, bank, slot.month);
          const snap = db.bankSnapshots.find(s => s.year === slot.year && s.month === slot.month && s.bankId === bank.id);
          return snap ? snap.theoreticalBalance : 0;
        });

    /* -------------------------------------------------------------------------
       分頁 D：分期付款
       ------------------------------------------------------------------------- */
    function renderInstallmentsView(db) {
      const slots = getActiveSlots();
      const labels = slots.map(s => s.label);

      function getInstAmountForMonth(inst, y, m) {
        const periodIdx = (y - inst.startYear) * 12 + (m - inst.startMonth) + 1;
        if (periodIdx === 1) return inst.firstPeriodAmount;
        if (periodIdx > 1 && periodIdx <= inst.totalPeriods) return inst.regularPeriodAmount;
        return 0;
      }

      const monthlyBurnSeries = slots.map(slot =>
        db.installments.reduce((sum, inst) => sum + getInstAmountForMonth(inst, slot.year, slot.month), 0)
      );

      let totalRemaining = 0;
      const octIdx = slots.findIndex(s => s.year === CURRENT_YEAR && s.month === CURRENT_MONTH);
      let octBurn = monthlyBurnSeries[octIdx >= 0 ? octIdx : 0];
      let activeCount = 0;

      db.installments.forEach(inst => {
        const currentPeriodIdx = (CURRENT_YEAR - inst.startYear) * 12 + (CURRENT_MONTH - inst.startMonth) + 1;
        const leftPeriods = Math.max(0, inst.totalPeriods - currentPeriodIdx);
        if (currentPeriodIdx >= 1 && currentPeriodIdx <= inst.totalPeriods) {
          activeCount++;
        }
        totalRemaining += leftPeriods * inst.regularPeriodAmount;

       ========================================================================= */
    const futureZonePlugin = {
      id: 'futureZonePlugin',
      beforeDraw(chart, args, options) {
        if (!options || !options.hasFutureZone) return;
        const { ctx, chartArea: { top, bottom, right }, scales: { x } } = chart;
        // 第 9 索引為 10月 (目前月份)，第 10、11 索引為 11月、12月 (未發生月份)
        const boundaryX = x.getPixelForValue(9);
        if (!boundaryX) return;

        ctx.save();
        // 1. 塗上未發生月份淡色區隔背景
        ctx.fillStyle = 'rgba(76, 86, 106, 0.18)';
        ctx.fillRect(boundaryX, top, right - boundaryX, bottom - top);

        // 2. 畫出 10月 (目前) 與 11月 (未發生) 的分界虛線
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(235, 203, 139, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(boundaryX, top);
        ctx.lineTo(boundaryX, bottom);
        ctx.stroke();

        // 3. 右上角標示「未發生月份 (推估區間)」避免誤認為真實已發生數據
        ctx.fillStyle = '#EBCB8B';
        ctx.font = '600 11px "Inter", "Noto Sans TC", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('未發生月份 (推估區間)', right - 8, top + 16);
        ctx.restore();
      }
    };

    function drawLineChart(labels, datasets, slots) {
      const ctx = document.getElementById('main-line-chart').getContext('2d');
      if (lineChartInstance) {
        lineChartInstance.destroy();
      }

      const hasFuture = slots.some(s => s.isFuture);

      lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets
        },
        plugins: [futureZonePlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            futureZonePlugin: {
              hasFutureZone: hasFuture
            },
            legend: {
              labels: {
                color: '#D8DEE9',
                font: { family: "'Inter', 'Noto Sans TC', sans-serif", size: 12 },
                usePointStyle: true,
                boxWidth: 8
              }
            },
            tooltip: {
              backgroundColor: 'rgba(46, 52, 64, 0.95)',
              titleColor: '#ECEFF4',
              bodyColor: '#D8DEE9',
              borderColor: '#4C566A',
              borderWidth: 1,
              padding: 12,
              callbacks: {
                title: function(items) {
                  if (!items.length) return '';
                  const idx = items[0].dataIndex;
                  const slot = slots[idx];
                  return slot && slot.isFuture
                    ? `${slot.year}年 ${slot.month}月 — 尚未發生 (推估預覽)`
                    : `${slot.year}年 ${slot.month}月 (已發生)`;
                },
                label: function(context) {
                  const val = context.parsed.y;
                  const slot = slots[context.dataIndex];
                  if (val === null || val === undefined) return null;
                  const suffix = (slot && slot.isFuture) ? ' (推估)' : '';
                  return `${context.dataset.label}: NT$ ${formatCurrency(val)}${suffix}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(76, 86, 106, 0.25)' },
              ticks: {
                color: (c) => (slots[c.index] && slots[c.index].isFuture) ? '#EBCB8B' : '#D8DEE9',
                font: { family: "'JetBrains Mono', monospace", size: 11 }
              }
            },
            y: {
              grid: { color: 'rgba(76, 86, 106, 0.25)' },
              ticks: {
                color: '#D8DEE9',
                font: { family: "'JetBrains Mono', monospace", size: 11 },
                callback: function(value) {
                  if (value >= 10000) return `${(value / 10000).toFixed(0)}萬`;
                  return value;
                }
              }
            }
          }
        }
      });
    }
