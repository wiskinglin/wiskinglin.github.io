<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="auto" style="background:#1e222a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei',sans-serif; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.3);">
  <defs>
    <!-- 箭頭 -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#88C0D0"/>
    </marker>
  </defs>

  <!-- 頂部標題列 -->
  <rect x="0" y="0" width="940" height="52" fill="#242933" rx="12"/>
  <circle cx="28" cy="26" r="6" fill="#BF616A"/>
  <circle cx="48" cy="26" r="6" fill="#EBCB8B"/>
  <circle cx="68" cy="26" r="6" fill="#A3BE8C"/>
  <text x="470" y="32" fill="#D8DEE9" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">PocketMoney「新月份重置」與「30 號自動扣繳」月度循環生命週期流程圖</text>

  <!-- 階段一 -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="260" height="370" rx="10" fill="#2E3440" stroke="#5E81AC" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#5E81AC"/>
    <text x="130" y="23" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">【階段一】月初 1~10 號帳單期</text>
    
    <rect x="15" y="50" width="230" height="60" rx="6" fill="#3B4252"/>
    <text x="25" y="72" fill="#88C0D0" font-size="12" font-weight="bold">點擊「新月份重置」</text>
    <text x="25" y="93" fill="#ECEFF4" font-size="11">👉 全卡 paid = false (待繳)</text>
    <text x="25" y="105" fill="#A3BE8C" font-size="10">🔒 核心特性：絕不更動銀行餘額！</text>

    <rect x="15" y="125" width="230" height="70" rx="6" fill="#3B4252"/>
    <text x="25" y="147" fill="#EBCB8B" font-size="12" font-weight="bold">更新最新當期消費總額</text>
    <text x="25" y="167" fill="#D8DEE9" font-size="11">收到各家銀行結帳通知後</text>
    <text x="25" y="183" fill="#D8DEE9" font-size="11">填入每張卡片本期應繳金額</text>

    <rect x="15" y="210" width="230" height="70" rx="6" fill="#3B4252"/>
    <text x="25" y="232" fill="#88C0D0" font-size="12" font-weight="bold">週期固定費用切換</text>
    <text x="25" y="252" fill="#D8DEE9" font-size="11">已繳項目自動撥回待繳</text>
    <text x="25" y="268" fill="#D8DEE9" font-size="11">雙月帳單可切換免繳/待繳</text>

    <rect x="15" y="295" width="230" height="55" rx="6" fill="#242933" stroke="#4C566A"/>
    <text x="130" y="320" fill="#81A1C1" font-size="11" text-anchor="middle">系統自動展開新月份歸戶</text>
    <text x="130" y="336" fill="#81A1C1" font-size="11" text-anchor="middle">準備進入水位安全監控</text>
  </g>

  <!-- 連線 1 ➔ 2 -->
  <line x1="290" y1="265" x2="330" y2="265" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 階段二 -->
  <g transform="translate(340, 80)">
    <rect x="0" y="0" width="260" height="370" rx="10" fill="#2E3440" stroke="#88C0D0" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#88C0D0"/>
    <text x="130" y="23" fill="#2E3440" font-size="13" font-weight="bold" text-anchor="middle">【階段二】月中 10~29 號監控期</text>

    <rect x="15" y="50" width="230" height="75" rx="6" fill="#3B4252"/>
    <text x="25" y="72" fill="#88C0D0" font-size="12" font-weight="bold">自動對齊歸戶銀行</text>
    <text x="25" y="93" fill="#D8DEE9" font-size="11">信用卡透過 bankId 綁定扣款銀行</text>
    <text x="25" y="109" fill="#D8DEE9" font-size="11">水電房租固定支出同步自動計入</text>

    <rect x="15" y="140" width="230" height="95" rx="6" fill="#3B4252"/>
    <text x="25" y="162" fill="#ECEFF4" font-size="12" font-weight="bold">雙重水位即時預警</text>
    <rect x="25" y="172" width="210" height="24" rx="4" fill="#2E3440"/>
    <text x="35" y="188" fill="#A3BE8C" font-size="11" font-weight="bold">🟢 綠燈：餘額充足，扣款無虞</text>
    <rect x="25" y="202" width="210" height="24" rx="4" fill="#2E3440"/>
    <text x="35" y="218" fill="#BF616A" font-size="11" font-weight="bold">🔴 紅燈：餘額不足，警示差額缺口</text>

    <rect x="15" y="250" width="230" height="100" rx="6" fill="#242933" stroke="#4C566A"/>
    <text x="25" y="275" fill="#EBCB8B" font-size="12" font-weight="bold">防禦性資金調度</text>
    <text x="25" y="297" fill="#D8DEE9" font-size="11">距離扣款日還有 15~20 天</text>
    <text x="25" y="315" fill="#D8DEE9" font-size="11">使用者從容自主力戶轉帳補足</text>
    <text x="25" y="333" fill="#A3BE8C" font-size="11">杜絕信用扣分與高額違約金！</text>
  </g>

  <!-- 連線 2 ➔ 3 -->
  <line x1="600" y1="265" x2="640" y2="265" stroke="#88C0D0" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 階段三 -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="260" height="370" rx="10" fill="#2E3440" stroke="#A3BE8C" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#A3BE8C"/>
    <text x="130" y="23" fill="#2E3440" font-size="13" font-weight="bold" text-anchor="middle">【階段三】月底 30 號扣繳結算</text>

    <rect x="15" y="50" width="230" height="75" rx="6" fill="#3B4252"/>
    <text x="25" y="72" fill="#A3BE8C" font-size="12" font-weight="bold">執行「30 號全數扣款」</text>
    <text x="25" y="93" fill="#ECEFF4" font-size="11">銀行存款餘額真實扣除待扣金額</text>
    <text x="25" y="109" fill="#88C0D0" font-size="11">支援單行扣款或一鍵全扣模擬</text>

    <rect x="15" y="140" width="230" height="85" rx="6" fill="#3B4252"/>
    <text x="25" y="162" fill="#ECEFF4" font-size="12" font-weight="bold">自動批量標記結清</text>
    <text x="25" y="184" fill="#D8DEE9" font-size="11">✔ 所有信用卡 ➔ paid = true (已繳)</text>
    <text x="25" y="202" fill="#D8DEE9" font-size="11">✔ 待繳費用 ➔ status = 'paid' (已繳)</text>

    <rect x="15" y="240" width="230" height="110" rx="6" fill="#242933" stroke="#4C566A"/>
    <text x="25" y="265" fill="#88C0D0" font-size="12" font-weight="bold">結算完成，警報解除</text>
    <text x="25" y="287" fill="#D8DEE9" font-size="11">待扣款總額歸零 (NT$ 0)</text>
    <text x="25" y="305" fill="#D8DEE9" font-size="11">總覽儀表板呈現各行真實淨餘額</text>
    <text x="25" y="325" fill="#A3BE8C" font-size="11" font-weight="bold">安心迎接下一個月現金流循環！</text>
  </g>
</svg>
