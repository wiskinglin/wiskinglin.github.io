<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLIO Dev Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #e5e5e5;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(244, 63, 94, 0.1) 0%, transparent 40%);
        }
        .glass-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .menu-item:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.15);
            background: rgba(255, 255, 255, 0.03);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full glass-card rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="flex flex-col items-center text-center mb-8">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Navigation Menu</h1>

        </div>

        <div class="space-y-3">
            <a href="index.html" class="menu-item block p-4 rounded-2xl border border-zinc-800/80 transition-all duration-300 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-lg">💻</span>
                    <span class="font-bold text-white text-sm">Dev Workspace Index</span>
                </div>
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <a href="../index.html" class="menu-item block p-4 rounded-2xl border border-zinc-800/80 transition-all duration-300 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-lg">🏠</span>
                    <span class="font-bold text-white text-sm">Platform Home</span>
                </div>
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <a href="ideas/ideas.html" class="menu-item block p-4 rounded-2xl border border-zinc-800/80 transition-all duration-300 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-lg">✨</span>
                    <span class="font-bold text-white text-sm">Ideas Lab Index</span>
                </div>
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
        </div>

        <div class="mt-8 border-t border-zinc-800/80 pt-6 text-center">

        </div>

</html>
