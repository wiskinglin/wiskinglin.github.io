<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLIO. — Think Smart, Look Amazing</title>
  <meta name="description" content="KLIO. Think Smart, Look Amazing — 聚焦科技與 AI、商業與市場、生活與設計的深度研究與知識庫。">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/klio-design.css?v=20261125">
  <script src="./assets/js/klio-shell.js?v=20261125" data-klio-shell data-base="./" data-active="reports"></script>
</head>

<body>
  <main class="klio-container">
    <section id="klio-frontpage-hero" aria-label="頭條專題與編輯嚴選"></section>

    <section class="klio-controls-bar" style="margin-bottom:24px;" aria-label="筆記分類與搜尋">
      <div class="klio-tabs" id="klio-category-tabs" role="tablist" aria-label="筆記主題分類"></div>
      <div class="klio-search-group">
        <label for="klio-search-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">搜尋筆記</label>
        <input id="klio-search-input" class="klio-input" type="search" placeholder="搜尋筆記標題、主題或關鍵字...">
        <label for="klio-sort-select" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">排序方式</label>
        <select id="klio-sort-select" class="klio-select" aria-label="排序方式">
          <option value="newest">最新優先</option>
          <option value="oldest">最早優先</option>
        </select>
      </div>
    </section>

    <div id="klio-results-area" aria-live="polite"></div>
  </main>

  <script src="./assets/js/klio-reports-data.js"></script>
  <script>
    (function () {
      var reports = window.KLIO_REPORTS || [];
      var categories = window.KLIO_REPORTS_CATEGORIES || [];

      var params = new URLSearchParams(window.location.search);
      var initialCat = params.get('cat');
      var validCats = categories.map(function (c) { return c.id; });
      var activeCategory = validCats.indexOf(initialCat) !== -1 ? initialCat : 'all';
      var searchQuery = '';
      var sortOrder = 'newest';

      var heroEl = document.getElementById('klio-frontpage-hero');
      var tabsEl = document.getElementById('klio-category-tabs');
      var resultsEl = document.getElementById('klio-results-area');
      var searchInput = document.getElementById('klio-search-input');
      var sortSelect = document.getElementById('klio-sort-select');

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function getCount(catId) {
        if (catId === 'all') return reports.length;
        return reports.filter(function (r) { return r.category === catId; }).length;
      }

      function setCategory(catId) {
        activeCategory = catId;
        var url = new URL(window.location.href);
        if (activeCategory === 'all') url.searchParams.delete('cat');
        else url.searchParams.set('cat', activeCategory);
        window.history.replaceState({}, '', url.toString());
        renderTabs();
        renderAll();
      }

      var COVER_FILE = '20260817_ai_trend_sovereignty.html';
      var PICK_FILES = ['20260512_zipcar.html', '20260610_cloudflare.html', '20260616_loop_engineering.html'];

      function renderFrontHero() {
        var showHero = activeCategory === 'all' && !searchQuery.trim() && sortOrder === 'newest';
        if (!showHero) {
          heroEl.innerHTML = '';
          return;
        }
        var lead = reports.find(function (r) { return r.file === COVER_FILE; }) || reports[0];
        var picks = PICK_FILES.map(function (f) {
          return reports.find(function (r) { return r.file === f; });
        }).filter(Boolean);

        if (!lead) {
          heroEl.innerHTML = '';
          return;
        }

        var kickerClass = 'klio-poster-kicker klio-poster-kicker--' + lead.category;
        var picksHtml = picks.map(function (p, idx) {
          return (
            '<a class="klio-pick-item" href="./reports/' + encodeURIComponent(p.file) + '">' +
              '<span class="klio-pick-num">0' + (idx + 1) + '</span>' +
              '<div>' +
                '<div class="klio-card-meta">' +
                  '<span class="klio-badge klio-badge--' + p.category + '">' + escapeHtml(p.categoryLabel) + '</span>' +
                  '<span class="klio-date">' + escapeHtml(p.date) + '</span>' +
                '</div>' +
                '<h3 class="klio-pick-title">' + escapeHtml(p.title) + '</h3>' +
                '<p class="klio-pick-desc">' + escapeHtml(p.summary) + '</p>' +
              '</div>' +
            '</a>'
          );
        }).join('');

        heroEl.innerHTML =
          '<div class="klio-gq-hero">' +
            '<a class="klio-poster-card" style="min-height:420px;margin:0;" href="./reports/' + encodeURIComponent(lead.file) + '">' +
              '<img class="klio-poster-bg" src="' + escapeHtml(lead.cover) + '" alt="' + escapeHtml(lead.title) + '">' +
              '<div class="klio-poster-scrim"></div>' +
              '<div class="klio-poster-body">' +
                '<div class="' + kickerClass + '">' +
                  '<span>COVER STORY</span>' +
                  '<span style="opacity:0.65;">·</span>' +
                  '<span>' + escapeHtml(lead.categoryLabel) + '</span>' +
                  '<span style="opacity:0.65;">·</span>' +
                  '<span>' + escapeHtml(lead.date) + '</span>' +
                '</div>' +
                '<h1 class="klio-poster-title" style="font-size:clamp(1.75rem,3vw,2.45rem);">' + escapeHtml(lead.title) + '</h1>' +
                '<p class="klio-poster-desc">' + escapeHtml(lead.summary) + '</p>' +
                '<div class="klio-poster-cta">閱讀封面專題</div>' +
              '</div>' +
            '</a>' +
            '<aside class="klio-picks-panel" aria-label="編輯嚴選">' +
              '<h2 class="klio-picks-heading">Editor’s Picks · 編輯嚴選</h2>' +
              picksHtml +
            '</aside>' +
          '</div>';
      }

      function renderTabs() {
        tabsEl.innerHTML = categories.map(function (cat) {
          var isActive = cat.id === activeCategory;
          return (
            '<button type="button" class="klio-tab-btn' + (isActive ? ' is-active' : '') + '" ' +
            'role="tab" aria-selected="' + (isActive ? 'true' : 'false') + '" data-cat="' + cat.id + '">' +
            '<span>' + cat.label + '</span>' +
            '<span class="klio-tab-count">' + getCount(cat.id) + '</span>' +
            '</button>'
          );
        }).join('');

        var buttons = tabsEl.querySelectorAll('.klio-tab-btn');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].addEventListener('click', function () {
            setCategory(this.getAttribute('data-cat'));
          });
        }
      }

      function renderAll() {
        renderFrontHero();

        var q = searchQuery.trim().toLowerCase();
        var showHero = activeCategory === 'all' && !q && sortOrder === 'newest';
        var heroSet = {};
        if (showHero) {
          heroSet[COVER_FILE] = true;
          PICK_FILES.forEach(function (f) { heroSet[f] = true; });
        }

        var filtered = reports.filter(function (r) {
          if (heroSet[r.file]) return false;
          if (activeCategory !== 'all' && r.category !== activeCategory) return false;
          if (!q) return true;
          return (
            r.title.toLowerCase().indexOf(q) !== -1 ||
            r.summary.toLowerCase().indexOf(q) !== -1 ||
            r.categoryLabel.toLowerCase().indexOf(q) !== -1
          );
        });

        filtered.sort(function (a, b) {
          if (sortOrder === 'oldest') {
            return a.date.localeCompare(b.date) || a.file.localeCompare(b.file);
          }
          return b.date.localeCompare(a.date) || b.file.localeCompare(a.file);
        });

        if (filtered.length === 0) {
          resultsEl.innerHTML =
            '<div class="klio-empty-state">' +
              '<p style="margin:0 0 12px;font-weight:600;color:var(--klio-text);">找不到符合條件的筆記</p>' +
              '<p style="margin:0 0 16px;font-size:0.9rem;">試著更換分類或清除搜尋關鍵字。</p>' +
              '<button type="button" class="klio-tab-btn is-active" id="klio-reset-filters">顯示全部筆記</button>' +
            '</div>';
          document.getElementById('klio-reset-filters').addEventListener('click', function () {
            searchQuery = '';
            searchInput.value = '';
            setCategory('all');
          });
          return;
        }

        resultsEl.innerHTML =
          '<div class="klio-poster-grid">' +
          filtered.map(function (r, idx) {
            var featuredClass = (idx > 0 && idx % 5 === 0) ? ' is-featured' : '';
            var kickerClass = 'klio-poster-kicker klio-poster-kicker--' + r.category;
            return (
              '<a class="klio-poster-card' + featuredClass + '" href="./reports/' + encodeURIComponent(r.file) + '">' +
                '<img class="klio-poster-bg" src="' + escapeHtml(r.cover) + '" alt="' + escapeHtml(r.title) + '" loading="' + (idx < 3 ? 'eager' : 'lazy') + '">' +
                '<div class="klio-poster-scrim"></div>' +
                '<div class="klio-poster-body">' +
                  '<div class="' + kickerClass + '">' +
                    '<span>' + escapeHtml(r.categoryLabel) + '</span>' +
                    '<span style="opacity:0.65;">·</span>' +
                    '<span style="opacity:0.85;">' + escapeHtml(r.date) + '</span>' +
                  '</div>' +
                  '<h2 class="klio-poster-title">' + escapeHtml(r.title) + '</h2>' +
                  '<p class="klio-poster-desc">' + escapeHtml(r.summary) + '</p>' +
                  '<div class="klio-poster-cta">閱讀深度解析</div>' +
                '</div>' +
              '</a>'
            );
          }).join('') +
          '</div>';
      }

      searchInput.addEventListener('input', function () {
        searchQuery = this.value;
        renderAll();
      });

      sortSelect.addEventListener('change', function () {
        sortOrder = this.value;
        renderAll();
      });

      renderTabs();
      renderAll();
    })();
  </script>
</body>

</html>
