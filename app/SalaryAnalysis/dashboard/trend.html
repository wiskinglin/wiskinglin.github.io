<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2019-2025薪資趨勢分析</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar or Header Menu -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2>📈 公司薪資分析</h2>
                <p>108年 - 114年</p>
            </div>

            <!-- 導覽連結 -->
            <div class="nav-links" style="margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px;">
                <a href="index.html" class="nav-btn"
                    style="background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8;">
                    <span>⬅️ 組織規模與薪資分佈</span>
                </a>
                <a href="trend.html" class="nav-btn"
                    style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #10b981;">
                    <span>📈 各別公司趨勢查詢</span>
                </a>
            </div>

            <div class="search-section" style="display: flex; flex-direction: column; gap: 8px;">
                <label for="companySearch" style="color: var(--text-secondary); font-size: 0.9rem;">快速搜尋：</label>
                <input type="text" id="companySearch" list="companyOptions" placeholder="輸入代號 (如 2330)"
                    style="padding: 12px; border-radius: 8px; border: 1px solid var(--panel-border); background: rgba(0,0,0,0.2); color: white; outline: none; width: 100%;">
                <datalist id="companyOptions">
                    <!-- JS generated -->
                </datalist>
            </div>

            <!-- 歷史紀錄 -->
            <div id="search-history" style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
                <label style="color: var(--text-secondary); font-size: 0.85rem;">近期查詢：</label>
                <div id="history-tags" style="display: flex; flex-wrap: wrap; gap: 8px;">
                    <!-- JS generated -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header glass-panel" style="padding: 16px 24px;">
                <div class="header-left">
                    <h1 id="trend-title" style="margin-bottom: 4px; font-size: 1.8rem;">🏆 各公司薪資分析排行榜</h1>
                    <p id="trend-subtitle" style="color: var(--text-secondary); font-size: 0.95rem;">
                        請在左側搜尋檢視公司薪資趨勢，或參考下方市場排名</p>
                </div>
                <div class="header-right">
                    <button
                        onclick="document.getElementById('companySearch').value=''; document.getElementById('companySearch').dispatchEvent(new Event('change'));"
                        class="nav-btn"
                        style="background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); color: #f59e0b; padding: 10px 20px; font-size: 0.9rem; cursor: pointer;">
                        <span>🏆 返回排行榜</span>
                    </button>
                </div>
            </header>

            <!-- Chart Section -->
            <section class="chart-section" style="margin-top: 0; display: flex; flex-direction: column; flex: 1; min-height: 0;">
                <div id="trend-card" style="display: none; height: 100%; flex-direction: column;">
                    
                    <!-- 快速看板 -->
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px;">
                        <!-- 108年 -->
                        <div class="glass-panel" style="padding: 16px; border-left: 4px solid #38bdf8; border-radius: 8px;">
                            <h3 style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 8px; font-weight: normal;">108年 薪資中位數</h3>
                            <div id="trend-stat-108" style="font-size: 1.8rem; font-weight: bold; color: #fff;">-- 萬</div>
                        </div>
                        <!-- 114年 -->
                        <div class="glass-panel" style="padding: 16px; border-left: 4px solid #10b981; border-radius: 8px;">
                            <h3 style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 8px; font-weight: normal;">114年 薪資中位數</h3>
                            <div id="trend-stat-114" style="font-size: 1.8rem; font-weight: bold; color: #fff; display: flex; align-items: baseline; gap: 12px;">
                                <span>-- 萬</span>
                                <span id="trend-stat-growth" style="font-size: 0.9rem;">--</span>
                            </div>
                        </div>
                        <!-- 歷年數據 -->
                        <div class="glass-panel" style="padding: 12px 16px; border-left: 4px solid #f59e0b; border-radius: 8px; display: flex; flex-direction: column;">
                            <h3 style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 8px; font-weight: normal;">歷年數據明細 (萬元)</h3>
                            <div id="trend-stat-history" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; font-size: 0.85rem; color: #fff;">
                                <!-- JS generated -->
                            </div>
                        </div>
                    </div>

                    <!-- 趨勢圖 -->
                    <div class="chart-container glass-panel" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
                        <div class="chart-header">
                            <h3>歷年薪資中位數趨勢圖 (萬元)</h3>
                        </div>
                        <div class="canvas-wrapper" style="flex: 1; min-height: 0; position: relative;">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </div>

                <div id="empty-state" class="glass-panel"
                    style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px; overflow-y: hidden;">

                    <div style="display: flex; gap: 16px; align-items: stretch; flex: 1; min-height: 0;">
                        
                        <!-- 114年 最高薪資 TOP 10 -->
                        <div
                            style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 16px;">
                            <h3
                                style="color: #38bdf8; margin-bottom: 12px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
                                <span>👑</span> 114年 最高薪資 TOP 10
                            </h3>
                            <ul id="highest10-list"
                                style="list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1;">
                                <!-- JS generated -->
                            </ul>
                        </div>

                        <!-- TOP 10 高速成長 -->
                        <div
                            style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 12px; padding: 16px;">
                            <h3
                                style="color: #10b981; margin-bottom: 12px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
                                <span>🚀</span> TOP 10 高速成長 (108-114)
                            </h3>
                            <ul id="top10-list"
                                style="list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1;">
                                <!-- JS generated -->
                            </ul>
                        </div>

                        <!-- BOTTOM 10 衰退排行 -->
                        <div
                            style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: rgba(244, 63, 94, 0.05); border: 1px solid rgba(244, 63, 94, 0.2); border-radius: 12px; padding: 16px;">
                            <h3
                                style="color: #f43f5e; margin-bottom: 12px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
                                <span>📉</span> BOTTOM 10 衰退排行 (108-114)
                            </h3>
                            <ul id="bottom10-list"
                                style="list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1;">
                                <!-- JS generated -->
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="data.js"></script>
    <script src="trend.js"></script>
</body>

</html>
